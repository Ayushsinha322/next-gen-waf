[workspace]
resolver = "2"
members = [
    "crates/sentinel-core",
    "crates/sentinel-proxy",
    "crates/sentinel-rules",
    "crates/sentinel-modules",
    "crates/sentinel-ml",
    "crates/sentinel-plugins",
    "crates/sentinel-storage",
    "crates/sentinel-telemetry",
    "crates/sentinel-ebpf",
    "crates/sentinel-cli",
    "crates/sentinel-bin",
    "crates/sentinel-srl-validate",
]
# Example plugins are separate crates compiled for wasm32-unknown-unknown with
# crate-type=["cdylib"]. They must not join the workspace: a workspace build
# would try to build them for the host target, where their `env` host-function
# imports cannot resolve.
exclude = ["examples/plugins"]

[workspace.package]
version = "1.1.22"
edition = "2021"
rust-version = "1.75"
authors = ["Sentinel WAF Contributors"]
license = "Apache-2.0"
repository = "https://github.com/your-org/sentinel-waf"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

# HTTP / networking
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1.1"
http-body-util = "0.1"
tower = "0.5"
rustls = "0.23"
tokio-rustls = "0.26"
# HTTP/3 (QUIC transport). Server-only: drop quinn's default `platform-verifier`
# (a client-side native cert verifier that drags in jni/security-framework/windows
# deps) and pin the ring crypto backend so QUIC matches the process-default rustls
# provider installed in sentinel-bin (rustls::crypto::ring).
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"               # HTTP/3 protocol layer
h3-quinn = "0.0.10"        # h3 <-> quinn adapter

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
prost = "0.13"
tonic = "0.12"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Off-thread, lossy stdout for the data plane's log lines; see sentinel-bin.
tracing-appender = "0.2"
opentelemetry = "0.24"
opentelemetry_sdk = "0.24"
opentelemetry-otlp = "0.17"
metrics = "0.23"

# Security / crypto
ring = "0.17"
sha2 = "0.10"
hmac = "0.12"
argon2 = "0.5"
# Edge JWT validation for customer APIs (bearer-token verification in the data
# plane). v9 provides DecodingKey::from_secret/from_rsa_pem/from_ec_pem/from_jwk
# and Validation with iss/aud/exp/nbf/algorithms.
jsonwebtoken = "9"

# Data structures / utils
dashmap = "6"
parking_lot = "0.12"
once_cell = "1"
arc-swap = "1"
bytes = "1"
ahash = "0.8"
smallvec = "1"

# Parsing
nom = "7"

# Pattern matching
regex = "1"
aho-corasick = "1"
hyperscan = "0.3"           # high-perf DPI (optional)

# Plugins / WASM
# 24.x, not 25: 25.0.3 carried 18 advisories (sandbox escapes among them) and
# the 25 line has no patched release; 24.0.4+ is patched and builds on our Rust
# 1.85 toolchain. The supported LTS is 36, which needs Rust 1.86 — move there
# with the toolchain (2026-10-07 review #16).
wasmtime = "24.0.4"
wasmtime-wasi = "24.0.4"

# ML inference
ort = "2.0.0-rc.4"          # ONNX runtime
ndarray = "0.16"
candle-core = "0.7"
candle-nn = "0.7"
candle-transformers = "0.7"

# Storage
# =1.2.2: the newest release whose rust-version (1.85) matches CI; 1.2.3 and
# every later release declare 1.88, so a caret range would break the build. 1.x is
# the line whose async connection setup no longer has 0.24's
# `unreachable!("Multiplexed connection driver unexpectedly terminated")` path,
# and whose ConnectionManager takes connection/response timeouts.
# Default features off: only Lua scripts are used (no streams/geo/bigint).
redis = { version = "=1.2.2", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
rocksdb = "0.22"
sled = "0.34"

# Cluster
raft = "0.7"
openraft = "0.9"

# eBPF
aya = "0.13"
aya-log = "0.2"

# Errors
thiserror = "1"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# IDs
uuid = { version = "1", features = ["v4", "fast-rng"] }

# URL percent-decoding
percent-encoding = "2"

# IP/CIDR matching
ipnet = "2"

# GeoIP (MaxMind GeoLite2)
maxminddb = "0.24"

# TLS utilities
rustls-pemfile = "2"
rcgen = "0.12"    # self-signed cert generation + CSR for per-site TLS
hex = "0.4"

# CLI / system
libc = "0.2"

# Testing
tokio-test = "0.4"
proptest = "1"
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Unwind, deliberately. Under "abort" one panic anywhere — one hostile request
# reaching a slicing bug, a dependency's `unreachable!` — killed the node with
# every site and connection on it. With unwinding the data plane contains a panic
# to the request (500) or background loop (restarted) it happened in; see
# crates/sentinel-proxy/src/panic_guard.rs. Do not switch this back to save
# binary size.
panic = "unwind"

[profile.bench]
opt-level = 3
lto = "fat"
debug = true

[profile.dev]
opt-level = 1               # faster runtime perf in dev
debug = true
