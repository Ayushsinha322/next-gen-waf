[workspace]
resolver = "2"
members = [
    "crates/sentinel-core",
    "crates/sentinel-proxy",
    "crates/sentinel-rules",
    "crates/sentinel-modules",
    "crates/sentinel-ml",
    "crates/sentinel-plugins",
    "crates/sentinel-storage",
    "crates/sentinel-telemetry",
    "crates/sentinel-cluster",
    "crates/sentinel-ebpf",
    "crates/sentinel-cli",
    "crates/sentinel-bin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Sentinel WAF Contributors"]
license = "Apache-2.0"
repository = "https://github.com/your-org/sentinel-waf"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

# HTTP / networking
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1.1"
http-body-util = "0.1"
tower = "0.5"
rustls = "0.23"
tokio-rustls = "0.26"
quinn = "0.11"             # HTTP/3
h3 = "0.0.6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
prost = "0.13"
tonic = "0.12"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.24"
opentelemetry_sdk = "0.24"
opentelemetry-otlp = "0.17"
metrics = "0.23"

# Security / crypto
ring = "0.17"
sha2 = "0.10"
hmac = "0.12"
argon2 = "0.5"

# Data structures / utils
dashmap = "6"
parking_lot = "0.12"
once_cell = "1"
arc-swap = "1"
bytes = "1"
ahash = "0.8"
smallvec = "1"

# Parsing
nom = "7"

# Pattern matching
regex = "1"
aho-corasick = "1"
hyperscan = "0.3"           # high-perf DPI (optional)

# Plugins / WASM
wasmtime = "25"
wasmtime-wasi = "25"

# ML inference
ort = "2.0.0-rc.4"          # ONNX runtime
ndarray = "0.16"
candle-core = "0.7"
candle-nn = "0.7"
candle-transformers = "0.7"

# Storage
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
rocksdb = "0.22"
sled = "0.34"

# Cluster
raft = "0.7"
openraft = "0.9"

# eBPF
aya = "0.13"
aya-log = "0.2"

# Errors
thiserror = "1"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# IDs
uuid = { version = "1", features = ["v4", "fast-rng"] }

# URL percent-decoding
percent-encoding = "2"

# IP/CIDR matching
ipnet = "2"

# GeoIP (MaxMind GeoLite2)
maxminddb = "0.24"

# TLS utilities
rustls-pemfile = "2"
rcgen = "0.12"    # self-signed cert generation for per-site TLS

# CLI / system
libc = "0.2"

# Testing
tokio-test = "0.4"
proptest = "1"
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
opt-level = 3
lto = "fat"
debug = true

[profile.dev]
opt-level = 1               # faster runtime perf in dev
debug = true
