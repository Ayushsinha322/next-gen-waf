SecRule ARGS "@rx (?i)<script" "id:99001,phase:2,block,msg:'XSS: script tag in ARGS',severity:'CRITICAL'"
SecRule ARGS "@rx (?i)on\w+=|javascript:" "id:99002,phase:2,block,msg:'XSS: event handler or javascript URI',severity:'CRITICAL'"
SecRule REQUEST_HEADERS:user-agent "@rx (?i)sqlmap|nikto|nessus|masscan|dirbuster|nmap|burpsuite|acunetix|openvas|havij|nuclei" "id:99003,phase:1,block,msg:'Scanner: known attack tool in User-Agent',severity:'CRITICAL'"
