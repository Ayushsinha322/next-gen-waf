# =============================================================================
# Sentinel WAF — uniform all-placement libinjection detection (Phase 1 coverage)
#
# CRS's own 941/942 rules run @detectXSS / @detectSQLi against ARGS and only a
# couple of NAMED headers (Referer, User-Agent), so injection carried in an
# arbitrary header, any cookie, or the URL path bypasses detection entirely
# (measured: custom-header XSS returned 200). libinjection is a tokeniser, not a
# keyword matcher, so it is high-precision — we run it across EVERY injection
# point. Same transform chains as 941100/942100.
#
# SCORE, NOT bare `block`: both rules carry `setvar:tx.anomaly_score=+10`. +10
# clears the blocking threshold on its own (default 5, 10 in the detection profile),
# so detection strength is unchanged — libinjection alone still blocks. What changes
# is the PATH. A bare `block` is an explicit action the rule VM applies in phase 1,
# which returns the 403 before phase 2 runs and therefore before the ML classifier
# is consulted at all. Routing the same verdict through the anomaly score sends it
# to `apply_verdict`, where the classifier can veto it if it scores the value as
# clearly benign.
#
# That veto is why this matters: running a tokeniser across every header, cookie and
# path segment is a deliberately broad net, and libinjection's known false-positive
# modes are ordinary data — email addresses (`john+or@var.es` decodes to
# `john or@var.es`), apostrophe names, French text (`D'or`). Real injection scores
# 0.9+ on the classifier, so it is never vetoed.
#
# PREREQUISITE, do not separate these: this is only correct because the classifier
# now scores header and cookie values too (sentinel-ml `evaluate`). While it saw
# only path/query/body, a header-borne payload scored ~0 and the veto killed the
# block — measured, `X-Custom: <script>alert(1)</script>` bypassed with a 200.
# =============================================================================

#
# t:base64Decode is last in both chains, added 2026-09-15. GoTestWAF put a
# base64'd MSSQL stacked query into a JSON body and it reached the application:
#
#   MzsvKiBhICovIERFQ0xBUkUgQGMg…  ->  3;/* a */ DECLARE @c varchar(255);…
#                                      EXEC Master.dbo.xp_cmdshell @c;
#
# The SAME payload as a query parameter was a 403 — but caught by the ML
# classifier, not by these rules, and the classifier does not reach it in a JSON
# body. So detection depended on placement, which is exactly the property a
# placement rule exists to remove.
#
# Safe to chain last: base64_decode_transform returns its input UNCHANGED when
# the value will not decode as base64-into-UTF-8, so ordinary values, binary
# blobs and anything containing characters outside the alphabet pass through
# untouched. It also needs 8 characters before it will try at all.
SecRule REQUEST_FILENAME|REQUEST_HEADERS|REQUEST_COOKIES|ARGS_NAMES|ARGS|XML:/* "@detectSQLi" \
    "id:9900100,\
    phase:2,\
    block,\
    capture,\
    t:none,t:utf8toUnicode,t:urlDecodeUni,t:removeNulls,t:base64Decode,\
    setvar:'tx.anomaly_score=+10',\
    msg:'SQL Injection via libinjection (all-placement)',\
    tag:'attack-sqli',\
    severity:'CRITICAL'"

SecRule REQUEST_FILENAME|REQUEST_HEADERS|REQUEST_COOKIES|ARGS_NAMES|ARGS|XML:/* "@detectXSS" \
    "id:9900101,\
    phase:2,\
    block,\
    t:none,t:utf8toUnicode,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:cssDecode,t:removeNulls,t:base64Decode,\
    setvar:'tx.anomaly_score=+10',\
    msg:'XSS via libinjection (all-placement)',\
    tag:'attack-xss',\
    severity:'CRITICAL'"
