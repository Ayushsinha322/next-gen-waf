# =============================================================================
# Sentinel WAF — uniform all-placement libinjection detection (Phase 1 coverage)
#
# CRS's own 941/942 rules run @detectXSS / @detectSQLi against ARGS and only a
# couple of NAMED headers (Referer, User-Agent), so injection carried in an
# arbitrary header, any cookie, or the URL path bypasses detection entirely
# (measured: custom-header XSS returned 200). libinjection is a tokeniser, not a
# keyword matcher, so it is high-precision — we run it across EVERY injection
# point and block on a positive detection. Same transform chains as 941100/942100.
# =============================================================================

SecRule REQUEST_FILENAME|REQUEST_HEADERS|REQUEST_COOKIES|ARGS_NAMES|ARGS|XML:/* "@detectSQLi" \
    "id:9900100,\
    phase:2,\
    block,\
    capture,\
    t:none,t:utf8toUnicode,t:urlDecodeUni,t:removeNulls,\
    msg:'SQL Injection via libinjection (all-placement)',\
    tag:'attack-sqli',\
    severity:'CRITICAL'"

SecRule REQUEST_FILENAME|REQUEST_HEADERS|REQUEST_COOKIES|ARGS_NAMES|ARGS|XML:/* "@detectXSS" \
    "id:9900101,\
    phase:2,\
    block,\
    t:none,t:utf8toUnicode,t:urlDecodeUni,t:htmlEntityDecode,t:jsDecode,t:cssDecode,t:removeNulls,\
    msg:'XSS via libinjection (all-placement)',\
    tag:'attack-xss',\
    severity:'CRITICAL'"
