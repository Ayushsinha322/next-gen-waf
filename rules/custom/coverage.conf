# =============================================================================
# Sentinel WAF — coverage signatures for attack classes CRS 4.x barely covers
# (measured near-0% on the fair benchmark): CRLF/response-splitting + SMTP/IMAP
# (a.k.a. "mail") command injection, LDAP injection, SSTI, and NoSQL injection.
# General attack-class signatures — NOT tuned to any benchmark's exact payloads.
# Double urlDecodeUni handles double-encoding; targets cover every injection
# point INCLUDING the URL path (REQUEST_FILENAME).
#
# -----------------------------------------------------------------------------
# These rules SCORE, they do not decide. Every rule here contributes
# `tx.anomaly_score=+10` — the product's default blocking threshold — and
# carries `pass`.
#
# They used to carry a bare `block`. That is not a style difference: a decisive
# action is applied inside the rule VM during phase 1, which returns before
# `apply_verdict` — the only place the n-gram classifier can veto a
# weak-evidence block. A single regex therefore outranked the classifier, the
# per-site threshold and every other engine, and `?action=fetch` was a 403 on
# any site not switched off. Scoring leaves the verdict where the rest of the
# pipeline can see it.
#
# +10, not +5. The move to scoring (8118edf, 2026-09-13) chose +5 on the
# belief that "5 meets the default threshold of 5". The default threshold is
# 10 — the control plane sends 10 when a site sets none, and the benchmark
# config uses 10 — so from then on a lone match on a class CRS does not cover
# scored 5 and blocked NOTHING. These signatures are the only coverage for
# LDAP, mail, SSTI and much of shell injection: on GoTestWAF (same harness,
# same corpus) detection fell from 99.26% to 87.11% at that commit, LDAP
# 100% -> 42%, SSTI 100% -> 54%, and it stayed there through 1.1.7. The
# false positives that commit fixed are prevented by its tightened patterns
# (coverage_false_positives.rs asserts those requests match NO signature), not
# by the smaller delta. A site with a threshold above 10 has chosen to need
# more than one signal, and gets that.
#
# The delta is written as a literal `+10`, NOT as `%{tx.critical_anomaly_score}`.
# The crs-setup TX variables are not seeded in the running proxy, so the macro
# form would resolve to nothing and these rules would silently score zero.
#
# Anything added here needs a benign case in
# `crates/sentinel-rules/tests/coverage_false_positives.rs` as well as an
# attack case. That test is the guard for both directions.
# =============================================================================

# --- CRLF / HTTP response splitting + SMTP/IMAP command ("mail") injection ----
# A decoded CR/LF immediately followed by an injected HTTP/mail header OR an
# SMTP command verb.
#
# `to`, `from` and `subject` are deliberately NOT in the header alternation.
# They are how an ordinary quoted reply begins a line in any ticketing, webmail
# or comment field ("\r\nSubject: Re: order 123"), which made this rule fire on
# the most common multi-line text a user can type. Mail-header injection that
# actually exfiltrates uses `bcc`/`cc`/`reply-to`, which are kept.
SecRule ARGS|ARGS_NAMES|REQUEST_HEADERS|REQUEST_COOKIES|REQUEST_FILENAME|REQUEST_URI "@rx (?i)[\r\n]+\s*(?:(?:set-cookie|location|refresh|content-(?:type|length|disposition|transfer-encoding)|link|x-[a-z0-9_-]+|cc|bcc|reply-to|mime-version)\s*:|(?:rcpt\s+to|mail\s+from|helo|ehlo|starttls|vrfy|expn|rset|auth\s+(?:login|plain))\b)" \
    "id:9900200,\
    phase:2,\
    pass,\
    setvar:tx.anomaly_score=+10,\
    capture,\
    t:none,t:urlDecodeUni,t:urlDecodeUni,t:removeNulls,t:base64Decode,\
    msg:'CRLF / HTTP-response-splitting / SMTP-IMAP command injection',\
    tag:'attack-protocol',\
    severity:'CRITICAL'"

# --- LDAP injection -----------------------------------------------------------
SecRule ARGS|ARGS_NAMES|REQUEST_HEADERS|REQUEST_COOKIES|REQUEST_FILENAME "@rx (?i)(?:\)\s*\(\s*[|&]|\*\s*\)\s*\(|\(\s*[|&]\s*\(|[*)]\s*\(\s*(?i:uid|cn|objectclass|ou|dc|mail|sn|givenname|userpassword|samaccountname|member)\s*=|\buserPassword\s*:\s*[0-9.]+:)" \
    "id:9900201,\
    phase:2,\
    pass,\
    setvar:tx.anomaly_score=+10,\
    capture,\
    t:none,t:urlDecodeUni,t:urlDecodeUni,t:base64Decode,\
    msg:'LDAP injection (filter metacharacters)',\
    tag:'attack-ldap',\
    severity:'CRITICAL'"

# --- Server-Side Template Injection -------------------------------------------
SecRule ARGS|ARGS_NAMES|REQUEST_HEADERS|REQUEST_COOKIES|REQUEST_FILENAME "@rx (?:\{\{|\$\{|#\{|\{%|<%=?|@\{)[^\r\n]{0,200}?(?:[0-9]{1,4}\s*[*]\s*[0-9]{1,4}|\bconfig\b|\bself\b|\brequest\b|\bapplication\b|__[a-zA-Z]+__|\.__|freemarker|processbuilder|getruntime|classloader|getclass|\bT\(|lipsum|cycler|joiner|namespace|\|\s*(?:safe|attr|join|map)\b)" \
    "id:9900202,\
    phase:2,\
    pass,\
    setvar:tx.anomaly_score=+10,\
    capture,\
    t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:base64Decode,\
    msg:'Server-Side Template Injection',\
    tag:'attack-injection-generic',\
    severity:'CRITICAL'"

# --- NoSQL injection ----------------------------------------------------------
# Mongo operators, db.<collection>.<method>( calls, and JS injection primitives.
#
# `this.<name>` counts only with a COMPARISON after it (==, !=, <, >): that is
# the $where injection primitive (`this.password == 'x'`). A bare `=` matched
# every ordinary JavaScript assignment (`this._popper = null`) — 16 of 400 lines
# of framework source in the hard-benign corpus.
#
# Operators count only as a JSON key or array index (`"$ne"`, `[$ne]`,
# `{$where`): bare, `$type` and `$where` are ordinary GraphQL variables
# (`query($type: String)`), and blocked every such query. `sleep(…)` needs a
# numeric argument ("Sleep (8 hours)" is prose), and `;` before
# var/while/for needs the code after it (`var x =`, `while(…){`) — "…; for
# some reason" was a block. (2026-10-07 review; coverage_precision.rs.)
#
# `new Date(` is NOT here. It is ordinary JavaScript that appears in any posted
# code snippet, and the malicious form — a timing loop — needs the loop context
# that 9900212 already requires (`new Date(); do {`, `while (new Date() -`).
SecRule ARGS|ARGS_NAMES|REQUEST_HEADERS|REQUEST_COOKIES|REQUEST_FILENAME "@rx (?i)(?:[{\[\"']\s*\$(?:where|ne|gt|gte|lt|lte|in|nin|or|and|nor|not|regex|exists|type|mod|all|elemmatch|size|expr|function)\b|\$(?:where|ne|gt|gte|lt|lte|in|nin|or|and|nor|not|regex|exists|type|mod|all|elemmatch|size|expr|function)\b\s*[\"'\]]|db\.[a-z0-9_]+\.(?:find|insert|update|remove|delete|drop|count|aggregate|mapreduce|distinct)\s*\(|\bsleep\s*\(\s*\d+\s*\)|\bthis\.[a-z0-9_]+\s*(?:===?|!==?|<=?|>=?)|;\s*(?:var\s+[a-z_$][\w$]*\s*=|(?:while|for)\s*\([^)]{0,80}\)\s*\{))" \
    "id:9900203,\
    phase:2,\
    pass,\
    setvar:tx.anomaly_score=+10,\
    capture,\
    t:none,t:urlDecodeUni,t:urlDecodeUni,t:base64Decode,\
    msg:'NoSQL injection',\
    tag:'attack-injection-generic',\
    severity:'CRITICAL'"

# --- XXE / XML external entity injection --------------------------------------
# DOCTYPE/ENTITY declarations referencing SYSTEM/PUBLIC or external protocol
# handlers, and standalone XXE/SSRF protocol schemes. Inspects the RAW body
# (DOCTYPE lives in the prolog, not in parsed XML element text). This syntax is
# effectively absent from benign traffic, so false-positives are near-zero.
SecRule REQUEST_BODY|ARGS|REQUEST_HEADERS|XML:/* "@rx (?i)<!(?:doctype|entity)\b[^>]{0,400}?(?:\bsystem\b|\bpublic\b|%[a-z0-9._-]+;|(?:file|https?|ftp|php|jar|netdoc|expect|gopher|data):)|\b(?:file|php|expect|jar|netdoc|gopher)://[^\s\"'<>]" \
    "id:9900204,\
    phase:2,\
    pass,\
    setvar:tx.anomaly_score=+10,\
    capture,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,\
    msg:'XXE / XML external entity injection',\
    tag:'attack-xxe',\
    severity:'CRITICAL'"

# --- SQL injection — evasion supplement to libinjection -----------------------
# High-confidence patterns libinjection can miss: time-based / error-based
# functions, comment-obfuscated UNION SELECT, stacked queries, file primitives.
# Each token is attack-indicative in a request value (near-zero FP). A stacked
# statement after `;` must look like SQL (`update … set`, `delete from`,
# `select … from`) and sleep/benchmark need a SQL argument: "moved; update my
# address" and "Sleep (8 hours)" were blocks. (2026-10-07 review.)
SecRule ARGS|ARGS_NAMES|REQUEST_HEADERS|REQUEST_COOKIES|REQUEST_FILENAME|REQUEST_BODY|XML:/* "@rx (?i)\b(?:sleep|benchmark)\s*\(\s*(?:\d+(?:\.\d+)?\s*[),]|['\"(@]|0x[0-9a-f]|select\b|[a-z_]\w*\s*\()|\b(?:pg_sleep|dbms_pipe\.receive_message|extractvalue|updatexml|load_file)\s*\(|\bwaitfor\s+delay\b|\bunion\b(?:[^a-z]|/\*.*?\*/){1,40}?\bselect\b|;\s*(?:select\b[^;]{0,120}?\bfrom\b|select\s*(?:\*|pg_sleep|sleep|benchmark|version|user|database|load_file|@@\w+|\d)|insert\s+into\b|update\s+[\w.`\"\[\]]+\s+set\b|delete\s+from\b|drop\s+(?:table|database|schema|user|view|function|procedure)\b|alter\s+(?:table|user|database|system)\b|create\s+(?:table|user|database|function|procedure|trigger|view)\b)|\binto\s+(?:out|dump)file\b" \
    "id:9900205,\
    phase:2,\
    pass,\
    setvar:tx.anomaly_score=+10,\
    capture,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:removeComments,t:base64Decode,\
    msg:'SQL injection (evasion supplement)',\
    tag:'attack-sqli',\
    severity:'CRITICAL'"

# --- Shell / OS command injection ---------------------------------------------
# CRS 932 leaves shell-injection weak on the fair benchmark. Two precise layers:
#
# 9900207 (raw-decoded): a shell operator/substitution (`;` `|` `&&` newline
# backtick `$(`) followed by a real system command verb AND a shell continuation
# — the verb must be trailed by a non-letter shell token (path `/`, flag `-x`,
# `$IFS`, `+`, a chained operator, a `scheme://` URL, or end-of-value). Real
# injection (`;cat /etc/passwd`, `|getent$IFS$9hosts`, `` `uname -a` ``,
# `;wget http://x`) always has this; adversarial-benign prose that merely places
# a command word after punctuation ("...a heroine; more than that") is followed
# by an English word (a letter) and so does NOT match. This continuation guard is
# what keeps false-positives near zero while still catching obfuscated commands.
# Prose punctuation (`:` `,` `!` `?`, a bare `.`) is not a shell continuation: a
# multi-line ticket ("…\nmore: the printer is offline") was a block. A `.` still
# counts when a path follows (`cat .env`, `sh ./x`). (2026-10-07 review.)
# A verb IMMEDIATELY followed by `=` or `-` is a key or a compound word, not a
# command: DoubleClick floodlight paths carry `;cat=<id>`, and `; nc-` / `;cat=`
# were 1,000+ of the false blocks on open-appsec's real-traffic dataset with not
# one attack among them. After whitespace or $IFS a `-` still counts (`nc -e`).
SecRule ARGS|ARGS_NAMES|REQUEST_HEADERS|REQUEST_COOKIES|REQUEST_FILENAME|REQUEST_BODY|XML:/* "@rx (?i)(?:[;\x60\x0a\x0d]|\|+|&&|\$\()\s*(?:\$\{?ifs\}?\s*)?(?:/(?:usr/|local/)*s?bin/)?(?:cat|head|tail|less|more|nl|strings|nc|ncat|netcat|wget|curl|fetch|getent|bash|zsh|ksh|dash|sh|whoami|uname|ifconfig|ipconfig|nslookup|chmod|chown|mkfifo|mknod|nohup|crontab|useradd|userdel|xxd|base64|openssl|telnet|tftp|nmap|socat|msfvenom|powershell|pwsh|certutil|systeminfo|tasklist|pkill|passwd|python[0-9.]*|perl|ruby|sleep|ping|scp|echo|printf|set|env|export)(?:(?:\s|\$\{?ifs\}?)+(?:[^a-z_\s:,.!?]|\.[/a-z0-9_]|[a-z][a-z0-9.+-]*://|$)|[^a-z_\s:,.!?=\-]|\.[/a-z0-9_]|[a-z][a-z0-9.+-]*://|$)" \
    "id:9900207,\
    phase:2,\
    pass,\
    setvar:tx.anomaly_score=+10,\
    capture,\
    t:none,t:urlDecodeUni,t:urlDecodeUni,t:removeNulls,t:base64Decode,\
    msg:'OS command injection (operator + command)',\
    tag:'attack-rce',\
    severity:'CRITICAL'"

# 9900208 (cmdLine-normalized): after t:cmdLine collapses quote/backslash/caret
# obfuscation (`c"a"t /e''tc/passwd` -> `cat /etc/passwd`), match a file-read
# command against a sensitive target, a reverse/interactive shell (`bash -i`,
# `nc -e`, `/bin/sh`), or download-pipe-exec. Command + sensitive target ⇒ near-0 FP.
SecRule ARGS|ARGS_NAMES|REQUEST_HEADERS|REQUEST_COOKIES|REQUEST_FILENAME|REQUEST_BODY|XML:/* "@rx (?i)(?:(?:cat|less|more|head|tail|nl|strings) */?(?:etc/(?:passwd|shadow|group)|proc/self/(?:environ|cmdline))|(?:bash|sh|dash|zsh|ksh) +-[a-z]*i|nc(?:at)? +[^|;&]{0,80}-e\b|/bin/(?:ba|z|k|da)?sh\b|(?:wget|curl) +[^|;&]{0,200}[|&]+ *(?:ba)?sh\b)" \
    "id:9900208,\
    phase:2,\
    pass,\
    setvar:tx.anomaly_score=+10,\
    capture,\
    t:none,t:urlDecodeUni,t:urlDecodeUni,t:removeNulls,t:cmdLine,t:base64Decode,\
    msg:'OS command injection (obfuscated command / reverse shell)',\
    tag:'attack-rce',\
    severity:'CRITICAL'"

# --- XSS — evasion supplement to libinjection ---------------------------------
# Tight: requires an injection VECTOR (script/event-handler/javascript:/data:)
# AND a scripting SINK (alert/eval/document.cookie/window/…). The paired
# requirement keeps benign HTML/JS-discussing text from matching.
#
# The bare-word sinks must look like a CALL (`alert(`, `` eval` ``). As plain
# words they are ordinary English inside ordinary markup: `<input value="Confirm
# order">` paired `<input` with `confirm` and returned 403 on any CMS or comment
# field that accepts HTML.
SecRule ARGS|ARGS_NAMES|REQUEST_HEADERS|REQUEST_COOKIES|REQUEST_FILENAME|REQUEST_BODY|XML:/* "@rx (?i)(?:<\s*(?:script|svg|img|iframe|body|details|marquee|video|audio|object|embed|math|style|form|input|textarea|button|base)\b|\bon(?:error|load|click|mouseover|focus|toggle|animationstart|animationend|pointerover|pointerenter|beforetoggle|begin|start|scroll|wheel|mouseenter|change)\s*=|javascript\s*:|data\s*:\s*text/html)[^>]{0,300}?(?:(?:alert|prompt|confirm|eval|atob|fetch)\s*[\(\x60]|document\s*\.\s*(?:cookie|domain|location|write)|window\s*\.|expression\s*\(|import\s*\(|\.constructor)" \
    "id:9900206,\
    phase:2,\
    pass,\
    setvar:tx.anomaly_score=+10,\
    capture,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:base64Decode,\
    msg:'XSS (evasion supplement)',\
    tag:'attack-xss',\
    severity:'CRITICAL'"

# --- XSS — method-invocation and optional-chaining supplement ------------------
# Catches XSS that uses .call()/.apply()/.bind() to invoke JS functions, and
# modern optional-chaining syntax alert?.(...). These patterns are absent from
# CRS and libinjection but common in modern XSS payloads.
SecRule ARGS|ARGS_NAMES|REQUEST_HEADERS|REQUEST_COOKIES|REQUEST_FILENAME|REQUEST_BODY|XML:/* "@rx (?i)\b(?:alert|confirm|prompt|eval)\s*\.\s*(?:call|apply|bind)\s*\(\s*(?:null|this|window|globalThis|\s)\s*,|\b(?:alert|confirm|prompt|eval)\s*\?\.\s*\(|document\s*\[[\"'](?:cookie|domain|location|write)[\"']\]" \
    "id:9900211,\
    phase:2,\
    pass,\
    setvar:tx.anomaly_score=+10,\
    capture,\
    t:none,t:urlDecodeUni,t:urlDecodeUni,t:htmlEntityDecode,t:base64Decode,\
    msg:'XSS (method-invocation / optional-chaining)',\
    tag:'attack-xss',\
    severity:'CRITICAL'"

# --- Mail / SMTP-IMAP command injection — extended coverage --------------------
# 9900200 handles CRLF-prefixed SMTP commands; this rule catches raw protocol
# verbs sent as a whole parameter value.
#
# The SMTP branch lists only verbs that are not English words (`helo`, `ehlo`,
# `vrfy`, `expn`, `rset`, `starttls`) or are multi-word (`rcpt to`, `mail from`,
# `auth login`). `turn` and `noop` were removed: "turn left at the lights" is
# not an SMTP session.
#
# The IMAP branch REQUIRES a real tagged-command prefix containing a digit
# (`a001 FETCH`, `A1 IDLE`). The tag used to be optional, so a bare `fetch`,
# `idle`, `append`, `namespace` or `status` as a parameter value was a 403 —
# and those are among the most ordinary values an application ever sends. The
# file's own comment already claimed these generic words were excluded; the
# pattern did not match the comment.
SecRule ARGS|ARGS_NAMES|REQUEST_FILENAME|REQUEST_URI|REQUEST_BODY|XML:/* "@rx (?i)^\s*(?:rcpt\s+to|mail\s+from|helo|ehlo|starttls|vrfy|expn|rset|auth\s+(?:login|plain))\b|^\s*[a-zA-Z]{0,8}[0-9]{1,5}\s+(?:capability|examine|subscribe|unsubscribe|lsub|append|expunge|uid\s+(?:fetch|search|copy|move|store)|idle|namespace|setquota|getquota|getacl|setacl|deleteacl|listrights|myrights|status\s+(?:messages|uid|mailbox)|fetch|select|login|logout|noop|close|search|store|copy|list|quit)\b|^\s*imap\s" \
    "id:9900209,\
    phase:2,\
    pass,\
    setvar:tx.anomaly_score=+10,\
    capture,\
    t:none,t:urlDecodeUni,t:urlDecodeUni,t:base64Decode,\
    msg:'Mail / SMTP-IMAP command injection',\
    tag:'attack-protocol',\
    severity:'CRITICAL'"

# --- Scanner / automated tool User-Agent detection -----------------------------
# CRS 913100 covers some scanners but misses OpenVAS, Nuclei, ffuf, and
# Burp Collaborator URLs in User-Agent headers. These are high-confidence
# attack indicators with near-zero FP in production traffic.
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(?:OpenVAS|Nuclei|Fuzz\s+Faster\s+U\s+Fool|mercuryboard_user_agent|burpcollaborator\.net|\.nasl'|AppScan|Netsparker|Acunetix|w3af|Vega\s+Scanner|ZAP\s+Proxy|sqlmap/|nikto|gobuster|dirbuster|wfuzz|patator|hydra|medusa|[a-z0-9]{15,}\.burpcollaborator\.net|[a-z0-9]{10,}\.oastify\.com|[a-z0-9]{10,}\.interactsh\.com)" \
    "id:9900210,\
    phase:2,\
    pass,\
    setvar:tx.anomaly_score=+10,\
    capture,\
    t:none,t:urlDecodeUni,\
    msg:'Automated scanner / security tool detected',\
    tag:'attack-automation',\
    severity:'CRITICAL'"

# --- NoSQL injection — extended coverage --------------------------------------
# 9900203 covers MongoDB operators and db.collection.method() calls. This rule
# adds coverage for JavaScript sleep-based blind NoSQL injection and the
# `$where`/`$or` array forms that 9900203's regex misses on short payloads.
# It is also where `new Date(` belongs: only inside a timing loop.
SecRule ARGS|ARGS_NAMES|REQUEST_HEADERS|REQUEST_COOKIES|REQUEST_FILENAME|REQUEST_BODY|XML:/* "@rx (?i)(?:\bnew\s+Date\s*\(\s*\)\s*;\s*do\s*\{|while\s*\(\s*new\s+Date\s*\(\s*\)\s*-|while\s*\(\s*curDate\s*-|\.insert\s*\(\s*\{.*?\}|\.find\s*\(\s*\{.*?\$where)|\$\s*where\s*:\s*['\"]|\$\s*or\s*:\s*\[" \
    "id:9900212,\
    phase:2,\
    pass,\
    setvar:tx.anomaly_score=+10,\
    capture,\
    t:none,t:urlDecodeUni,t:urlDecodeUni,t:base64Decode,\
    msg:'NoSQL injection (JS execution / sleep-based)',\
    tag:'attack-injection-generic',\
    severity:'CRITICAL'"

# --- SQL injection — JSON function supplement ---------------------------------
# CRS 942150 and libinjection miss SQLi that uses MySQL/PostgreSQL JSON
# functions (JSON_EXTRACT, JSON_DEPTH, JSON_VALUE, JSON_QUERY) as boolean-based
# or error-based injection channels. These function names are unique to SQL
# engines and have near-zero FP in HTTP parameters.
SecRule ARGS|ARGS_NAMES|REQUEST_HEADERS|REQUEST_COOKIES|REQUEST_FILENAME|REQUEST_BODY|XML:/* "@rx (?i)\bjson_(?:extract|depth|value|query|table|keys|contains|overlaps|array_append|array_length|b|each|set|insert|replace|remove|type|valid|pretty|quote|unquote|merge|agg|object|array|build|strip_nulls|populate_record|to_record|path)\s*\(|\bjsonb_\w+\s*\(|\bjson_query\s*\(|\bjson_value\s*\(" \
    "id:9900213,\
    phase:2,\
    pass,\
    setvar:tx.anomaly_score=+10,\
    capture,\
    t:none,t:urlDecodeUni,t:urlDecodeUni,t:base64Decode,\
    msg:'SQL injection (JSON function vector)',\
    tag:'attack-sqli',\
    severity:'CRITICAL'"

# --- RCE / command injection — extended coverage ------------------------------
# Catches command injection patterns that 9900207/9900208 miss: git-style
# command injection (`ax--exec=id`), chained shell commands (`&& ls /etc`),
# and Windows cmd arithmetic (`set /a`).
SecRule ARGS|ARGS_NAMES|REQUEST_HEADERS|REQUEST_COOKIES|REQUEST_FILENAME|REQUEST_BODY|XML:/* "@rx (?i)(?:--exec\s*=\s*`|&&\s*(?:ls|dir|cat|id|whoami|ping|nslookup)\b|\|\s*set\s+/a\s+[0-9]+\*[0-9]+|\|\s*getent\s+hosts\b|getent\s+hosts\b)" \
    "id:9900214,\
    phase:2,\
    pass,\
    setvar:tx.anomaly_score=+10,\
    capture,\
    t:none,t:urlDecodeUni,t:urlDecodeUni,t:base64Decode,\
    msg:'RCE / command injection (extended coverage)',\
    tag:'attack-rce',\
    severity:'CRITICAL'"

# --- Path traversal — Windows UNC and dot-dot-slash supplement -----------------
# CRS 930110 catches standard ../ patterns; this adds Windows UNC paths
# (\\host\share\file) and Base64-encoded traversal in URL path values.
#
# A SINGLE leading `../` is not enough on its own. `?img=../assets/logo.png` is
# an ordinary relative path and used to be a 403. Traversal that is actually
# trying to escape a root either repeats the segment, appears mid-path (`/../`),
# or names a sensitive target — all three are still matched.
SecRule ARGS|ARGS_NAMES|REQUEST_HEADERS|REQUEST_COOKIES|REQUEST_FILENAME|REQUEST_URI|REQUEST_BODY|XML:/* "@rx (?i)(?:\\\\[^\\\\]+\\\\(?:c\$|windows|winnt|system32|users|program\s*files|etc)\\\\|(?:\.\.[/\\\\]){2,}|/\.\./|(?:^|[/\\\\])\.\.[/\\\\](?:etc/|proc/|windows/|winnt/|system32/|boot\.ini|web\.config))" \
    "id:9900215,\
    phase:2,\
    pass,\
    setvar:tx.anomaly_score=+10,\
    capture,\
    t:none,t:urlDecodeUni,t:urlDecodeUni,t:base64Decode,\
    msg:'Path traversal (UNC / dot-dot-slash)',\
    tag:'attack-lfi',\
    severity:'CRITICAL'"

# ---------------------------------------------------------------------------
# 9900216 — off-domain reference with NO SCHEME (protocol-relative URL).
#
# Found on 2026-09-15, the first time this WAF ever ran in blocking mode, by
# reading what a scanner got THROUGH rather than what it was stopped by.
#
# CRS 931130 catches off-domain references, and its regex is
# `(?:scheme-list)://…` — it requires a scheme. So on the live box:
#
#     ?q=http://evil.com/x.txt     403, anomaly score 17
#     ?q=//evil.com/shell.php      200, no rule fired at all
#
# A browser resolves `//evil.com` against the current scheme, so the
# protocol-relative form is the same open-redirect and SSRF payload with two
# characters removed. It was completely invisible: not blocked, not scored, not
# logged. That is the gap this closes.
#
# WHAT THIS CANNOT DO, stated plainly: `//cdn.example.com/lib.js` is a
# legitimate protocol-relative CDN reference and is structurally IDENTICAL to
# `//evil.com/shell.js`. No pattern can separate them — only knowing which
# domains you trust can, which is an allowlist, not a signature.
#
# It scored +5 and abstained for that reason, which left the gap only half
# closed: the payload was visible and still reached the application on its own.
# Raised to +10 on 2026-09-17 (Ayush's call), so it blocks alone at the default
# threshold of 10, matching what the scheme-ful form already did.
#
# The cost is real and belongs in the open: an application that passes a
# protocol-relative CDN URL as a PARAMETER VALUE will be blocked. If that turns
# out to be yours, exclude the parameter on the site rather than lowering this
# back — an exclusion is scoped to the one field that legitimately carries a
# URL, where the score is scoped to nothing.
#
# Anchored at the START of the value on purpose. `/assets//logo.png` is an
# ordinary sloppy path and must not match, and neither must a `//` that merely
# appears inside base64 (whose alphabet contains `/`) or inside a code comment.
# The host must also carry a dot and a 2-24 letter final label, so `//uploads`,
# `// TODO fix this` and `\\fileserver\share` do not match either.
#
# KNOWN, ACCEPTED narrow false positive: a value of exactly `//name.ext` where
# the extension looks like a TLD (`//img.png`). The regex engine is Rust's
# `regex` crate, which has no lookahead, so an extension exclusion cannot be
# expressed inline. A parameter whose whole value is `//img.png` is rare enough
# that this score is the right price; if it ever bites, exclude that parameter
# on the site rather than loosening the pattern.
SecRule ARGS|ARGS_NAMES|REQUEST_HEADERS|REQUEST_COOKIES|REQUEST_FILENAME|REQUEST_URI|REQUEST_BODY|XML:/* "@rx (?i)^\s*[/\\\\]{2,}(?:[^/\\\\@\s]{1,64}@)?(?:[a-z0-9][a-z0-9-]{0,62}\.)+[a-z]{2,24}" \
    "id:9900216,\
    phase:2,\
    pass,\
    setvar:tx.anomaly_score=+10,\
    capture,\
    t:none,t:urlDecodeUni,t:urlDecodeUni,\
    msg:'Off-domain reference without a scheme (protocol-relative URL)',\
    tag:'attack-rfi',\
    severity:'CRITICAL'"

# ---------------------------------------------------------------------------
# 9900217 — SMTP command / mail-header injection (CRLF + a mail verb).
#
# Found by GoTestWAF against the live box on 2026-09-15: SEVEN bypasses, all of
# them the same payload in different clothes —
#
#     %0D%0AQUIT%0D%0A          URL-encoded, in a query param and a form field
#     DQpRVUlUDQo               the same bytes base64'd, in the path, a param,
#                               a form field and a multipart part
#
# i.e. CRLF, then a bare SMTP verb, then CRLF. A parameter that is later
# interpolated into a mail transaction lets that terminate the current command
# and start a new one — the classic route to an open relay or a forged
# recipient.
#
# CRS does not cover it. 921150 only looks at ARGS_NAMES, and 921160 requires
# `[\n\r]` followed by an HTTP HEADER NAME and a colon (`location`, `set-cookie`
# …). `\r\nQUIT\r\n` has no colon and QUIT is not an HTTP header, so both miss.
#
# This one scores +10 and therefore blocks on its own, unlike its +5 siblings.
# The distinction is deliberate: 9900216 abstains because a protocol-relative
# CDN URL is a legitimate value that no pattern can tell from an attack, whereas
# a carriage return followed by a standalone SMTP verb has no legitimate use in
# a web parameter at all. Confidence earns the right to decide.
#
# The verb must be ALONE on its line (`[ \t]*` then CRLF or end of value), so
# ordinary prose that happens to contain a line starting with "data" or "to"
# does not match — `\r\nDATA collected from users` is text, `\r\nDATA\r\n` is a
# command. `MAIL FROM`/`RCPT TO`/`AUTH LOGIN` need no such guard; the two-word
# form is already unambiguous. Only `bcc:`/`cc:` are taken from the header side,
# because those are the header-injection targets nobody types by accident; `to:`
# is deliberately excluded, since a pasted email quote legitimately contains it.
#
# t:base64Decode is what catches the four base64 placements. It is safe to chain
# after the URL decoders: base64_decode_transform returns its input UNCHANGED
# when the value is not decodable, so the URL-encoded form survives it intact.
SecRule ARGS|ARGS_NAMES|REQUEST_HEADERS|REQUEST_COOKIES|REQUEST_FILENAME|REQUEST_URI|REQUEST_BODY|XML:/* "@rx (?i)[\r\n]+[ \t]*(?:(?:quit|rset|noop|data|helo|ehlo|vrfy|expn|starttls)[ \t]*(?:[\r\n]|$)|(?:mail[ \t]+from|rcpt[ \t]+to|auth[ \t]+login)\b|b?cc[ \t]*:)" \
    "id:9900217,\
    phase:2,\
    pass,\
    setvar:tx.anomaly_score=+10,\
    capture,\
    t:none,t:urlDecodeUni,t:urlDecodeUni,t:base64Decode,\
    msg:'SMTP command / mail-header injection (CRLF + mail verb)',\
    tag:'attack-injection-generic',\
    severity:'CRITICAL'"

# ---------------------------------------------------------------------------
# 9900218 — known out-of-band interaction (OAST) callback domains.
#
# GoTestWAF, 2026-09-15: a request whose User-Agent was an ordinary Chrome
# string with a callback host appended reached the application with a 200 —
#
#   Mozilla/5.0 (Windows NT 6.1; …) Chrome/55.0.2883.87 Safari/537.36
#   root@w63gecoroprj5um8ypnd7r6in9t0hseg3.interact.sh
#
# Nothing in it is syntactically an attack, so no signature had anything to
# match. The tell is the DESTINATION: `interact.sh` is ProjectDiscovery's
# out-of-band service, and a hostname like that in a request means somebody is
# waiting for the server to call them back — the standard confirmation step for
# blind SSRF, blind RCE and blind injection, where the response body tells the
# attacker nothing and the DNS lookup tells them everything.
#
# The same tell was hiding inside the base64 MSSQL payload in the same run:
# `…+'.000.burpcol'+'laborator.net'`, string-split precisely so a naive search
# for the domain would miss it. That one is caught by the SQL rules once the
# base64 comes off; this rule is for the cases where the payload itself is
# unremarkable and only the callback host gives it away.
#
# Scores +10 and therefore blocks alone. These domains exist for one purpose
# and have no legitimate reason to appear in a request to this site — unlike a
# CDN hostname, which is why 9900216 abstains and this one does not. A security
# team running their own OAST probe against a protected site WILL be blocked,
# which is the correct outcome.
#
# Deliberately NOT included: nip.io, xip.io, sslip.io and traefik.me. Those are
# wildcard-DNS conveniences used in ordinary development and would fire on
# legitimate traffic.
SecRule ARGS|ARGS_NAMES|REQUEST_HEADERS|REQUEST_COOKIES|REQUEST_FILENAME|REQUEST_URI|REQUEST_BODY|XML:/* "@rx (?i)\b(?:[a-z0-9][a-z0-9.-]{0,120}\.)?(?:interact\.sh|oast\.(?:fun|pro|live|site|online|me)|oastify\.com|burpcollaborator\.net|dnslog\.cn|ceye\.io|requestbin\.(?:net|com)|pipedream\.net|canarytokens\.com|interactsh\.com)\b" \
    "id:9900218,\
    phase:2,\
    pass,\
    setvar:tx.anomaly_score=+10,\
    capture,\
    t:none,t:urlDecodeUni,t:urlDecodeUni,t:base64Decode,\
    msg:'Out-of-band interaction (OAST) callback domain in request',\
    tag:'attack-ssrf',\
    severity:'CRITICAL'"
