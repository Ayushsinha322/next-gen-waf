syntax = "proto3";

package sentinel.v1;
option go_package = "github.com/your-org/sentinel-waf/control-plane/pkg/proto/sentinelv1;sentinelv1";

// ConfigService — control plane <-> data plane (Rust nodes).
service ConfigService {
  // Stream config updates (rules, sites, plugins) to data-plane nodes.
  rpc Subscribe(SubscribeRequest) returns (stream ConfigBundle);
  // Data-plane reports its current state and metrics.
  rpc ReportStatus(stream NodeStatus) returns (Ack);
  // Pull on-demand (used at boot).
  rpc GetBundle(GetBundleRequest) returns (ConfigBundle);
}

message SubscribeRequest {
  string node_id = 1;
  string version = 2;
  repeated string capabilities = 3; // e.g. "http3","ebpf","ml-v2"
}

message GetBundleRequest { string node_id = 1; }

message ConfigBundle {
  string revision = 1;
  bytes  rules    = 2; // compiled bytecode
  bytes  sites    = 3; // serialized site configs
  bytes  plugins  = 4; // wasm modules manifest
  bytes  ml_models= 5; // ONNX blob refs
}

message NodeStatus {
  string node_id = 1;
  uint64 requests_per_sec = 2;
  uint64 blocked_per_sec  = 3;
  double cpu_pct          = 4;
  double mem_pct          = 5;
  string config_revision  = 6;
}

message Ack { bool ok = 1; }
