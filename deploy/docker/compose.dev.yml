# =====================================================================
# Sentinel WAF — Local development stack
# Brings up infra dependencies. Rust data-plane and Go control-plane
# run NATIVELY on the host for fastest rebuild + debugger support.
#
# Usage:
#   docker compose -f deploy/docker/compose.dev.yml up -d
#   ./scripts/dev/run-dataplane.sh        # native cargo run
#   ./scripts/dev/run-controlplane.sh     # native go run
#   ./scripts/dev/run-dashboard.sh        # native npm run dev
# =====================================================================

name: sentinel-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_dev
      POSTGRES_DB: sentinel
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../control-plane/internal/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: sentinel-clickhouse
    restart: unless-stopped
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    environment:
      CLICKHOUSE_DB: sentinel_logs
      CLICKHOUSE_USER: sentinel
      CLICKHOUSE_PASSWORD: sentinel_dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native
    volumes:
      - chdata:/var/lib/clickhouse

  minio:
    image: minio/minio:latest
    container_name: sentinel-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sentinel
      MINIO_ROOT_PASSWORD: sentinel_dev_minio
    ports:
      - "9002:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - miniodata:/data

  # OpenTelemetry collector for local trace/metric/log inspection
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: sentinel-otel
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  # Jaeger UI for trace exploration
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: sentinel-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "14250:14250"

  # Optional: a backend httpbin to test reverse-proxying through Sentinel
  upstream-demo:
    image: kennethreitz/httpbin:latest
    container_name: sentinel-upstream-demo
    restart: unless-stopped
    ports:
      - "8080:80"

volumes:
  pgdata:
  redisdata:
  chdata:
  miniodata:
