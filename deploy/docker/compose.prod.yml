# =====================================================================
# Swaraj Kavach — lean production / MVP-demo Docker Compose.
#
#   postgres + redis  → control-plane backing stores (redis = Valkey, BSD-3)
#   clickhouse        → on-prem traffic/event log store (powers Threat Search)
#   migrate           → one-shot goose DB migrations (runs to completion first)
#   controlplane      → REST :9501 (internal only), seeds DB on boot (after migrate)
#   dataplane         → Rust WAF proxy, host :80 -> container :8080
#   dashboard         → Next.js UI on :3000
#   juiceshop         → demo upstream to protect (internal only)
#
# Secrets come from deploy/docker/.env (generated, gitignored).
# Usage (on the host):
#   docker compose -f deploy/docker/compose.prod.yml up -d --build
# =====================================================================

name: sentinel

# Build provenance, applied to every image we build. Defined ONCE as an anchor
# and merged in, rather than repeated per service, because this repository has
# already been bitten twice by the "fixed the service, missed the topology"
# shape: a change landed in one build block (or one compose file) and silently
# skipped its siblings. A fourth service added later inherits this by merging the
# anchor; forgetting to merge it is visible as a missing `<<:`, whereas forgetting
# to repeat three lines is invisible.
#
# The values come from the environment so an ordinary `docker compose build`
# still works with no setup — it just stamps "unknown", which deploy/fleet/fleet.sh
# refuses to ship. See the header of deploy/docker/Dockerfile for why this exists.
# THIRD-PARTY IMAGE PREFIX
#
# Empty by default, which means these come from Docker Hub exactly as before.
# Set it and they come from a mirror instead:
#
#     SENTINEL_THIRDPARTY_PREFIX=hub.enlight.dev/swaraj-kavach/
#
# The trailing slash is part of the value. That exists so a registry-mode install
# needs ONE reachable host rather than two: an ESDS management-network VM can
# reach hub.enlight.dev (172.16.23.2) but usually cannot reach Docker Hub, and
# without this the four product images would pull from the mirror while Postgres,
# Valkey, ClickHouse and Prometheus still tried the internet and hung.
#
# Harbor repository names may contain slashes (observed on this Harbor:
# base-images/anilrevgade/centos-apache-php), so clickhouse/clickhouse-server
# prefixes correctly without renaming.

x-build-provenance: &build-provenance
  GIT_SHA: ${SENTINEL_GIT_SHA:-unknown}
  BUILD_DATE: ${SENTINEL_BUILD_DATE:-unknown}
  VERSION: ${SENTINEL_VERSION:-0.0.0}

# The same provenance as RUNTIME environment, so a component reports the version
# of the DEPLOYED SET rather than of the build its own image came from. A deploy
# that changes one component retags the others — they are byte-identical, so
# rebuilding them is waste — and their link-time SHA then belongs to the previous
# version. The console reported that older commit for two deploys on 2026-09-07.
# SENTINEL_VERSION is the value that also picks the image tags, so it is the one
# an operator means by "what is deployed".
x-runtime-provenance: &runtime-provenance
  SENTINEL_GIT_SHA: ${SENTINEL_VERSION:-unknown}
  SENTINEL_BUILD_DATE: ${SENTINEL_BUILD_DATE:-unknown}

# Cap every container's json-file log. Nothing did before: a 46-hour soak at only
# 3 requests/second accumulated 648 MB and the disk had no ceiling at all. 100 MB
# across 5 files is 500 MB worst case per service, which a 40 GB root can hold
# while still keeping several days of history at realistic rates.
x-logging: &logging
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "5"

services:
  postgres:
    image: ${SENTINEL_THIRDPARTY_PREFIX:-}postgres:16-alpine
    logging: *logging
    restart: unless-stopped
    # TLS is served, not optional. Without these flags the server offers no TLS at
    # all, so every client DSN had to say sslmode=disable and all database traffic —
    # session tokens, API-key hashes, audit rows, tenant config, and the handshake
    # credentials — crossed the network in cleartext.
    #
    # Certificates come from the internal Root CA via:
    #     sudo deploy/docker/issue-postgres-cert.sh
    # Its SAN includes "postgres" (this service name), which is what lets clients
    # use sslmode=verify-full rather than merely encrypting without verifying.
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/sentinel/pg/server.crt
      - -c
      - ssl_key_file=/etc/sentinel/pg/server.key
      # ssl=on only makes TLS AVAILABLE. The stock pg_hba ends with a plain
      # `host all all all scram-sha-256`, so a client that asks for sslmode=disable
      # still gets a cleartext session — the server holds a good certificate and
      # declines to insist on it. It also ships `host all all 127.0.0.1/32 trust`,
      # which authenticates any TCP loopback client with no password at all. Our
      # own pg_hba is hostssl-only (see pg_hba.conf), so TLS becomes a property the
      # SERVER enforces rather than a promise each client is trusted to keep.
      - -c
      - hba_file=/etc/sentinel/pg/pg_hba.conf
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Read-only. Postgres refuses to start if its key is readable beyond its own
      # user, so issue-postgres-cert.sh writes the key 0600 owned by uid 70.
      - /opt/sentinel-pki/pg-server.crt:/etc/sentinel/pg/server.crt:ro
      - /opt/sentinel-pki/pg-server.key:/etc/sentinel/pg/server.key:ro
      # hostssl-only client auth. Keeps `local ... trust` so the container's own
      # healthcheck (pg_isready over the unix socket) and `compose exec psql` work.
      - ./pg_hba.conf:/etc/sentinel/pg/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [sentinel]

  redis:
    # Valkey, NOT Redis. The `redis:7-alpine` tag resolves to 7.4, which is
    # dual-licensed RSALv2/SSPL — not open source, and this image is
    # redistributed in the offline customer bundle. Valkey is the BSD-3 fork of
    # Redis 7.2.4 maintained under the Linux Foundation, speaks the same RESP
    # protocol, and supports every command we issue (ZREMRANGEBYSCORE, ZCARD,
    # ZADD, INCR, EXPIRE in the rate-limit Lua; GET/SET/SETEX/DEL/INCR/EXPIRE/
    # PING from the client). The image also ships redis-* compatibility
    # binaries, so nothing that shells out by the old name breaks.
    #
    # The SERVICE is still called `redis` and the URL scheme is still redis://
    # on purpose: that is the role and the wire protocol, and renaming them
    # would rewrite SENTINEL_REDIS_URL on every node for no licensing gain.
    image: ${SENTINEL_THIRDPARTY_PREFIX:-}valkey/valkey:8-alpine
    logging: *logging
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [sentinel]

  # On-prem time-series log store. The data plane WRITES traffic_buckets +
  # waf_events here; the control plane READS them for the dashboard's "Threat
  # Search" (/events) page. Internal-only — no host port is published; both
  # planes reach it over the docker network at clickhouse:8123.
  clickhouse:
    # An EXACT version, never a floating tag. `24-alpine` stopped moving at
    # 24.10.2.80, and 24.10 cannot correct its global memory tracker: it drifted
    # to 486 GiB on .71 (real use under 1 GiB) and refused 120,456 merges,
    # system-log flushes and queries. 26.3 is an LTS line (supported to about
    # 2027-03) and carries memory_worker_correct_memory_tracker, which
    # clickhouse-memory.xml turns on.
    #
    # NOT 26.8, although it is the newer LTS: its official build needs x86-64-v2
    # instructions (SSE4.2, SSSE3, POPCNT) and dies at once with SIGILL, exit
    # 132, on a VM whose virtual CPU does not expose them. .71's "Common KVM
    # processor" exposes none of them; 26.8 crash-looped there while 24.10
    # through 26.3 ran. upgrade.sh test-runs the new image before it switches
    # anything, so a CPU that cannot run a future pin stops the upgrade cleanly.
    # Moving ClickHouse forward is ONE-WAY — a newer server rewrites metadata an
    # older one cannot read — so this changes only with an upgrade that takes
    # the pre-upgrade backup (upgrade.sh does), and never back.
    image: ${SENTINEL_THIRDPARTY_PREFIX:-}clickhouse/clickhouse-server:26.3.35.3-alpine
    logging: *logging
    restart: unless-stopped
    # 1536m is NOT enough: at that limit ClickHouse's own internal-table merges
    # (system.text_log) get OOM-killed during startup, and the container
    # crash-loops indefinitely — observed ~24k restarts on the deploy VM
    # (2026-07-22). 6g is the verified-good floor. Override downward only on a
    # box where you have confirmed the merges complete.
    mem_limit: ${CLICKHOUSE_MEM_LIMIT:-6g}
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      # No CLICKHOUSE_MAX_SERVER_MEMORY_USAGE_TO_RAM_RATIO here: it sat here as
      # "0.6" for months and the image's entrypoint reads no such variable, so
      # every install ran at ClickHouse's default of 0.9. The ratio is now set
      # where ClickHouse reads it — clickhouse-memory.xml below.
    volumes:
      - chdata:/var/lib/clickhouse
      # Memory accounting: corrects the global tracker from real usage (see the
      # file). Committed to the repo, so — like logging.xml — it always exists
      # and is safe to mount unconditionally.
      - ./clickhouse-memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
      # Retention for ClickHouse's OWN logs. Unlike the TLS drop-in below this
      # is safe to mount unconditionally: the file is committed to the repo, so
      # it always exists and Docker can never invent a directory in its place.
      #
      # Without it ClickHouse keeps its self-log forever. Measured on the deploy
      # VM at 75 days uptime: system.text_log alone held 15.26 GiB across 345M
      # rows, against 3.88 MiB of actual WAF events — 99.9% of an 18 GiB volume
      # spent describing its own merges. Merges on that table are also what
      # OOM-killed the server and produced the restart storm the mem_limit note
      # above refers to, so this is an availability fix, not just disk hygiene.
      - ./clickhouse-logging.xml:/etc/clickhouse-server/config.d/logging.xml:ro
      # TLS drop-in + leaf, so the HTTPS interface is available for cross-host
      # clients (the 2-VM passive node). Issued by issue-clickhouse-cert.sh.
      #
      # `:ro` and OPTIONAL by design: a single-host deployment that has not run
      # the issuer has no /opt/sentinel-pki, and Docker would otherwise CREATE
      # those paths as empty DIRECTORIES — the exact trap that made an absent
      # cert report itself as present during the first 2-VM install (a directory
      # satisfies `-s`). Compose cannot express "mount if exists", so these live
      # in the 2VM overlays where the issuer is a required install step, NOT here.
    healthcheck:
      # /ping needs no auth; busybox wget ships in the alpine image. Use the
      # IPv4 loopback explicitly: this host is IPv4-only and `localhost` resolves
      # to ::1 first, where ClickHouse can't bind (IPv6 disabled) → false-unhealthy.
      #
      # Stays on plaintext 8123 over loopback INSIDE the container: that traffic
      # never touches a network, and pointing it at https would make the health of
      # the container depend on certificate validity — a cert problem would then
      # read as "ClickHouse is down" and take dependent services with it.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks: [sentinel]

  # One-shot DB migrations (goose). Runs to completion before the control plane
  # starts, so its SeedDev finds the schema. The control plane does NOT migrate
  # on boot — it only seeds. goose `up` is idempotent (no-op once current).
  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: sentinel-migrate
      args:
        <<: *build-provenance
    image: ${SENTINEL_IMAGE_PREFIX:-sentinel}/migrate:${SENTINEL_VERSION:-latest}
    logging: *logging
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      # goose reads GOOSE_DBSTRING. Migrations run as the database OWNER
      # (SENTINEL_MIGRATE_DB_URL); the control plane connects as sentinel_cp,
      # whose password the entrypoint sets from SENTINEL_CP_DB_PASSWORD. An
      # installation from before that has only SENTINEL_DB_URL (the owner) and
      # keeps using it for both.
      GOOSE_DBSTRING: ${SENTINEL_MIGRATE_DB_URL:-${SENTINEL_DB_URL}}
      SENTINEL_CP_DB_PASSWORD: ${SENTINEL_CP_DB_PASSWORD:-}
    volumes:
      # CA the DSN's sslrootcert points at, so migrations verify the server too.
      - /opt/sentinel-pki/root.crt:/etc/sentinel/pki/root.crt:ro
    networks: [sentinel]

  controlplane:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: sentinel-controlplane
      args:
        <<: *build-provenance
    image: ${SENTINEL_IMAGE_PREFIX:-sentinel}/controlplane:${SENTINEL_VERSION:-latest}
    # A node identifies itself by its hostname (SENTINEL_NODE_ID, else HOSTNAME).
    # Docker's default hostname is the container id, which changes on EVERY
    # recreate — upgrade, rollback, `up --force-recreate`, `docker rm -f` — so an
    # unpinned node minted a new identity each time and the old one stayed in the
    # cluster view as "down" for ever (seen on the first customer install: one
    # live data plane, one ghost, "nodes unhealthy"). Pin it. The cluster overlay
    # sets SENTINEL_NODE_ID 1/2/3 and its own hostnames, which take precedence.
    hostname: ${SENTINEL_CP_HOSTNAME:-sentinel-controlplane}
    logging: *logging
    restart: unless-stopped
    # root so it can write the shared NDJSON log volume (hardened via K8s
    # securityContext later). The control-plane hub reads what the proxy writes.
    user: "0:0"
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      # service_started (not _healthy): never gate the control plane on the
      # analytics store's health. The reader degrades gracefully; the writer
      # self-heals. (A broken CH healthcheck previously gated and downed the stack.)
      clickhouse: { condition: service_started }
    environment:
      <<: *runtime-provenance
      SENTINEL_DB_URL: ${SENTINEL_DB_URL}
      SENTINEL_REDIS_URL: redis://redis:6379
      # ClickHouse reader → powers the dashboard's "Threat Search" (/events).
      # Unset = reader disabled (honest empty state); set = event search live.
      SENTINEL_CLICKHOUSE_URL: http://clickhouse:8123
      SENTINEL_CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      SENTINEL_CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      SENTINEL_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      SENTINEL_JWT_SECRET: ${SENTINEL_JWT_SECRET}
      # The first administrator's login and password, read by seed.go only
      # while the tenant has no users at all — so once anyone exists, deleting
      # or renaming this account sticks (it used to be re-created on every boot
      # with this password). Unset, the login is admin@sentinel.local and the
      # seeder invents a password and prints it to this container's stderr
      # once, which dies with the container; install.sh generates both into its
      # .env so they outlive any recreate. A lost password is reset with
      # `docker exec -it sentinel-controlplane-1 controllerd reset-admin`.
      # Empty defaults keep the file parseable for anyone running compose by hand.
      SENTINEL_BOOTSTRAP_ADMIN_EMAIL: ${SENTINEL_BOOTSTRAP_ADMIN_EMAIL:-}
      SENTINEL_BOOTSTRAP_ADMIN_PASSWORD: ${SENTINEL_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Required by the audit-HMAC fail-fast; keep it out of the committed YAML.
      SENTINEL_AUDIT_HMAC_KEY: ${SENTINEL_AUDIT_HMAC_KEY}

      # ── Outbound mail (password reset) ────────────────────────────────────
      # Password recovery is the ONLY way back into the console for a user who
      # has forgotten their password, and it is delivered by email — so with no
      # relay configured, self-service reset silently does nothing (the API still
      # answers with its deliberate non-committal message, because telling an
      # anonymous caller about your mail setup is itself a leak). The settings
      # screen reports the real state, and Settings → Users can send a test.
      #
      # Every value is empty by default. Nothing here may ever gain a baked-in
      # default: a hardcoded relay or sender would mail one deployment's password
      # links through another organisation's infrastructure.
      SENTINEL_SMTP_HOST: ${SENTINEL_SMTP_HOST:-}
      SENTINEL_SMTP_PORT: ${SENTINEL_SMTP_PORT:-587}
      SENTINEL_SMTP_USERNAME: ${SENTINEL_SMTP_USERNAME:-}
      SENTINEL_SMTP_PASSWORD: ${SENTINEL_SMTP_PASSWORD:-}
      SENTINEL_SMTP_FROM: ${SENTINEL_SMTP_FROM:-}
      SENTINEL_SMTP_FROM_NAME: ${SENTINEL_SMTP_FROM_NAME:-Swaraj Kavach}
      # starttls (default) | tls (implicit, usually :465) | none (unauthenticated
      # local relay only — the mailer refuses to send credentials in the clear).
      SENTINEL_SMTP_SECURITY: ${SENTINEL_SMTP_SECURITY:-starttls}
      SENTINEL_SMTP_INSECURE_SKIP_VERIFY: ${SENTINEL_SMTP_INSECURE_SKIP_VERIFY:-0}
      # Where a reset link points. MUST be the browser-reachable console origin.
      # It is configuration rather than something derived from the Host header on
      # purpose: the forgot-password endpoint is unauthenticated, so trusting the
      # request's own host would let a caller aim a victim's reset link at a
      # server they control.
      SENTINEL_PUBLIC_URL: ${SENTINEL_PUBLIC_URL:-}
      # Security contact notified whenever a console password is reset. Falls
      # back to SENTINEL_ADMIN_EMAIL, which install.sh already collects.
      SENTINEL_ADMIN_EMAIL: ${SENTINEL_ADMIN_EMAIL:-}
      SENTINEL_SECURITY_NOTIFY_EMAIL: ${SENTINEL_SECURITY_NOTIFY_EMAIL:-}
      # Turned into an "Operations email" alert channel on the first boot that
      # sees it (once: a channel deleted in the console stays deleted).
      SENTINEL_ALERT_EMAIL: ${SENTINEL_ALERT_EMAIL:-}
      # SINGLE-TENANT DEMO POSTURE. This stack connects as the Postgres superuser
      # ('sentinel'), which bypasses FORCE ROW LEVEL SECURITY. Tenant isolation
      # here is enforced by the explicit tenant_id predicates in the stores (not
      # RLS). For MULTI-TENANT production, point SENTINEL_DB_URL at the
      # non-superuser 'sentinel_app' role (set its password, run migrations as
      # the owner role) and REMOVE this opt-out so RLS backstops isolation.
      SENTINEL_ALLOW_SUPERUSER_DB: "1"
      SENTINEL_REST_ADDR: 0.0.0.0:9501
      # JSON by default so these lines are ingestable; `console` for local work.
      SENTINEL_LOG_FORMAT: ${SENTINEL_LOG_FORMAT:-json}
      SENTINEL_AUTOSTART_DATAPLANE: "0"
      SENTINEL_LOG_DIR: /var/log/sentinel
      # Origins allowed to call the control plane from a browser. In the intended
      # posture the console is served from https://<host>:9443 and the live-log
      # EventSource targets that same origin, so no cross-origin request happens
      # at all and this list is not consulted.
      #
      # It previously read `http://172.16.21.71:3000,https://172.16.21.71:9443` —
      # one developer's VM address, shipped to every customer, directly
      # contradicting the comment above it that said no origin was pre-allowed.
      # Anywhere but that VM it allow-listed a host that does not exist while
      # OVERRIDING the built-in defaults, since a non-empty value replaces them
      # wholesale.
      #
      # The default below names only loopback, which is what both documented
      # access paths actually resolve to: the SSH tunnel (https://127.0.0.1:9443)
      # and the cleartext break-glass UI (http://127.0.0.1:3000). Note that
      # browsers treat 127.0.0.1 and localhost as DIFFERENT origins — if you reach
      # the console by hostname, add that origin here explicitly.
      SENTINEL_CORS_ORIGINS: ${SENTINEL_CORS_ORIGINS:-https://127.0.0.1:9443,http://127.0.0.1:3000}
      # Cert repository: control plane proxies cert uploads/list to the data
      # plane's internal API, authenticated with a shared secret (cross-container).
      SENTINEL_DATAPLANE_URL: http://dataplane:8080
      SENTINEL_INTERNAL_SECRET: ${SENTINEL_INTERNAL_SECRET}
      # Public Root CA the dashboard offers for download (Certificates page) so
      # internal users can trust the WAF's HTTPS-by-IP cert. Mounted read-only
      # below; only the PUBLIC cert is exposed, never the CA private key.
      SENTINEL_ROOT_CA_PATH: /etc/sentinel/root-ca.crt
      # Where the MaxMind GeoLite2-Country database lives INSIDE the WAF
      # containers. The control plane stamps this into each site's
      # waf_policy.geoip.db_path, so it must match the mount below.
      #
      # The default was a RELATIVE `rules/GeoLite2-Country.mmdb`, resolved against
      # the data plane's working directory — a path that has never contained a
      # database on any deployment, because none ships and none can (MaxMind's
      # licence forbids redistributing it). Country filtering was therefore inert
      # everywhere while the console displayed the policy. An absolute path on a
      # bind-mounted directory means supplying the file is a copy, not a rebuild.
      SENTINEL_GEOIP_DB: ${SENTINEL_GEOIP_DB:-/var/lib/sentinel/geoip/dbip-country-lite.mmdb}
      # Where the control plane's geoip.refresh job writes the monthly DB-IP
      # country database (CC BY 4.0). Same host directory the data planes mount.
      SENTINEL_GEOIP_DIR: /var/lib/sentinel/geoip
    volumes:
      # GeoIP directory, READ-WRITE here: the geoip.refresh job downloads the
      # monthly DB-IP country database into it; data planes mount it read-only.
      - ${SENTINEL_GEOIP_DIR:-./geoip}:/var/lib/sentinel/geoip
      - sentinel-logs:/var/log/sentinel
      # Private-CA root cert generated by deploy/docker/issue-ip-cert.sh (lives on
      # the host at /opt/sentinel-pki/root.crt). Read-only; public cert only.
      - /opt/sentinel-pki/root.crt:/etc/sentinel/root-ca.crt:ro
      # Same CA at the path the DSN's sslrootcert references, for Postgres TLS
      # verification. Mounted separately from root-ca.crt above (which the
      # dashboard offers for download) so the two purposes stay legible.
      - /opt/sentinel-pki/root.crt:/etc/sentinel/pki/root.crt:ro
    # DELIBERATELY NO PUBLISHED PORTS. The control plane speaks cleartext HTTP
    # (it terminates no TLS of its own), holds the DB credentials and the
    # token-signing key, and serves the whole management API. Publishing :9501 to
    # the host put that API on the network in the clear and bypassed the TLS
    # front on :9443 entirely — anyone who could reach the host could read and
    # write management state, and any admin JWT on that path crossed the network
    # unencrypted.
    #
    # The comment that used to justify the publish (browser SSE needs a direct
    # connection because the Next.js proxy buffers) is stale: the dashboard's
    # NEXT_PUBLIC_CONTROL_PLANE_URL already points at https://<host>:9443, and the
    # data plane's management listener reverse-proxies /api/* to the control plane
    # while streaming bodies in both directions, so SSE is unbuffered there
    # (see handle_management_request in crates/sentinel-proxy/src/lib.rs).
    #
    # The service stays reachable to its peers over the internal compose network.
    networks: [sentinel]

  dataplane:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: sentinel-dataplane
      args:
        <<: *build-provenance
    image: ${SENTINEL_IMAGE_PREFIX:-sentinel}/dataplane:${SENTINEL_VERSION:-latest}
    # Stable node identity — see the note on the controlplane service. The HA
    # overlay replaces this service with waf1/2/3, each with its own hostname.
    hostname: ${SENTINEL_DP_HOSTNAME:-sentinel-dataplane}
    logging: *logging
    restart: unless-stopped
    user: "0:0"
    # Kernel XDP needs these to load/attach the BPF program and its maps.
    # Without them the data plane simply falls back to the userspace software
    # fast-fail, so the stack still boots on hosts that don't allow XDP.
    cap_add:
      - NET_ADMIN
      - BPF
      - SYS_RESOURCE
      - PERFMON
    ulimits:
      memlock: -1
      # File descriptors. This service accepts up to max_connections (default
      # 10,000) client connections, and each one that is proxied needs a SECOND
      # descriptor for the upstream socket — so saturation needs 20,000+, before
      # epoll, listeners, certificates and log files.
      #
      # No nofile was set here at all, so the container inherited the daemon
      # default. Where that default is the traditional 1024, accept(2) starts
      # returning EMFILE at roughly 500 concurrent connections — two orders of
      # magnitude below the configured limit, and the admission-control semaphore
      # never even engages because it is counting to 10,000. Until now EMFILE also
      # killed the listener outright (see classify_accept_error in
      # sentinel-proxy); it is now survivable, but survivable-at-500-connections
      # is still an outage on a busy site.
      nofile: { soft: 65536, hard: 65536 }
    depends_on:
      controlplane: { condition: service_started }
      # service_started, not _healthy: the WAF must boot regardless of ClickHouse.
      # The proxy's history writer self-heals (background reconnect with backoff),
      # so it starts persisting once CH is reachable — no restart, no WAF gating.
      clickhouse: { condition: service_started }
    environment:
      SENTINEL_CONFIG: /etc/sentinel/sentinel.yaml
      SENTINEL_LOG_DIR: /var/log/sentinel
      # NDJSON log rotation ceiling: MAX_MB x (KEEP + 1) x 2 streams
      # (access.log + waf.log) — 1.2 GB at these defaults. Lower both on a small
      # disk; the logs volume is not otherwise bounded.
      SENTINEL_LOG_MAX_MB: ${SENTINEL_LOG_MAX_MB:-100}
      SENTINEL_LOG_KEEP: ${SENTINEL_LOG_KEEP:-5}
      # RUST_LOG is deliberately just `info`, with NO per-crate directive.
      #
      # It was `info,sentinel=info`, and that `sentinel=info` SILENTLY DISABLED every
      # log line from the `sentinel-modules` crate. Proven on .71 by changing only this
      # value and restarting one node: with the directive, zero sentinel_modules lines
      # in the container's entire lifetime; without it, the GeoIP lines appear
      # immediately.
      #
      # The directive looked redundant with the global `info` and was worse than
      # redundant. `sentinel` is not a module-path prefix of `sentinel_modules`, so the
      # targeted directive does not match it, and its presence stops the bare level
      # applying as the default for that target.
      #
      # What was lost: sentinel-modules is geoip, bot_detect, dlp, jwt_auth, anti_ddos,
      # rate_limit, ip_reputation, threat_intel, smuggling, tls_fingerprint, graphql and
      # grpc — TWELVE subsystems whose warnings and errors were invisible on every
      # deployment. It is why the GeoIP "database not found" warning went unnoticed for
      # months: it was being emitted and filtered.
      #
      # If a per-crate level is ever wanted, name the crate exactly
      # (`sentinel_modules=debug`), and check the output before believing it.
      RUST_LOG: info
      # Shared secret so the control plane can reach the loopback-only cert API.
      SENTINEL_INTERNAL_SECRET: ${SENTINEL_INTERNAL_SECRET}
      # NOTE: SENTINEL_REDIS_URL is intentionally NOT set here. This is a single
      # data-plane node, so the in-process token-bucket rate limiter is correct;
      # pointing it at Redis would switch to sliding-window semantics + a per-
      # request round-trip for no benefit. Set it only for a multi-node fleet.
      # ClickHouse writer → the proxy bulk-inserts traffic_buckets + waf_events
      # (creates the schema on first connect). Same Secret as the reader above
      # so both planes agree; keeps the CH password out of the committed YAML.
      SENTINEL_CLICKHOUSE_URL: http://clickhouse:8123
      SENTINEL_CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      SENTINEL_CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      SENTINEL_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      # Deadline for each ClickHouse request (one INSERT of up to 500 rows); past
      # it the batch is spooled and replayed on reconnect. The 2-VM overlays
      # inherit this; raise it if the passive node's peer link is slow.
      SENTINEL_CLICKHOUSE_TIMEOUT_SECS: ${SENTINEL_CLICKHOUSE_TIMEOUT_SECS:-10}
      # History spool. Rows ClickHouse cannot accept are written here and replayed
      # on reconnect, so an outage DELAYS the audit trail instead of erasing it.
      # It must sit on the sentinel-state volume: the spool exists to outlive the
      # container, and a path inside the image would be destroyed by the very
      # `--force-recreate` an operator runs to fix the outage.
      SENTINEL_SPOOL_DIR: /var/lib/sentinel/state/spool
      # Continuous SIEM feed — off unless SENTINEL_SIEM_TARGET is set. See
      # .env.example for why this is not the same as a syslog alert channel.
      SENTINEL_SIEM_TARGET: ${SENTINEL_SIEM_TARGET:-}
      SENTINEL_SIEM_PROTOCOL: ${SENTINEL_SIEM_PROTOCOL:-tcp}
      SENTINEL_SIEM_FORMAT: ${SENTINEL_SIEM_FORMAT:-cef}
      SENTINEL_SIEM_CA_FILE: ${SENTINEL_SIEM_CA_FILE:-}
      SENTINEL_SIEM_QUEUE: ${SENTINEL_SIEM_QUEUE:-10000}
      SENTINEL_SPOOL_MAX_BYTES: ${SENTINEL_SPOOL_MAX_BYTES:-268435456}
      # Event-log retention. The installer writes both of these into .env and
      # .env.example documents them as THE compliance knob ("raise for compliance,
      # e.g. 365"), and the data plane really does read them
      # (sentinel-storage/src/clickhouse.rs — applied to existing tables via
      # ALTER ... MODIFY TTL on restart). They were simply never passed into the
      # container: an operator asked for 365-day retention by an auditor could edit
      # .env, recreate the stack, watch it come up clean, and still be silently
      # running the built-in 90-day default.
      SENTINEL_CLICKHOUSE_EVENT_RETENTION_DAYS: ${SENTINEL_CLICKHOUSE_EVENT_RETENTION_DAYS:-90}
      SENTINEL_CLICKHOUSE_TRAFFIC_RETENTION_DAYS: ${SENTINEL_CLICKHOUSE_TRAFFIC_RETENTION_DAYS:-30}
      # Upstreams the dedicated management listener (:9443) reverse-proxies to.
      SENTINEL_MGMT_DASHBOARD_UPSTREAM: http://dashboard:3000
      SENTINEL_MGMT_API_UPSTREAM: http://controlplane:9501
      # HTTP/3: the https listener binds :8443 inside the container but is
      # published on host :443, so advertise h3 on :443 in the Alt-Svc header
      # (else browsers try to reach h3 on :8443 and fail to upgrade).
      SENTINEL_HTTP3_ADVERTISE_PORT: "443"
      # Kernel XDP fast-path: drop blocked source IPs in the NIC/driver path
      # before they reach the proxy. Degrades to software mode if attach fails.
      SENTINEL_XDP_ENABLE: "1"
      SENTINEL_XDP_IFACE: eth0
      # The remaining XDP knobs the data plane reads. Without these lines they
      # are unreachable: setting SENTINEL_XDP_BLOCK in .env changed nothing and
      # reported nothing, because the variable never entered the container.
      #
      #   SENTINEL_XDP_BLOCK           comma-separated IPs/CIDRs to drop at XDP
      #                                from startup (e.g. "1.2.3.4,10.0.0.0/8")
      #   SENTINEL_XDP_AUTOBAN         "0" disables auto-ban (default on). The
      #                                name is historical: since 1.1.18 a ban is
      #                                per site, 15-60 min, a logged 403 with the
      #                                block page — not a permanent kernel drop
      #   SENTINEL_XDP_AUTOBAN_BLOCKS  attack verdicts (rules, classifier, threat
      #                                intel — not 429s or 401s) from one source
      #                                on one site within 10 min before it is
      #                                banned from that site (20)
      #
      # Auto-ban being on by default with no way to tune or disable it from the
      # shipped configuration is why these matter: an operator whose traffic
      # trips the threshold needs a switch, not a rebuild.
      #
      # SENTINEL_XDP_AUTOBAN_INCLUDE_PRIVATE is deliberately NOT plumbed. It
      # lets private/loopback addresses be auto-banned, and on a single-node
      # install every client appears as the Docker gateway — so it would allow
      # black-holing the whole deployment in-kernel, below the socket, from a
      # one-line .env edit. It stays a test-only knob, settable only by someone
      # editing this file on purpose.
      SENTINEL_XDP_BLOCK: ${SENTINEL_XDP_BLOCK:-}
      SENTINEL_XDP_AUTOBAN: ${SENTINEL_XDP_AUTOBAN:-1}
      SENTINEL_XDP_AUTOBAN_BLOCKS: ${SENTINEL_XDP_AUTOBAN_BLOCKS:-20}
      # Client-IP attribution. This node publishes :80/:443 directly, so the transport
      # peer IS the client and X-Forwarded-For must NOT be trusted — an empty list means
      # XFF is ignored entirely, which is the safe default. Set it ONLY to the addresses
      # of a real proxy in front (see compose.ha.yml, where HAProxy is that proxy);
      # trusting XFF from anywhere would let a client forge its own source address and
      # both evade a block and frame a third party.
      SENTINEL_TRUSTED_PROXIES: ${SENTINEL_TRUSTED_PROXIES:-}
      # Shared-NAT ranges: addresses behind which MANY unrelated users appear as one IP
      # (corporate NAT, VPN pool, CGNAT). Per-source escalation is wrong for these — one
      # abusive user would raise every colleague's anomaly score and get the whole office
      # auto-banned. Listed ranges are exempt from correlation scoring and auto-ban.
      SENTINEL_SHARED_EGRESS_CIDRS: ${SENTINEL_SHARED_EGRESS_CIDRS:-}
      # Ceiling on the reputation contribution a single source's recent history can add,
      # so correlation can nudge a borderline request over the line but can never block
      # on reputation alone.
      SENTINEL_CORRELATION_MAX_SCORE: ${SENTINEL_CORRELATION_MAX_SCORE:-4}
      # Last-good config cache. Must live on a VOLUME: the default ($HOME/.config/...)
      # is in the container's writable layer, which is discarded on every image upgrade
      # or `up -d` recreate — exactly when a control-plane outage would leave this node
      # with no config to fall back on, which is the whole point of the cache.
      SENTINEL_CONFIG_CACHE_PATH: /var/lib/sentinel/state/config-cache.json
      # CA bundle for ORIGIN certificate verification, added to the public
      # roots. Empty = public roots only. See origin-ca/README.md.
      SENTINEL_UPSTREAM_CA_FILE: ${SENTINEL_UPSTREAM_CA_FILE:-}
    volumes:
      - ./sentinel.proxy.yaml:/etc/sentinel/sentinel.yaml:ro
      # Kernel BTF so aya can load the BTF-typed BPF maps.
      - /sys/kernel/btf/vmlinux:/sys/kernel/btf/vmlinux:ro
      - sentinel-logs:/var/log/sentinel
      # Operator-supplied GeoIP database, read-only. Empty by default — see
      # geoip/README.md. When absent the WAF logs an ERROR and reports the gap at
      # /healthz -> geoip.inert rather than pretending country rules apply.
      - ${SENTINEL_GEOIP_DIR:-./geoip}:/var/lib/sentinel/geoip:ro
      # Operator-supplied CA for ORIGIN certificate verification, read-only.
      # Empty by default — see origin-ca/README.md. Without it the only anchors
      # are the public roots, so an origin behind an internal/corporate CA fails
      # verification and the site 502s.
      - ${SENTINEL_ORIGIN_CA_DIR:-./origin-ca}:/etc/sentinel/origin-ca:ro
      - sentinel-certs:/var/lib/sentinel/certs   # cert repository (persists ACME/uploaded certs)
      - sentinel-state:/var/lib/sentinel/state   # last-good config cache (survives upgrades)
    ports:
      - "80:8080"               # public WAF entrypoint (HTTP)
      - "443:8443"              # public WAF entrypoint (HTTPS/TCP — h1+h2, SNI cert resolver)
      - "443:8443/udp"          # public WAF entrypoint (HTTP/3 over QUIC — same cert resolver)
      # MANAGEMENT console (HTTPS — admin UI + API, replaceable mgmt cert),
      # LOOPBACK-ONLY BY DEFAULT, ON PURPOSE. On 0.0.0.0 this is a security
      # appliance's admin UI exposed to whatever network the host sits on — and to
      # the internet the moment the host gets a public IP. Reach it with a tunnel:
      #   ssh -L 9443:127.0.0.1:9443 root@<host>   then https://127.0.0.1:9443
      #
      # Do NOT change this line to expose the console. The default must stay
      # loopback so a new deployment is never accidentally exposed. If an operator
      # genuinely wants it on the network (internal lab, jump-host-free demo box),
      # that is a per-deployment decision made explicitly in .env, not a source
      # edit that ships to everyone:
      #   SENTINEL_MGMT_BIND=0.0.0.0:      # in deploy/docker/.env
      #
      # Use 0.0.0.0:, NOT a single interface address like `10.0.0.5:`. Docker would
      # then publish only that address, the 127.0.0.1 listener would vanish, and
      # deploy/fleet/fleet.sh — which health-checks through
      # `https://127.0.0.1:9443/healthz` — would report a healthy node as failing.
      # 0.0.0.0 includes loopback; narrow the exposure with a host firewall, which
      # does not take loopback away.
      #
      # Whoever sets it also owns the consequences: add the matching origin to
      # SENTINEL_CORS_ORIGINS (or the UI breaks on CORS), and put a real host
      # firewall in front, because the mgmt cert is a self-signed rcgen cert with
      # no IP SAN and authenticates nothing to the browser.
      - "${SENTINEL_MGMT_BIND:-127.0.0.1:}9443:9443"
    networks: [sentinel]

  dashboard:
    build:
      context: ../../dashboard
      dockerfile: ../deploy/docker/Dockerfile.dashboard
      args:
        <<: *build-provenance
        CONTROL_PLANE_URL: http://controlplane:9501             # server-side REST proxy (internal)
        # NEXT_PUBLIC_CONTROL_PLANE_URL is deliberately NOT set.
        #
        # It is inlined by Next at BUILD time, so setting it bakes one
        # deployment's address into the image — the dashboard then only works on
        # the box it was built for, which is wrong for a shippable product. It
        # also broke the live-log stream the moment :9443 became loopback-only,
        # because the browser was still told to reach a host IP that no longer
        # answers.
        #
        # Unset, the SSE stream is same-origin (see api.ts logs.streamURL). The
        # management console proxies /api/* straight to the control plane, so it
        # reaches the Go server unbuffered and works under any origin: SSH
        # tunnel, the host itself, a management VLAN, or a hostname later.
        # Set it ONLY for an origin that does not proxy /api — e.g. the
        # cleartext :3000 break-glass path, where Next.js rewrites buffer SSE.
    image: ${SENTINEL_IMAGE_PREFIX:-sentinel}/dashboard:${SENTINEL_VERSION:-latest}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
    logging: *logging
    restart: unless-stopped
    depends_on:
      controlplane: { condition: service_started }
    environment:
      # Server-side Next.js REST rewrite -> internal control plane.
      CONTROL_PLANE_URL: http://controlplane:9501
      # NEXT_PUBLIC_CONTROL_PLANE_URL intentionally absent — see the build args
      # above. Setting it here would be inert anyway (Next inlines NEXT_PUBLIC_*
      # at build time, so a runtime value is never read) while looking as though
      # it configured something.
      PORT: "3000"
      NODE_ENV: production
    ports:
      # Loopback-only. This is the cleartext break-glass path to the UI; the
      # primary console is https://<host>:9443 through the data plane's
      # management listener. Published on all interfaces it was a plaintext login
      # form for an admin console — credentials and the session JWT would cross
      # the network unencrypted. Reach it with an SSH tunnel when needed:
      #   ssh -L 3000:127.0.0.1:3000 <host>
      - "127.0.0.1:3000:3000"
    networks: [sentinel]

  # DEMO TARGET ONLY — OWASP Juice Shop is a DELIBERATELY VULNERABLE application.
  #
  # Behind the `demo` profile so it can never start in a customer installation.
  # It used to start unconditionally, which meant any production deploy silently
  # ran a knowingly exploitable app on the compose network. It is not published to
  # a host port, but that is not a reason to ship it.
  #
  #   demo / pilot :  docker compose --profile demo ... up -d
  #   customer     :  docker compose ... up -d          (juiceshop never starts)
  #
  # ⚠️ Any site whose upstream is `juiceshop:3000` returns 502 without this
  # profile — including the .88/.89 pilot pair. Pass --profile demo there.
  #
  # ⚠️ A profile gates what STARTS and what is RECREATED, not what is pulled or
  # parsed. Roll a demo box with --profile demo or compose leaves this container
  # alone: that is how it kept a 163 MB uncapped log through the roll that capped
  # every other service.
  #
  # PINNED, tag AND digest. `latest` on a deliberately vulnerable application is
  # the one floating tag that must never float: at the time of pinning `latest`
  # already resolved to sha256:73c53fbf… while this deployment was running
  # 20.1.1, and v20.2.0 was published — so any `compose pull` would have swapped
  # the exploitable app for a different version nobody had tested behind the WAF.
  # The digest is the manifest digest from the registry, so the reference is
  # reproducible on a host that has never pulled this image. To move version,
  # change both halves together.
  juiceshop:
    profiles: [demo]
    image: bkimminich/juice-shop:v20.1.1@sha256:cd58d79c5cb4d82f22fbaf616f9ff43bbd04ba630cd6b448a9ed99cf652fcebf
    logging: *logging
    restart: unless-stopped
    mem_limit: 768m
    networks: [sentinel]

  # PUBLIC-EDGE PRACTICE ORIGIN (ghost, ghost-db) LIVES IN compose.ghost.yml.
  #
  # It used to live here behind `profiles: [ghost]`, and that was not enough.
  # Compose interpolates every variable in a file BEFORE filtering by profile,
  # so the `${GHOST_DB_PASSWORD:?...}` guards fired on EVERY command against
  # this file — including a customer `docker compose up` with no interest in a
  # blog. install.sh generates seven secrets and none of them are GHOST_*, so a
  # fresh install aborted at the final step with "required variable
  # GHOST_DB_PASSWORD is missing a value", after images were loaded and
  # /opt/sentinel written. Profiles gate what STARTS, not what is PARSED.
  #
  # This file must stay parseable with a completely empty environment. That is
  # enforced by deploy/ci/check-compose-parses-clean.sh, not by good intentions.
  #
  #   practice :  docker compose -f compose.prod.yml -f compose.ghost.yml \
  #                              --profile ghost up -d ghost-db ghost

  # Metrics. Prometheus scrapes the control plane's /metrics (real aggregated
  # WAF metrics) and is the only consumer of them here. Grafana used to sit in
  # front of it and was removed: AGPLv3, started by default, shipped in the
  # bundle, published a port, and referenced by nothing in the dashboard or the
  # control plane. Prometheus keeps its own expression browser on :9090 if a
  # human needs to query it.
  prometheus:
    image: ${SENTINEL_THIRDPARTY_PREFIX:-}prom/prometheus:v2.54.1
    logging: *logging
    restart: unless-stopped
    # The data planes serve /metrics only with the internal secret. Prometheus
    # reads scrape headers from files, not the environment, so the entrypoint
    # puts the secret in a tmpfs file (never on a volume) and starts it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        umask 077 && printf '%s' "$$SENTINEL_INTERNAL_SECRET" > /run/sk/internal-secret &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d
    environment:
      SENTINEL_INTERNAL_SECRET: ${SENTINEL_INTERNAL_SECRET}
    tmpfs:
      - /run/sk:mode=1777,size=64k
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
      - promdata:/prometheus
    depends_on:
      controlplane: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [sentinel]

volumes:
  pgdata:
  chdata:
  sentinel-logs:
  sentinel-certs:
  # Per-node data-plane state that must outlive the container: currently the last-good
  # config cache. The HA overlay gives each waf node its OWN state volume rather than
  # sharing this one — see compose.ha.yml.
  sentinel-state:
  promdata:
  # ghostdata / ghostdbdata are declared in compose.ghost.yml, alongside the
  # services that use them. Separate volumes so tearing the practice site down
  # never touches WAF data.

networks:
  sentinel:
    driver: bridge
