# =====================================================================
# Sentinel WAF — lean production / MVP-demo Docker Compose.
#
#   postgres + redis  → control-plane backing stores
#   controlplane      → REST :9501 / gRPC :9500, migrates+seeds DB on boot
#   dataplane         → Rust WAF proxy, host :80 -> container :8080
#   dashboard         → Next.js UI on :3000
#   juiceshop         → demo upstream to protect (internal only)
#
# Secrets come from deploy/docker/.env (generated, gitignored).
# Usage (on the host):
#   docker compose -f deploy/docker/compose.prod.yml up -d --build
# =====================================================================

name: sentinel

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [sentinel]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [sentinel]

  controlplane:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: sentinel-controlplane
    image: sentinel/controlplane:latest
    restart: unless-stopped
    # root so it can write the shared NDJSON log volume (hardened via K8s
    # securityContext later). The control-plane hub reads what the proxy writes.
    user: "0:0"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      SENTINEL_DB_URL: ${SENTINEL_DB_URL}
      SENTINEL_REDIS_URL: redis://redis:6379
      SENTINEL_JWT_SECRET: ${SENTINEL_JWT_SECRET}
      SENTINEL_REST_ADDR: 0.0.0.0:9501
      SENTINEL_GRPC_ADDR: 0.0.0.0:9500
      SENTINEL_AUTOSTART_DATAPLANE: "0"
      SENTINEL_LOG_DIR: /var/log/sentinel
      # The dashboard's live-log SSE connects cross-origin (:3000 -> :9501) directly
      # to the control plane; without the dashboard origin allow-listed the browser
      # blocks the EventSource. (REST is same-origin via the Next proxy, unaffected.)
      SENTINEL_CORS_ORIGINS: http://172.16.21.71:3000,https://172.16.21.71:9443
      # Cert repository: control plane proxies cert uploads/list to the data
      # plane's internal API, authenticated with a shared secret (cross-container).
      SENTINEL_DATAPLANE_URL: http://dataplane:8080
      SENTINEL_INTERNAL_SECRET: ${SENTINEL_INTERNAL_SECRET}
      # Public Root CA the dashboard offers for download (Certificates page) so
      # internal users can trust the WAF's HTTPS-by-IP cert. Mounted read-only
      # below; only the PUBLIC cert is exposed, never the CA private key.
      SENTINEL_ROOT_CA_PATH: /etc/sentinel/root-ca.crt
    volumes:
      - sentinel-logs:/var/log/sentinel
      # Private-CA root cert generated by deploy/docker/issue-ip-cert.sh (lives on
      # the host at /opt/sentinel-pki/root.crt). Read-only; public cert only.
      - /opt/sentinel-pki/root.crt:/etc/sentinel/root-ca.crt:ro
    ports:
      # Exposed so the browser's SSE log stream can connect to the control plane
      # directly (the Next.js proxy buffers SSE). REST still goes via the dashboard.
      # ⚠ also exposes /api/v1/internal/config (unauthed) on the internal network — lock down for prod.
      - "9501:9501"
    networks: [sentinel]

  dataplane:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: sentinel-dataplane
    image: sentinel/dataplane:latest
    restart: unless-stopped
    user: "0:0"
    depends_on:
      controlplane: { condition: service_started }
    environment:
      SENTINEL_CONFIG: /etc/sentinel/sentinel.yaml
      SENTINEL_LOG_DIR: /var/log/sentinel
      RUST_LOG: info,sentinel=info
      # Shared secret so the control plane can reach the loopback-only cert API.
      SENTINEL_INTERNAL_SECRET: ${SENTINEL_INTERNAL_SECRET}
      # Upstreams the dedicated management listener (:9443) reverse-proxies to.
      SENTINEL_MGMT_DASHBOARD_UPSTREAM: http://dashboard:3000
      SENTINEL_MGMT_API_UPSTREAM: http://controlplane:9501
    volumes:
      - ./sentinel.proxy.yaml:/etc/sentinel/sentinel.yaml:ro
      - sentinel-logs:/var/log/sentinel
      - sentinel-certs:/var/lib/sentinel/certs   # cert repository (persists ACME/uploaded certs)
    ports:
      - "80:8080"               # public WAF entrypoint (HTTP)
      - "443:8443"              # public WAF entrypoint (HTTPS — SNI cert resolver)
      - "9443:9443"             # MANAGEMENT console (HTTPS — admin UI + API, replaceable mgmt cert)
    networks: [sentinel]

  dashboard:
    build:
      context: ../../dashboard
      dockerfile: ../deploy/docker/Dockerfile.dashboard
      args:
        CONTROL_PLANE_URL: http://controlplane:9501             # server-side REST proxy (internal)
        # Client-side SSE/REST base. Points at the secure MANAGEMENT console
        # (:9443) so live logs stream same-origin through the WAF's own mgmt
        # listener (no mixed-content, no CORS). The console's primary URL is now
        # https://172.16.21.71:9443; :3000 remains a cleartext break-glass path.
        NEXT_PUBLIC_CONTROL_PLANE_URL: https://172.16.21.71:9443
    image: sentinel/dashboard:latest
    restart: unless-stopped
    depends_on:
      controlplane: { condition: service_started }
    environment:
      # Server-side Next.js REST rewrite -> internal control plane.
      CONTROL_PLANE_URL: http://controlplane:9501
      # Client-side SSE base (baked at build; mirrored here for clarity).
      NEXT_PUBLIC_CONTROL_PLANE_URL: https://172.16.21.71:9443
      PORT: "3000"
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks: [sentinel]

  juiceshop:
    image: bkimminich/juice-shop:latest
    restart: unless-stopped
    mem_limit: 768m
    networks: [sentinel]

volumes:
  pgdata:
  sentinel-logs:
  sentinel-certs:

networks:
  sentinel:
    driver: bridge
