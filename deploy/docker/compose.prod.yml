# =====================================================================
# Sentinel WAF — lean production / MVP-demo Docker Compose.
#
#   postgres + redis  → control-plane backing stores
#   clickhouse        → on-prem traffic/event log store (powers Threat Search)
#   migrate           → one-shot goose DB migrations (runs to completion first)
#   controlplane      → REST :9501 / gRPC :9500, seeds DB on boot (after migrate)
#   dataplane         → Rust WAF proxy, host :80 -> container :8080
#   dashboard         → Next.js UI on :3000
#   juiceshop         → demo upstream to protect (internal only)
#
# Secrets come from deploy/docker/.env (generated, gitignored).
# Usage (on the host):
#   docker compose -f deploy/docker/compose.prod.yml up -d --build
# =====================================================================

name: sentinel

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [sentinel]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [sentinel]

  # On-prem time-series log store. The data plane WRITES traffic_buckets +
  # waf_events here; the control plane READS them for the dashboard's "Threat
  # Search" (/events) page. Internal-only — no host port is published; both
  # planes reach it over the docker network at clickhouse:8123.
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    restart: unless-stopped
    mem_limit: 1536m
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      # Keep ClickHouse's own memory accounting within the container limit.
      CLICKHOUSE_MAX_SERVER_MEMORY_USAGE_TO_RAM_RATIO: "0.6"
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      # /ping needs no auth; busybox wget ships in the alpine image. Use the
      # IPv4 loopback explicitly: this host is IPv4-only and `localhost` resolves
      # to ::1 first, where ClickHouse can't bind (IPv6 disabled) → false-unhealthy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks: [sentinel]

  # One-shot DB migrations (goose). Runs to completion before the control plane
  # starts, so its SeedDev finds the schema. The control plane does NOT migrate
  # on boot — it only seeds. goose `up` is idempotent (no-op once current).
  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: sentinel-migrate
    image: sentinel/migrate:latest
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      # goose reads GOOSE_DBSTRING; the SENTINEL_DB_URL DSN form works as-is.
      GOOSE_DBSTRING: ${SENTINEL_DB_URL}
    networks: [sentinel]

  controlplane:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: sentinel-controlplane
    image: sentinel/controlplane:latest
    restart: unless-stopped
    # root so it can write the shared NDJSON log volume (hardened via K8s
    # securityContext later). The control-plane hub reads what the proxy writes.
    user: "0:0"
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      # service_started (not _healthy): never gate the control plane on the
      # analytics store's health. The reader degrades gracefully; the writer
      # self-heals. (A broken CH healthcheck previously gated and downed the stack.)
      clickhouse: { condition: service_started }
    environment:
      SENTINEL_DB_URL: ${SENTINEL_DB_URL}
      SENTINEL_REDIS_URL: redis://redis:6379
      # ClickHouse reader → powers the dashboard's "Threat Search" (/events).
      # Unset = reader disabled (honest empty state); set = event search live.
      SENTINEL_CLICKHOUSE_URL: http://clickhouse:8123
      SENTINEL_CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      SENTINEL_CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      SENTINEL_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      SENTINEL_JWT_SECRET: ${SENTINEL_JWT_SECRET}
      SENTINEL_REST_ADDR: 0.0.0.0:9501
      SENTINEL_GRPC_ADDR: 0.0.0.0:9500
      SENTINEL_AUTOSTART_DATAPLANE: "0"
      SENTINEL_LOG_DIR: /var/log/sentinel
      # The dashboard's live-log SSE connects cross-origin (:3000 -> :9501) directly
      # to the control plane; without the dashboard origin allow-listed the browser
      # blocks the EventSource. (REST is same-origin via the Next proxy, unaffected.)
      SENTINEL_CORS_ORIGINS: http://172.16.21.71:3000,https://172.16.21.71:9443
      # Cert repository: control plane proxies cert uploads/list to the data
      # plane's internal API, authenticated with a shared secret (cross-container).
      SENTINEL_DATAPLANE_URL: http://dataplane:8080
      SENTINEL_INTERNAL_SECRET: ${SENTINEL_INTERNAL_SECRET}
      # Public Root CA the dashboard offers for download (Certificates page) so
      # internal users can trust the WAF's HTTPS-by-IP cert. Mounted read-only
      # below; only the PUBLIC cert is exposed, never the CA private key.
      SENTINEL_ROOT_CA_PATH: /etc/sentinel/root-ca.crt
    volumes:
      - sentinel-logs:/var/log/sentinel
      # Private-CA root cert generated by deploy/docker/issue-ip-cert.sh (lives on
      # the host at /opt/sentinel-pki/root.crt). Read-only; public cert only.
      - /opt/sentinel-pki/root.crt:/etc/sentinel/root-ca.crt:ro
    ports:
      # Exposed so the browser's SSE log stream can connect to the control plane
      # directly (the Next.js proxy buffers SSE). REST still goes via the dashboard.
      # /api/v1/internal/config is now gated by SENTINEL_INTERNAL_SECRET (the data
      # plane sends X-Sentinel-Internal); it no longer leaks site config unauthed.
      - "9501:9501"
    networks: [sentinel]

  dataplane:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: sentinel-dataplane
    image: sentinel/dataplane:latest
    restart: unless-stopped
    user: "0:0"
    # Kernel XDP needs these to load/attach the BPF program and its maps.
    # Without them the data plane simply falls back to the userspace software
    # fast-fail, so the stack still boots on hosts that don't allow XDP.
    cap_add:
      - NET_ADMIN
      - BPF
      - SYS_RESOURCE
      - PERFMON
    ulimits:
      memlock: -1
    depends_on:
      controlplane: { condition: service_started }
      # service_started, not _healthy: the WAF must boot regardless of ClickHouse.
      # The proxy's history writer self-heals (background reconnect with backoff),
      # so it starts persisting once CH is reachable — no restart, no WAF gating.
      clickhouse: { condition: service_started }
    environment:
      SENTINEL_CONFIG: /etc/sentinel/sentinel.yaml
      SENTINEL_LOG_DIR: /var/log/sentinel
      RUST_LOG: info,sentinel=info
      # Shared secret so the control plane can reach the loopback-only cert API.
      SENTINEL_INTERNAL_SECRET: ${SENTINEL_INTERNAL_SECRET}
      # NOTE: SENTINEL_REDIS_URL is intentionally NOT set here. This is a single
      # data-plane node, so the in-process token-bucket rate limiter is correct;
      # pointing it at Redis would switch to sliding-window semantics + a per-
      # request round-trip for no benefit. Set it only for a multi-node fleet.
      # ClickHouse writer → the proxy bulk-inserts traffic_buckets + waf_events
      # (creates the schema on first connect). Same Secret as the reader above
      # so both planes agree; keeps the CH password out of the committed YAML.
      SENTINEL_CLICKHOUSE_URL: http://clickhouse:8123
      SENTINEL_CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      SENTINEL_CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      SENTINEL_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      # Upstreams the dedicated management listener (:9443) reverse-proxies to.
      SENTINEL_MGMT_DASHBOARD_UPSTREAM: http://dashboard:3000
      SENTINEL_MGMT_API_UPSTREAM: http://controlplane:9501
      # HTTP/3: the https listener binds :8443 inside the container but is
      # published on host :443, so advertise h3 on :443 in the Alt-Svc header
      # (else browsers try to reach h3 on :8443 and fail to upgrade).
      SENTINEL_HTTP3_ADVERTISE_PORT: "443"
      # Kernel XDP fast-path: drop blocked source IPs in the NIC/driver path
      # before they reach the proxy. Degrades to software mode if attach fails.
      SENTINEL_XDP_ENABLE: "1"
      SENTINEL_XDP_IFACE: eth0
    volumes:
      - ./sentinel.proxy.yaml:/etc/sentinel/sentinel.yaml:ro
      # Kernel BTF so aya can load the BTF-typed BPF maps.
      - /sys/kernel/btf/vmlinux:/sys/kernel/btf/vmlinux:ro
      - sentinel-logs:/var/log/sentinel
      - sentinel-certs:/var/lib/sentinel/certs   # cert repository (persists ACME/uploaded certs)
    ports:
      - "80:8080"               # public WAF entrypoint (HTTP)
      - "443:8443"              # public WAF entrypoint (HTTPS/TCP — h1+h2, SNI cert resolver)
      - "443:8443/udp"          # public WAF entrypoint (HTTP/3 over QUIC — same cert resolver)
      - "9443:9443"             # MANAGEMENT console (HTTPS — admin UI + API, replaceable mgmt cert)
    networks: [sentinel]

  dashboard:
    build:
      context: ../../dashboard
      dockerfile: ../deploy/docker/Dockerfile.dashboard
      args:
        CONTROL_PLANE_URL: http://controlplane:9501             # server-side REST proxy (internal)
        # Client-side SSE/REST base. Points at the secure MANAGEMENT console
        # (:9443) so live logs stream same-origin through the WAF's own mgmt
        # listener (no mixed-content, no CORS). The console's primary URL is now
        # https://172.16.21.71:9443; :3000 remains a cleartext break-glass path.
        NEXT_PUBLIC_CONTROL_PLANE_URL: https://172.16.21.71:9443
    image: sentinel/dashboard:latest
    restart: unless-stopped
    depends_on:
      controlplane: { condition: service_started }
    environment:
      # Server-side Next.js REST rewrite -> internal control plane.
      CONTROL_PLANE_URL: http://controlplane:9501
      # Client-side SSE base (baked at build; mirrored here for clarity).
      NEXT_PUBLIC_CONTROL_PLANE_URL: https://172.16.21.71:9443
      PORT: "3000"
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks: [sentinel]

  juiceshop:
    image: bkimminich/juice-shop:latest
    restart: unless-stopped
    mem_limit: 768m
    networks: [sentinel]

  # Metrics stack. Prometheus scrapes the control plane's /metrics (real
  # aggregated WAF metrics); Grafana ships a provisioned datasource + the
  # "Sentinel WAF — Overview" dashboard. Grafana UI on host :3001.
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      controlplane: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [sentinel]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus: { condition: service_started }
    ports:
      - "3001:3000"
    networks: [sentinel]

volumes:
  pgdata:
  chdata:
  sentinel-logs:
  sentinel-certs:
  promdata:
  grafanadata:

networks:
  sentinel:
    driver: bridge
