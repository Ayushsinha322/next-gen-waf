# Data-plane HA overlay — the cloud-WAF model.
#
# An active-active fleet of 3 stateless WAF nodes behind an HAProxy load
# balancer. Every node inspects independently (rules/DLP/JWT/etc. from the same
# control-plane config); Redis holds shared rate-limit state so limits are
# fleet-wide. Add more nodes by adding waf4/waf5… — horizontal scale.
#
# Kill any node → HAProxy routes around it in ~1s, on BOTH :80 and :443.
#
# The :443 half of that sentence was untrue until now, and it is worth recording
# why. waf1 published :443 directly, so HTTPS ran on exactly one node: killing
# waf1 — or merely rolling it during an upgrade — took HTTPS down, which is the
# protocol every real client uses. The old header claimed zero downtime anyway,
# and rolling-restart checks did not catch it because they curled ~12s after
# each roll, long after the outage window had closed.
#
# :443/tcp is now fronted by HAProxy in `mode tcp` (see haproxy.cfg). TLS still
# terminates on the WAF nodes — that is where the SNI cert resolver, ACME,
# hot-reload and the JA4 fingerprint live — so HAProxy passes bytes through and
# carries the client address in a PROXY protocol v2 header instead of
# X-Forwarded-For, which it cannot add without parsing HTTP.
#
# STILL SINGLE-HOMED, deliberately: :443/udp (HTTP/3 over QUIC) stays on waf1,
# because HAProxy 2.9 cannot pass QUIC through in tcp mode. HTTP/3 is therefore
# best-effort — if waf1 is down, clients get no UDP answer and fall back to TCP,
# which is fully HA. Alt-Svc still advertises :443, and reaching waf1 over UDP
# while TCP load-balances is safe because the nodes are stateless and share the
# cert volume.
#
# Each node sets `hostname:` so it reports a friendly id (waf1/waf2/waf3) in its
# heartbeat — that id shows on the Cluster & Node Health page and matches the
# HAProxy backend server names.
#
# waf1 additionally hosts the management console (:9443) and :443/udp for
# HTTP/3, and answers to the `dataplane` network alias, so the admin UI and the
# control plane's cert API keep working when this fleet replaces the single node.
# Public HTTPS over TCP is NOT waf1's any more — HAProxy owns :443/tcp.
#
# Usage (from /opt/sentinel-src):
#   docker compose -f deploy/docker/compose.prod.yml -f deploy/docker/compose.ha.yml up -d waf1 waf2 waf3 lb

# Cap this file's containers too. YAML anchors do not cross files, so each
# compose file that defines services declares its own copy, and it must appear
# before any anchor that uses it. See compose.prod.yml for why.
x-logging: &logging
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "5"

x-wafnode: &wafnode
  image: ${SENTINEL_IMAGE_PREFIX:-sentinel}/dataplane:${SENTINEL_VERSION:-latest}
  logging: *logging
  restart: unless-stopped
  user: "0:0"
  # Kernel XDP needs these to load and attach the BPF program and its maps.
  # Their absence is why every node in this fleet reported
  # `ebpf.mode=software, kernel_requested=false` while the standalone
  # `dataplane` service in compose.prod.yml ran kernel-xdp on the SAME image —
  # the binary is always built `--features kernel`, so the only difference was
  # what the topology granted it. It degrades to the userspace software path
  # instead of failing, which is exactly why it went unnoticed.
  #
  # Third instance of the omission the ulimits note below already records: a fix
  # lands on compose.prod.yml's single service and never reaches waf1/waf2/waf3.
  cap_add:
    - NET_ADMIN
    - BPF
    - SYS_RESOURCE
    - PERFMON
  ulimits:
    # Locked memory for BPF maps. Unlimited, matching the standalone service:
    # map creation fails outright below the default 64 KB.
    memlock: -1
    # File descriptors — see the longer note on the `dataplane` service in
    # compose.prod.yml. Every node here accepts up to max_connections (default
    # 10,000) and needs a second descriptor per proxied connection, so saturation
    # wants 20,000+.
    #
    # This anchor had NO ulimits, so the fix applied to compose.prod.yml's single
    # `dataplane` service never reached waf1/waf2/waf3 — i.e. it was missing from
    # precisely the multi-node topology most likely to carry concurrent load. On a
    # host whose Docker default is the traditional 1024, accept(2) starts returning
    # EMFILE at roughly 500 concurrent connections per node.
    nofile: { soft: 65536, hard: 65536 }
  depends_on:
    controlplane: { condition: service_started }
    redis: { condition: service_healthy }
  environment: &wafenv
    # CA bundle used to verify ORIGIN certificates, in ADDITION to the public
    # roots. Empty = public roots only, which is what every deployment had before
    # this existed — and why an internal-CA backend 502'd with no explanation.
    # See origin-ca/README.md.
    SENTINEL_UPSTREAM_CA_FILE: ${SENTINEL_UPSTREAM_CA_FILE:-}
    SENTINEL_CONFIG: /etc/sentinel/sentinel.yaml
    # RUST_LOG is deliberately just `info`, with NO per-crate directive.
    #
    # It was `info,sentinel=info`, and that `sentinel=info` SILENTLY DISABLED every
    # log line from the `sentinel-modules` crate. Proven on .71 by changing only this
    # value and restarting one node: with the directive, zero sentinel_modules lines
    # in the container's entire lifetime; without it, the GeoIP lines appear
    # immediately.
    #
    # The directive looked redundant with the global `info` and was worse than
    # redundant. `sentinel` is not a module-path prefix of `sentinel_modules`, so the
    # targeted directive does not match it, and its presence stops the bare level
    # applying as the default for that target.
    #
    # What was lost: sentinel-modules is geoip, bot_detect, dlp, jwt_auth, anti_ddos,
    # rate_limit, ip_reputation, threat_intel, smuggling, tls_fingerprint, graphql and
    # grpc — TWELVE subsystems whose warnings and errors were invisible on every
    # deployment. It is why the GeoIP "database not found" warning went unnoticed for
    # months: it was being emitted and filtered.
    #
    # If a per-crate level is ever wanted, name the crate exactly
    # (`sentinel_modules=debug`), and check the output before believing it.
    RUST_LOG: info
    SENTINEL_INTERNAL_SECRET: ${SENTINEL_INTERNAL_SECRET}
    # Shared rate-limit state across the fleet (distributed sliding window).
    SENTINEL_REDIS_URL: redis://redis:6379
    SENTINEL_CLICKHOUSE_URL: http://clickhouse:8123
    SENTINEL_CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    SENTINEL_CLICKHOUSE_USER: ${CLICKHOUSE_USER}
    SENTINEL_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    # Event-store retention (days) — the data plane owns the ClickHouse schema
    # and applies these on connect (fresh CREATE + ALTER MODIFY TTL on existing).
    SENTINEL_CLICKHOUSE_EVENT_RETENTION_DAYS: ${SENTINEL_CLICKHOUSE_EVENT_RETENTION_DAYS:-90}
    SENTINEL_CLICKHOUSE_TRAFFIC_RETENTION_DAYS: ${SENTINEL_CLICKHOUSE_TRAFFIC_RETENTION_DAYS:-30}
    # NDJSON log rotation. On the anchor, NOT on a node: three data planes each
    # need the same ceiling, and setting it on one is how a limit ends up
    # applying to a third of the fleet. On-disk bound per node is
    # MAX_MB x (KEEP + 1) x 2 streams — 1.2 GB at these defaults.
    SENTINEL_LOG_MAX_MB: ${SENTINEL_LOG_MAX_MB:-100}
    SENTINEL_LOG_KEEP: ${SENTINEL_LOG_KEEP:-5}
    # Continuous SIEM feed — off unless SENTINEL_SIEM_TARGET is set. See
    # .env.example for why this is not the same as a syslog alert channel.
    SENTINEL_SIEM_TARGET: ${SENTINEL_SIEM_TARGET:-}
    SENTINEL_SIEM_PROTOCOL: ${SENTINEL_SIEM_PROTOCOL:-tcp}
    SENTINEL_SIEM_FORMAT: ${SENTINEL_SIEM_FORMAT:-cef}
    SENTINEL_SIEM_CA_FILE: ${SENTINEL_SIEM_CA_FILE:-}
    SENTINEL_SIEM_QUEUE: ${SENTINEL_SIEM_QUEUE:-10000}
    # Management console upstreams — the :9443 admin listener (defined in
    # sentinel.proxy.yaml) reverse-proxies these. Set on every node; only waf1
    # publishes :9443 to the host, so the others' mgmt listener is inert.
    SENTINEL_MGMT_DASHBOARD_UPSTREAM: http://dashboard:3000
    SENTINEL_MGMT_API_UPSTREAM: http://controlplane:9501
    SENTINEL_HTTP3_ADVERTISE_PORT: "443"
    # The `https` listener sits behind HAProxy in tcp mode, so the transport peer
    # is the balancer and the real client arrives in a PROXY protocol header.
    # Named per listener rather than a global flag: `:80` is proxied in HTTP mode
    # (HAProxy injects X-Forwarded-For instead) and the management console is
    # published straight to loopback, so neither may expect a header.
    #
    # Set HERE and not in sentinel.proxy.yaml because one config file serves both
    # topologies and the correct value is opposite in each: the single-node
    # compose.prod.yml publishes :443 directly, where expecting a header would
    # refuse every real client.
    SENTINEL_PROXY_PROTOCOL_LISTENERS: https
    # ── Client-IP attribution behind the load balancer ────────────────────────
    # REQUIRED in this topology, and inert-by-omission in a way that is easy to miss.
    # Every :80 request reaches these nodes from the `lb` container, so the transport
    # peer is HAProxy, not the client. With no trusted-proxy list the nodes ignore
    # X-Forwarded-For and treat HAProxy's own container address as the client for
    # EVERY request — which silently defeats three things at once: the IP blocklist
    # matches the LB instead of the attacker, per-source rate limits collapse onto a
    # single key, and correlation attributes every client's history to one address.
    #
    # Scoped to the compose network, not 0.0.0.0/0: XFF is only believed when the hop
    # handing it over is one of our own containers. HAProxy sets the header itself
    # (`option forwardfor`) and the proxy walks the chain right-to-left, so a client
    # cannot prepend a forged entry to escape a block or frame someone else.
    SENTINEL_TRUSTED_PROXIES: ${SENTINEL_TRUSTED_PROXIES:-172.18.0.0/16}
    # Shared-NAT ranges exempt from per-source escalation and auto-ban — see the
    # comment in compose.prod.yml. Empty by default; set per deployment.
    SENTINEL_SHARED_EGRESS_CIDRS: ${SENTINEL_SHARED_EGRESS_CIDRS:-}
    SENTINEL_CORRELATION_MAX_SCORE: ${SENTINEL_CORRELATION_MAX_SCORE:-4}
    # Last-good config cache, on a per-node volume (see each service below).
    SENTINEL_CONFIG_CACHE_PATH: /var/lib/sentinel/state/config-cache.json
    # ── Kernel XDP fast path ────────────────────────────────────────────────
    # Drops blocked source IPs in the NIC/driver path before they reach the
    # proxy; degrades to software mode if the attach fails, so this is safe on
    # hosts that do not permit XDP.
    #
    # Effectiveness differs by port in THIS topology, which is worth knowing
    # before reading the counters. Since :443/tcp moved behind HAProxy, BOTH
    # TCP entrypoints arrive from the LB, so every packet's source is the LB
    # container and a banned client IP never matches at the XDP layer on either
    # — it is still stopped in the proxy, one layer up, using the address from
    # X-Forwarded-For (:80) or the PROXY header (:443).
    #
    # This note previously said :443 was published by waf1 directly and that XDP
    # therefore saw real client packets. That was true and is not any more. The
    # only entrypoint where the transport peer IS the client is :443/udp
    # (HTTP/3), which waf1 still publishes.
    #
    # The practical consequence: XDP is a DDoS shock absorber for the UDP path
    # and for anything reaching a node directly, NOT for load-balanced TCP.
    # Per-source packet-level enforcement for TCP belongs at the edge, which
    # here means HAProxy's stick-tables (see haproxy.cfg).
    #
    # Auto-ban is safe behind the LB for two independent reasons: the nodes
    # resolve the real client through SENTINEL_TRUSTED_PROXIES above rather than
    # banning the transport peer, and private addresses are excluded from
    # auto-ban (SENTINEL_XDP_AUTOBAN_INCLUDE_PRIVATE is deliberately not
    # plumbed), so HAProxy's own container address can never be black-holed.
    SENTINEL_XDP_ENABLE: ${SENTINEL_XDP_ENABLE:-1}
    SENTINEL_XDP_IFACE: ${SENTINEL_XDP_IFACE:-eth0}
    SENTINEL_XDP_BLOCK: ${SENTINEL_XDP_BLOCK:-}
    SENTINEL_XDP_AUTOBAN: ${SENTINEL_XDP_AUTOBAN:-1}
    SENTINEL_XDP_AUTOBAN_BLOCKS: ${SENTINEL_XDP_AUTOBAN_BLOCKS:-20}
  # NOTE: every waf service below declares its own `volumes:` (each needs its own
  # state volume), and a service-level key REPLACES the anchor's rather than
  # merging into it. So anything added here is inert for all three nodes. The BTF
  # mount kernel XDP needs is therefore repeated per service, not set here —
  # putting it here would look configured and do nothing, which is the failure
  # mode this file has already hit twice.
  volumes:
    - ./sentinel.proxy.yaml:/etc/sentinel/sentinel.yaml:ro
  networks: [sentinel]

services:
  # This fleet REPLACES compose.prod.yml's single `dataplane` service — but
  # merging an overlay does not remove a service, it only adds to it, so that
  # base service survived into every HA deployment. It was never disabled, only
  # avoided: the usage line above passes an explicit `up -d waf1 waf2 waf3 lb`,
  # and the whole topology depends on the operator remembering to.
  #
  # A plain `docker compose up -d` — the command anyone handed this box will
  # reach for first — therefore tries to start a FOURTH data plane that fights
  # waf1 for :443 and :9443 and HAProxy for :80. Verified by dry-run on the
  # 3-node deployment, where `sentinel-dataplane-1` has never existed precisely
  # because nobody has ever run the obvious command.
  #
  # A profile is the removal compose does not otherwise offer: the service stays
  # defined (so `--profile single-node` can still bring it up deliberately) and
  # is excluded from every default `up`.
  dataplane:
    profiles: ["single-node"]

  waf1:
    <<: *wafnode
    environment:
      <<: *wafenv
      # Own subdirectory. Three nodes appending to a single access.log each
      # hold an open handle, so the first rotation orphans the other two
      # writers and two thirds of traffic disappears from the live view.
      SENTINEL_LOG_DIR: /var/log/sentinel/waf1
    hostname: waf1
    # waf1 doubles as the management/HTTPS host + the "dataplane" the control
    # plane's cert API points at (SENTINEL_DATAPLANE_URL=http://dataplane:8080).
    networks:
      sentinel:
        aliases: [dataplane]
    volumes:
      - sentinel-logs:/var/log/sentinel   # live-log source the control plane tails
      - ./sentinel.proxy.yaml:/etc/sentinel/sentinel.yaml:ro
      # Kernel BTF so aya can load the BTF-typed BPF maps. Repeated per
      # service because a service-level `volumes:` replaces the anchor's.
      - /sys/kernel/btf/vmlinux:/sys/kernel/btf/vmlinux:ro
      - sentinel-certs:/var/lib/sentinel/certs   # shared cert repository (ACME/uploaded)
      # Operator-supplied GeoIP database, read-only. Empty by default — see
      # geoip/README.md. When absent the WAF logs an ERROR and reports the gap at
      # /healthz -> geoip.inert rather than pretending country rules apply.
      - ${SENTINEL_GEOIP_DIR:-./geoip}:/var/lib/sentinel/geoip:ro
      # Operator-supplied CA for ORIGIN certificate verification, read-only.
      # Empty by default — see origin-ca/README.md. Without it the only anchors
      # are the public roots, so an origin behind an internal/corporate CA fails
      # verification and the site 502s.
      - ${SENTINEL_ORIGIN_CA_DIR:-./origin-ca}:/etc/sentinel/origin-ca:ro
      - waf1-state:/var/lib/sentinel/state       # this node's last-good config cache
    ports:
      # MANAGEMENT console (HTTPS — admin UI + API), LOOPBACK-ONLY BY DEFAULT.
      # Published on 0.0.0.0 this is the admin UI of a security appliance facing
      # whatever network the host sits on — and the moment the host gets a public
      # IP, facing the internet. Reach it with an SSH tunnel:
      #   ssh -L 9443:127.0.0.1:9443 root@<host>   then https://127.0.0.1:9443
      #
      # Do NOT edit this line to expose it. The knob is per-deployment, in .env:
      #   SENTINEL_MGMT_BIND=0.0.0.0:
      #
      # USE 0.0.0.0: — NOT a single interface address. A specific address such as
      # `172.16.21.71:` looks tighter and was tried first, but Docker then publishes
      # ONLY that address and the 127.0.0.1 listener disappears. Loopback is
      # load-bearing here: deploy/fleet/fleet.sh health-checks the node through
      # `https://127.0.0.1:9443/healthz`, so `fleet.sh verify` starts failing (the
      # probe gets connection-refused) on a node that is otherwise perfectly
      # healthy. Anything else on the host that reaches the console over loopback —
      # an SSH tunnel someone already has open, a local script — breaks the same
      # way. 0.0.0.0 includes loopback and avoids all of it.
      #
      # Whoever sets it must also add the matching origin to SENTINEL_CORS_ORIGINS
      # (or the UI fails on CORS), and should front it with a host firewall — the
      # mgmt cert is a self-signed rcgen cert with no IP SAN, so it authenticates
      # nothing to the browser. Narrow the exposure at the firewall, which does not
      # take loopback away, rather than at the bind address, which does.
      #
      # This must stay in lockstep with the same port line in compose.prod.yml:
      # `ports` entries MERGE across -f layers, so parameterising only one of them
      # leaves the other still binding loopback and yields two conflicting entries.
      - "${SENTINEL_MGMT_BIND:-127.0.0.1:}9443:9443"
      # :443/tcp is NOT published here any more — HAProxy owns it so that HTTPS
      # survives losing this node. Publishing it from a single container is what
      # made HTTPS single-homed.
      #
      # :443/udp stays, because HAProxy 2.9 cannot pass QUIC through. Docker
      # allows this: tcp/443 (on the lb) and udp/443 (here) are distinct
      # bindings. HTTP/3 is consequently best-effort — see the header.
      - "443:8443/udp"       # HTTP/3 over QUIC — waf1 only, best-effort
  waf2:
    <<: *wafnode
    environment:
      <<: *wafenv
      # Own subdirectory. Three nodes appending to a single access.log each
      # hold an open handle, so the first rotation orphans the other two
      # writers and two thirds of traffic disappears from the live view.
      SENTINEL_LOG_DIR: /var/log/sentinel/waf2
    hostname: waf2
    volumes:
      - sentinel-logs:/var/log/sentinel   # live-log source the control plane tails
      - ./sentinel.proxy.yaml:/etc/sentinel/sentinel.yaml:ro
      # Kernel BTF so aya can load the BTF-typed BPF maps. Repeated per
      # service because a service-level `volumes:` replaces the anchor's.
      - /sys/kernel/btf/vmlinux:/sys/kernel/btf/vmlinux:ro
      # The SAME cert repository waf1 uses. Mandatory now that HAProxy spreads
      # :443 across all three: without it this node would auto-generate its own
      # self-signed cert per SNI name, so a client would be served a different
      # certificate depending on which node it happened to land on — a fresh
      # browser warning on every other request, and any pinning broken.
      #
      # Read-write to match waf1 rather than :ro, because a node that meets a new
      # site first has to be able to write the generated cert. Concurrent writes
      # are safe: cert_store installs via atomic rename. ACME and operator
      # uploads still land on waf1 alone — the control plane's cert API points at
      # the `dataplane` alias, which waf1 owns.
      - sentinel-certs:/var/lib/sentinel/certs
      # Operator-supplied GeoIP database, read-only. Empty by default — see
      # geoip/README.md. When absent the WAF logs an ERROR and reports the gap at
      # /healthz -> geoip.inert rather than pretending country rules apply.
      - ${SENTINEL_GEOIP_DIR:-./geoip}:/var/lib/sentinel/geoip:ro
      # Operator-supplied CA for ORIGIN certificate verification, read-only.
      # Empty by default — see origin-ca/README.md. Without it the only anchors
      # are the public roots, so an origin behind an internal/corporate CA fails
      # verification and the site 502s.
      - ${SENTINEL_ORIGIN_CA_DIR:-./origin-ca}:/etc/sentinel/origin-ca:ro
      - waf2-state:/var/lib/sentinel/state
  waf3:
    <<: *wafnode
    environment:
      <<: *wafenv
      # Own subdirectory. Three nodes appending to a single access.log each
      # hold an open handle, so the first rotation orphans the other two
      # writers and two thirds of traffic disappears from the live view.
      SENTINEL_LOG_DIR: /var/log/sentinel/waf3
    hostname: waf3
    volumes:
      - sentinel-logs:/var/log/sentinel   # live-log source the control plane tails
      - ./sentinel.proxy.yaml:/etc/sentinel/sentinel.yaml:ro
      # Kernel BTF so aya can load the BTF-typed BPF maps. Repeated per
      # service because a service-level `volumes:` replaces the anchor's.
      - /sys/kernel/btf/vmlinux:/sys/kernel/btf/vmlinux:ro
      # The SAME cert repository waf1 uses. Mandatory now that HAProxy spreads
      # :443 across all three: without it this node would auto-generate its own
      # self-signed cert per SNI name, so a client would be served a different
      # certificate depending on which node it happened to land on — a fresh
      # browser warning on every other request, and any pinning broken.
      #
      # Read-write to match waf1 rather than :ro, because a node that meets a new
      # site first has to be able to write the generated cert. Concurrent writes
      # are safe: cert_store installs via atomic rename. ACME and operator
      # uploads still land on waf1 alone — the control plane's cert API points at
      # the `dataplane` alias, which waf1 owns.
      - sentinel-certs:/var/lib/sentinel/certs
      # Operator-supplied GeoIP database, read-only. Empty by default — see
      # geoip/README.md. When absent the WAF logs an ERROR and reports the gap at
      # /healthz -> geoip.inert rather than pretending country rules apply.
      - ${SENTINEL_GEOIP_DIR:-./geoip}:/var/lib/sentinel/geoip:ro
      # Operator-supplied CA for ORIGIN certificate verification, read-only.
      # Empty by default — see origin-ca/README.md. Without it the only anchors
      # are the public roots, so an origin behind an internal/corporate CA fails
      # verification and the site 502s.
      - ${SENTINEL_ORIGIN_CA_DIR:-./origin-ca}:/etc/sentinel/origin-ca:ro
      - waf3-state:/var/lib/sentinel/state

  lb:
    image: ${SENTINEL_THIRDPARTY_PREFIX:-}haproxy:2.9-alpine
    logging: *logging
    restart: unless-stopped
    depends_on: [waf1, waf2, waf3]
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "80:80"       # public WAF entrypoint (in front of the fleet)
      # HTTPS in front of the fleet, tcp passthrough. This is what makes losing
      # a node survivable for HTTPS rather than only for cleartext.
      - "443:443"
      # HAProxy health/stats view — LOOPBACK-ONLY. It discloses backend names,
      # health and per-node traffic, which is reconnaissance for anyone probing
      # the edge. Tunnel to it the same way as :9443.
      - "127.0.0.1:8404:8404"
    networks: [sentinel]

# One state volume PER NODE, deliberately not shared. The cache writer renames a
# temp file into place, and while the temp name is process-unique, three nodes
# writing one directory still means three writers racing to be last on the same
# target for no benefit — each node's cache is its own recovery state, so keep them
# independent.
volumes:
  waf1-state:
  waf2-state:
  waf3-state:
