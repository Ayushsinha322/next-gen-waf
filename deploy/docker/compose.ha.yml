# Data-plane HA overlay — the cloud-WAF model.
#
# An active-active fleet of 3 stateless WAF nodes behind an HAProxy load
# balancer. Every node inspects independently (rules/DLP/JWT/etc. from the same
# control-plane config); Redis holds shared rate-limit state so limits are
# fleet-wide. Kill any node → HAProxy routes around it in ~1s with zero
# downtime. Add more nodes by adding waf4/waf5… — horizontal scale.
#
# Each node sets `hostname:` so it reports a friendly id (waf1/waf2/waf3) in its
# heartbeat — that id shows on the Cluster & Node Health page and matches the
# HAProxy backend server names.
#
# waf1 additionally hosts the management console (:9443) + public HTTPS (:443)
# and answers to the `dataplane` network alias, so the admin UI and the control
# plane's cert API keep working when this fleet replaces the single node.
#
# Usage (from /opt/sentinel-src):
#   docker compose -f deploy/docker/compose.prod.yml -f deploy/docker/compose.ha.yml up -d waf1 waf2 waf3 lb

x-wafnode: &wafnode
  image: sentinel/dataplane:latest
  restart: unless-stopped
  user: "0:0"
  depends_on:
    controlplane: { condition: service_started }
    redis: { condition: service_healthy }
  environment: &wafenv
    SENTINEL_CONFIG: /etc/sentinel/sentinel.yaml
    RUST_LOG: info,sentinel=info
    SENTINEL_INTERNAL_SECRET: ${SENTINEL_INTERNAL_SECRET}
    # Shared rate-limit state across the fleet (distributed sliding window).
    SENTINEL_REDIS_URL: redis://redis:6379
    SENTINEL_CLICKHOUSE_URL: http://clickhouse:8123
    SENTINEL_CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    SENTINEL_CLICKHOUSE_USER: ${CLICKHOUSE_USER}
    SENTINEL_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    # Event-store retention (days) — the data plane owns the ClickHouse schema
    # and applies these on connect (fresh CREATE + ALTER MODIFY TTL on existing).
    SENTINEL_CLICKHOUSE_EVENT_RETENTION_DAYS: ${SENTINEL_CLICKHOUSE_EVENT_RETENTION_DAYS:-90}
    SENTINEL_CLICKHOUSE_TRAFFIC_RETENTION_DAYS: ${SENTINEL_CLICKHOUSE_TRAFFIC_RETENTION_DAYS:-30}
    # Management console upstreams — the :9443 admin listener (defined in
    # sentinel.proxy.yaml) reverse-proxies these. Set on every node; only waf1
    # publishes :9443 to the host, so the others' mgmt listener is inert.
    SENTINEL_MGMT_DASHBOARD_UPSTREAM: http://dashboard:3000
    SENTINEL_MGMT_API_UPSTREAM: http://controlplane:9501
    SENTINEL_HTTP3_ADVERTISE_PORT: "443"
    # ── Client-IP attribution behind the load balancer ────────────────────────
    # REQUIRED in this topology, and inert-by-omission in a way that is easy to miss.
    # Every :80 request reaches these nodes from the `lb` container, so the transport
    # peer is HAProxy, not the client. With no trusted-proxy list the nodes ignore
    # X-Forwarded-For and treat HAProxy's own container address as the client for
    # EVERY request — which silently defeats three things at once: the IP blocklist
    # matches the LB instead of the attacker, per-source rate limits collapse onto a
    # single key, and correlation attributes every client's history to one address.
    #
    # Scoped to the compose network, not 0.0.0.0/0: XFF is only believed when the hop
    # handing it over is one of our own containers. HAProxy sets the header itself
    # (`option forwardfor`) and the proxy walks the chain right-to-left, so a client
    # cannot prepend a forged entry to escape a block or frame someone else.
    SENTINEL_TRUSTED_PROXIES: ${SENTINEL_TRUSTED_PROXIES:-172.18.0.0/16}
    # Shared-NAT ranges exempt from per-source escalation and auto-ban — see the
    # comment in compose.prod.yml. Empty by default; set per deployment.
    SENTINEL_SHARED_EGRESS_CIDRS: ${SENTINEL_SHARED_EGRESS_CIDRS:-}
    SENTINEL_CORRELATION_MAX_SCORE: ${SENTINEL_CORRELATION_MAX_SCORE:-4}
    # Last-good config cache, on a per-node volume (see each service below).
    SENTINEL_CONFIG_CACHE_PATH: /var/lib/sentinel/state/config-cache.json
  volumes:
    - ./sentinel.proxy.yaml:/etc/sentinel/sentinel.yaml:ro
  networks: [sentinel]

services:
  waf1:
    <<: *wafnode
    environment:
      <<: *wafenv
      # Own subdirectory. Three nodes appending to a single access.log each
      # hold an open handle, so the first rotation orphans the other two
      # writers and two thirds of traffic disappears from the live view.
      SENTINEL_LOG_DIR: /var/log/sentinel/waf1
    hostname: waf1
    # waf1 doubles as the management/HTTPS host + the "dataplane" the control
    # plane's cert API points at (SENTINEL_DATAPLANE_URL=http://dataplane:8080).
    networks:
      sentinel:
        aliases: [dataplane]
    volumes:
      - sentinel-logs:/var/log/sentinel   # live-log source the control plane tails
      - ./sentinel.proxy.yaml:/etc/sentinel/sentinel.yaml:ro
      - sentinel-certs:/var/lib/sentinel/certs   # shared cert repository (ACME/uploaded)
      - waf1-state:/var/lib/sentinel/state       # this node's last-good config cache
    ports:
      - "9443:9443"          # MANAGEMENT console (HTTPS — admin UI + API)
      - "443:8443"           # public WAF entrypoint (HTTPS/TCP — h1+h2)
      - "443:8443/udp"       # public WAF entrypoint (HTTP/3 over QUIC)
  waf2:
    <<: *wafnode
    environment:
      <<: *wafenv
      # Own subdirectory. Three nodes appending to a single access.log each
      # hold an open handle, so the first rotation orphans the other two
      # writers and two thirds of traffic disappears from the live view.
      SENTINEL_LOG_DIR: /var/log/sentinel/waf2
    hostname: waf2
    volumes:
      - sentinel-logs:/var/log/sentinel   # live-log source the control plane tails
      - ./sentinel.proxy.yaml:/etc/sentinel/sentinel.yaml:ro
      - waf2-state:/var/lib/sentinel/state
  waf3:
    <<: *wafnode
    environment:
      <<: *wafenv
      # Own subdirectory. Three nodes appending to a single access.log each
      # hold an open handle, so the first rotation orphans the other two
      # writers and two thirds of traffic disappears from the live view.
      SENTINEL_LOG_DIR: /var/log/sentinel/waf3
    hostname: waf3
    volumes:
      - sentinel-logs:/var/log/sentinel   # live-log source the control plane tails
      - ./sentinel.proxy.yaml:/etc/sentinel/sentinel.yaml:ro
      - waf3-state:/var/lib/sentinel/state

  lb:
    image: haproxy:2.9-alpine
    restart: unless-stopped
    depends_on: [waf1, waf2, waf3]
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "80:80"       # public WAF entrypoint (in front of the fleet)
      - "8404:8404"   # HAProxy health/stats view
    networks: [sentinel]

# One state volume PER NODE, deliberately not shared. The cache writer renames a
# temp file into place, and while the temp name is process-unique, three nodes
# writing one directory still means three writers racing to be last on the same
# target for no benefit — each node's cache is its own recovery state, so keep them
# independent.
volumes:
  waf1-state:
  waf2-state:
  waf3-state:
