# Postgres client authentication for the Next-Gen ESDS WAF deployment.
#
# WHY THIS FILE EXISTS: turning on `ssl=on` makes TLS *available*, not *required*.
# The stock image's pg_hba ends with a plain `host all all all scram-sha-256` line,
# which happily accepts an unencrypted connection from anything that can reach
# 5432. So a client that asked for sslmode=disable — a misconfigured service, a
# debugging psql, an attacker who has reached the network — would still get a
# cleartext session carrying session tokens, API-key hashes and audit rows, even
# though the server holds a perfectly good certificate. Enforcing it here is what
# makes the control plane's sslmode=verify-full a property of the SERVER rather
# than a promise each client is trusted to keep.
#
# `hostssl` matches ONLY TLS connections; a cleartext attempt finds no matching
# line and is rejected outright rather than silently downgraded.
#
# Referenced by compose.prod.yml as `-c hba_file=/etc/sentinel/pg/pg_hba.conf`.
# Mounted read-only; must stay world-readable (0644) so postgres (uid 70) can read
# it, which is fine — it contains no secrets.

# TYPE      DATABASE  USER  ADDRESS       METHOD

# Unix socket. This is what the container's own healthcheck uses (`pg_isready`
# without -h) and what `docker compose exec postgres psql` uses. It never crosses
# a network, so there is nothing for TLS to protect; removing this line breaks the
# healthcheck and the container is then marked unhealthy forever.
local       all       all                 trust

# Everything arriving over TCP must be TLS, and must authenticate with SCRAM.
# scram-sha-256 (not md5, not trust): the password never crosses the wire even in
# a hashed form that could be replayed.
hostssl     all       all   0.0.0.0/0     scram-sha-256
hostssl     all       all   ::/0          scram-sha-256

# Deliberately NOT present:
#   host  all all all ...          — would re-open the cleartext path this file closes
#   hostnossl any                  — same, explicitly
#   trust on any TCP line          — would accept any client claiming any role
#
# Streaming replication: the 2-VM active/passive topology needs a `hostssl
# replication` line for its replication role. It is omitted here because this file
# serves the single-node compose deployment; see deploy/docker/2VM-ACTIVE-PASSIVE.md,
# which issues its own pg_hba including that line.
