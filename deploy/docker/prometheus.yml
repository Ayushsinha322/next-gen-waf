# Prometheus scrape config for the Swaraj Kavach stack.
#
# Scrapes the control plane's /metrics (aggregated WAF metrics) and every data
# plane's own /metrics (load shedding, panics, history shedding, the ClickHouse
# writer, Valkey, feeds, …), which nothing scraped before 1.1.18. The data plane
# serves /metrics only to a caller holding the internal secret; the container
# entrypoint (compose.prod.yml) writes it to a tmpfs file read below.
#
# prometheus-rules.yml holds the alert rules. They show on Prometheus's own
# Alerts page; to deliver them, point an Alertmanager at this server. The
# console's alerts (Settings → Notifications) are delivered by the control plane
# itself and do not depend on this.
#
# If SENTINEL_METRICS_TOKEN is set on the control plane, uncomment the
# authorization block and set the same value.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-rules.yml

scrape_configs:
  - job_name: sentinel-controlplane
    metrics_path: /metrics
    static_configs:
      - targets: ["controlplane:9501"]
        labels:
          component: control-plane
    # authorization:
    #   type: Bearer
    #   credentials: "<SENTINEL_METRICS_TOKEN>"

  # Single node: "dataplane". The HA overlay's nodes: waf1 answers as
  # "dataplane", waf2 and waf3 by name. A name that does not resolve in this
  # deployment yields no target, rather than a target that is always down.
  - job_name: sentinel-dataplane
    metrics_path: /metrics
    http_headers:
      x-sentinel-internal:
        files: ["/run/sk/internal-secret"]
    dns_sd_configs:
      - names: ["dataplane", "waf2", "waf3"]
        type: A
        port: 8080
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: node
      - target_label: component
        replacement: data-plane

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
