# Prometheus scrape config for the Swaraj Kavach stack.
# Scrapes the control plane's /metrics endpoint (real aggregated WAF metrics
# from the data-plane NDJSON stream). If SENTINEL_METRICS_TOKEN is set on the
# control plane, uncomment the authorization block and set the same value.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sentinel-controlplane
    metrics_path: /metrics
    static_configs:
      - targets: ["controlplane:9501"]
        labels:
          component: control-plane
    # authorization:
    #   type: Bearer
    #   credentials: "<SENTINEL_METRICS_TOKEN>"

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
