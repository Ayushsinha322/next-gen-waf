# Control-plane cluster overlay — three control-plane nodes (ids 1/2/3) sharing ONE
# Postgres. (Data-plane HA is a separate concern — see compose.ha.yml.)
#
# There is no Raft here any more. Postgres was always the real source of truth, so
# leadership is a session-scoped Postgres ADVISORY LOCK: whichever node holds it is
# the single writer and runs the singleton monitors (cert expiry, alerting, disk
# pressure). Lose the node and its session dies with it, so the lock releases
# automatically and another node takes over — no quorum, no election protocol, no
# split brain to reason about. Nodes are otherwise identical and stateless.
#
# HOW WRITES REACH THE LEADER: clients talk to ANY node. Reads are served locally
# from the shared Postgres; mutating requests are transparently forwarded to the
# lock holder by the control plane itself (leaderForward middleware), so a caller
# never has to know who leads and never sees "not the leader".
#
# Usage (from /opt/sentinel-src):
#   docker compose -f deploy/docker/compose.prod.yml \
#                  -f deploy/docker/compose.cluster.yml up -d controlplane cp2 cp3
#
# INVARIANT: every member MUST get an identical control-plane deploy contract —
# only the node id and advertise address may differ. That contract is BOTH the
# environment AND the volume mounts, and it is the mounts that are easy to forget:
# cp2/cp3 are brand-new services that do NOT inherit anything from the controlplane
# service, so every file the binary reads has to be re-declared here. Two real
# incidents came from breaking this invariant — a stale compose omitting
# SENTINEL_AUDIT_HMAC_KEY / SENTINEL_ALLOW_SUPERUSER_DB crash-looped the cluster
# after an image rebuild, and a missing /etc/sentinel/pki/root.crt mount left
# cp2/cp3 unable to parse a verify-full DSN, so both ran with NO DATABASE while
# still reporting healthy to docker. preflight.sh now checks mount parity too.

# Cap this file's containers too. YAML anchors do not cross files, so each
# compose file that defines services declares its own copy, and it must appear
# before any anchor that uses it. See compose.prod.yml for why.
x-logging: &logging
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "5"

x-cp-env: &cp-env
  SENTINEL_DB_URL: ${SENTINEL_DB_URL}
  SENTINEL_REDIS_URL: redis://redis:6379
  # ClickHouse reader (Threat Search / recent-blocks) — any node may be leader
  # and serve these, so all nodes get the creds.
  SENTINEL_CLICKHOUSE_URL: http://clickhouse:8123
  SENTINEL_CLICKHOUSE_DB: ${CLICKHOUSE_DB}
  SENTINEL_CLICKHOUSE_USER: ${CLICKHOUSE_USER}
  SENTINEL_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  SENTINEL_JWT_SECRET: ${SENTINEL_JWT_SECRET}
  # Required by the audit-HMAC fail-fast (>=32 chars). Boot fatal if unset.
  SENTINEL_AUDIT_HMAC_KEY: ${SENTINEL_AUDIT_HMAC_KEY}
  SENTINEL_INTERNAL_SECRET: ${SENTINEL_INTERNAL_SECRET}
  # Single-tenant demo posture: the stack connects to Postgres as the superuser
  # role (bypasses FORCE RLS); tenant isolation is via explicit predicates. Boot
  # fatal without this opt-out. For multi-tenant prod, point SENTINEL_DB_URL at
  # the non-superuser 'sentinel_app' role and REMOVE this.
  SENTINEL_ALLOW_SUPERUSER_DB: "1"
  SENTINEL_REST_ADDR: 0.0.0.0:9501
  # JSON by default so these lines are ingestable; `console` for local work.
  SENTINEL_LOG_FORMAT: ${SENTINEL_LOG_FORMAT:-json}
  SENTINEL_AUTOSTART_DATAPLANE: "0"
  SENTINEL_LOG_DIR: /var/log/sentinel
  # Same fix as compose.prod.yml: this read `http://172.16.21.71:3000,
  # https://172.16.21.71:9443` — one developer's VM address, shipped to every
  # customer. Anywhere but that box it allow-listed a host that does not exist
  # while OVERRIDING the built-in defaults, since a non-empty value replaces them
  # wholesale. Missed on the first pass because compose.prod.yml was fixed and
  # this overlay was not; grep the whole deploy/ tree, not one file.
  SENTINEL_CORS_ORIGINS: ${SENTINEL_CORS_ORIGINS:-https://127.0.0.1:9443,http://127.0.0.1:3000}
  SENTINEL_DATAPLANE_URL: http://dataplane:8080
  SENTINEL_ROOT_CA_PATH: /etc/sentinel/root-ca.crt

  # ── Outbound mail (password reset) ──────────────────────────────────────
  # Every node needs these, not just the one defined in compose.prod.yml.
  # Leader-forwarding means ANY control plane accepts an API call, so a
  # forgot-password request can land on cp2 or cp3 — and a node without this
  # block would answer "SMTP is not configured" while its siblings send mail.
  # That is the same "fixed the service, missed the topology" shape the
  # SENTINEL_CORS_ORIGINS note above records, and it was reproduced here: the
  # first pass added these to compose.prod.yml only, and cp2/cp3 came up with
  # zero SMTP variables.
  #
  # Blank by default and never given a baked-in value — a shipped relay or
  # sender would route one deployment's password-reset links through another
  # organisation's mail infrastructure.
  SENTINEL_SMTP_HOST: ${SENTINEL_SMTP_HOST:-}
  SENTINEL_SMTP_PORT: ${SENTINEL_SMTP_PORT:-587}
  SENTINEL_SMTP_USERNAME: ${SENTINEL_SMTP_USERNAME:-}
  SENTINEL_SMTP_PASSWORD: ${SENTINEL_SMTP_PASSWORD:-}
  SENTINEL_SMTP_FROM: ${SENTINEL_SMTP_FROM:-}
  SENTINEL_SMTP_FROM_NAME: ${SENTINEL_SMTP_FROM_NAME:-Next-Gen ESDSWAF}
  SENTINEL_SMTP_SECURITY: ${SENTINEL_SMTP_SECURITY:-starttls}
  SENTINEL_SMTP_INSECURE_SKIP_VERIFY: ${SENTINEL_SMTP_INSECURE_SKIP_VERIFY:-0}
  # Reset links are built from this, never from the request's Host header: the
  # forgot-password endpoint is unauthenticated, so trusting that header would
  # let a caller aim a victim's link at a server they control.
  SENTINEL_PUBLIC_URL: ${SENTINEL_PUBLIC_URL:-}
  SENTINEL_ADMIN_EMAIL: ${SENTINEL_ADMIN_EMAIL:-}
  SENTINEL_SECURITY_NOTIFY_EMAIL: ${SENTINEL_SECURITY_NOTIFY_EMAIL:-}
  # Disk-pressure alert: page the SOC when ClickHouse disk crosses this used-%.
  SENTINEL_DISK_ALERT_PCT: ${SENTINEL_DISK_ALERT_PCT:-80}
  SENTINEL_DISK_CHECK_SECS: ${SENTINEL_DISK_CHECK_SECS:-300}
  # Shared HMAC that authenticates inter-node Raft RPC. Same on every member.
  # NO default on purpose: `docker compose config` FAILS if it isn't set in
  # deploy/docker/.env, so the old insecure committed default can never ship.
  # Generate with: openssl rand -hex 32

services:
  # Node 1 = the existing control plane (keeps its image/ports/volumes from
  # compose.prod.yml). Here we fold in the shared env + node-1 raft identity.
  controlplane:
    environment:
      <<: *cp-env
      SENTINEL_NODE_ID: "1"
      # Address the other nodes forward writes to (this node's REST API).
      SENTINEL_ADVERTISE_ADDR: controlplane:9501

  cp2:
    image: ${SENTINEL_IMAGE_PREFIX:-sentinel}/controlplane:${SENTINEL_VERSION:-latest}
    logging: *logging
    hostname: cp2
    restart: unless-stopped
    user: "0:0"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      # Match controlplane: don't boot before the schema is migrated (fresh DB
      # race) and don't gate on ClickHouse health (reader degrades gracefully).
      migrate: { condition: service_completed_successfully }
      clickhouse: { condition: service_started }
    environment:
      SENTINEL_GIT_SHA: ${SENTINEL_VERSION:-unknown}
      SENTINEL_BUILD_DATE: ${SENTINEL_BUILD_DATE:-unknown}
      SENTINEL_GEOIP_DIR: /var/lib/sentinel/geoip
      <<: *cp-env
      SENTINEL_NODE_ID: "2"
      # Address the other nodes forward writes to (this node's REST API).
      SENTINEL_ADVERTISE_ADDR: cp2:9501
    volumes:
      - ${SENTINEL_GEOIP_DIR:-./geoip}:/var/lib/sentinel/geoip   # geoip.refresh writes here when leader
      - sentinel-logs:/var/log/sentinel
      # Public Root CA (read-only) so this node can serve CA-download when leader.
      - /opt/sentinel-pki/root.crt:/etc/sentinel/root-ca.crt:ro
      # SAME CA at the path SENTINEL_DB_URL's sslrootcert names. Two mounts of one
      # file because they serve different consumers: the path above is what this node
      # SERVES to clients downloading the CA, this one is what the Postgres client
      # READS to verify the server. Missing this, the DSN's sslmode=verify-full fails
      # at config-parse time with "unable to read CA file" — the node never gets a
      # database at all and silently falls back to running standalone, so it holds no
      # leadership and serves nothing DB-backed while still looking "up" in docker ps.
      - /opt/sentinel-pki/root.crt:/etc/sentinel/pki/root.crt:ro
    networks: [sentinel]

  cp3:
    image: ${SENTINEL_IMAGE_PREFIX:-sentinel}/controlplane:${SENTINEL_VERSION:-latest}
    logging: *logging
    hostname: cp3
    restart: unless-stopped
    user: "0:0"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      # Match controlplane: don't boot before the schema is migrated (fresh DB
      # race) and don't gate on ClickHouse health (reader degrades gracefully).
      migrate: { condition: service_completed_successfully }
      clickhouse: { condition: service_started }
    environment:
      SENTINEL_GIT_SHA: ${SENTINEL_VERSION:-unknown}
      SENTINEL_BUILD_DATE: ${SENTINEL_BUILD_DATE:-unknown}
      SENTINEL_GEOIP_DIR: /var/lib/sentinel/geoip
      <<: *cp-env
      SENTINEL_NODE_ID: "3"
      # Address the other nodes forward writes to (this node's REST API).
      SENTINEL_ADVERTISE_ADDR: cp3:9501
    volumes:
      - ${SENTINEL_GEOIP_DIR:-./geoip}:/var/lib/sentinel/geoip   # geoip.refresh writes here when leader
      - sentinel-logs:/var/log/sentinel
      - /opt/sentinel-pki/root.crt:/etc/sentinel/root-ca.crt:ro
      # See cp2: required for the DSN's sslrootcert, not optional.
      - /opt/sentinel-pki/root.crt:/etc/sentinel/pki/root.crt:ro
    networks: [sentinel]
