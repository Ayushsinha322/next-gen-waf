# HAProxy — the WAF data-plane load balancer.
#
# Active-active: all WAF nodes serve traffic; HAProxy health-checks each every
# 500ms and ejects a dead node in ~1s, routing all traffic to the survivors —
# zero-downtime failover. Horizontally scalable: add `server wafN ...` lines.
# This is the cloud-WAF model (stateless fleet + LB), not an active/standby pair.

global
    log stdout format raw local0 info
    maxconn 8192
    # Bound the SSL/handshake and session memory a flood can consume, and keep the
    # process from being the thing that falls over first.
    tune.bufsize 32768
    tune.maxaccept 64

defaults
    mode http
    log global
    option httplog
    option redispatch           # if a node dies mid-request, re-send to another node
    retries 3
    # Short connect timeout: when a node is killed its packets are blackholed
    # (no fast RST), so a long connect timeout × retries would blow past the
    # client's deadline. 300ms lets a dead node fail fast and the request
    # redispatch to a healthy node in well under a second → no dropped request.
    timeout connect 300ms
    timeout client  30s
    timeout server  30s
    # Bounds slow-header (slowloris) attacks: a client that has not completed its
    # request headers within 10s is dropped. This is the single most effective
    # anti-slowloris setting available here.
    timeout http-request 10s
    # Reap idle keep-alive connections so a source cannot park thousands of them.
    timeout http-keep-alive 5s
    timeout client-fin 5s

# Public WAF entrypoint. Clients hit the LB; the LB spreads across the fleet.
#
# ── L3/L4 admission control (stick-tables) ───────────────────────────────────
#
# There was NO per-client limiting at this layer. Every flood reached the WAF fleet
# and was only bounded by the application-level rate limiter, which costs a full
# request parse and a Redis round-trip per request — so a connection or request flood
# consumed WAF CPU to decide to reject itself. The cheapest place to shed that load is
# here, before a request is ever proxied.
#
# The table keys on `src`, which is correct AT THE EDGE: HAProxy is the first hop, so
# src IS the client. Do NOT copy these rules to an inner proxy — behind another LB
# `src` becomes that LB and every counter collapses onto one key, which is precisely
# the bug that made the WAF's own IP blocklist inert.
#
# 200k entries x 30s: sized so a large botnet is tracked without unbounded memory.
# ── DNS re-resolution ────────────────────────────────────────────────────────
# Without this, HAProxy resolves each backend name ONCE at startup and caches the
# address for the life of the process. Container IPs change on every recreate, so
# a rolling update silently and PERMANENTLY dropped the recreated node from the
# pool until HAProxy itself was restarted. Observed on the VM: the lb container
# had been up 13 days, waf1 had been recreated since, and the fleet was serving
# from two of three nodes — waf1 took zero requests while reporting healthy,
# which defeats the entire point of a rolling update.
#
# 127.0.0.11 is Docker's embedded DNS on the compose network. `init-addr
# last,libc,none` lets HAProxy boot even when a backend is not yet resolvable
# instead of refusing to start.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s
    hold other      10s
    hold refused    10s
    hold nx         10s
    hold timeout    10s

frontend waf_in
    bind *:80

    # conn_cur = concurrent connections, conn_rate = new conns/period,
    # http_req_rate = requests/period, http_err_rate = 4xx/period.
    stick-table type ip size 200k expire 30s store conn_cur,conn_rate(10s),http_req_rate(10s),http_err_rate(10s)

    # Track every client. Done in the first tcp-request phase so a connection flood is
    # counted before any HTTP parsing happens.
    tcp-request connection track-sc0 src

    # Concurrent-connection cap. Slowloris-style attacks hold many idle connections;
    # this bounds them per source without affecting normal browsers (which open a
    # handful). Rejected at connection level — no HTTP work at all.
    tcp-request connection reject if { sc0_conn_cur gt 100 }

    # Connection-rate cap: 200 new connections per 10s from one source.
    tcp-request connection reject if { sc0_conn_rate gt 200 }

    # Request-rate cap. 429 (not a silent drop) so legitimate clients that trip it can
    # back off correctly, and so it is visible in logs rather than looking like packet
    # loss.
    http-request deny deny_status 429 if { sc0_http_req_rate gt 500 }

    # Error-rate cap: a source generating mostly 4xx is scanning or brute-forcing.
    # Deliberately higher than the request cap so a broken client is not banned for a
    # burst of legitimate 404s.
    http-request deny deny_status 429 if { sc0_http_err_rate gt 200 }

    default_backend waf_fleet

backend waf_fleet
    balance roundrobin
    # Add X-Forwarded-For so the nodes see the real client on :80. Declared HERE
    # rather than in `defaults` because the HTTPS backend below is `mode tcp`,
    # where HAProxy cannot add headers at all — inheriting it there produced an
    # "ignored, requires HTTP mode" warning on every start, which is exactly the
    # kind of benign-but-alarming line someone reads during an incident and
    # chases. HTTPS carries the client address in the PROXY header instead.
    option forwardfor
    retry-on all-retryable-errors        # retry idempotent reqs that hit a dying node
    # READINESS check on /healthz: require "sites":N with N>=1, i.e. the node has
    # synced its WAF config from the control plane and can actually protect —
    # not merely that the process is up. /healthz is served locally (no upstream
    # hit), so this stays fast. A rejoining node reports "sites":0 until it syncs
    # (~15s) so the LB won't send it traffic until it's truly ready → no 502s on
    # recovery. Dead node → DOWN in ~0.6s; in-flight reqs redispatch to a healthy
    # node → no dropped request on failover.
    option httpchk GET /healthz
    # Single-quote the pattern so the double-quotes are literal (HAProxy would
    # otherwise strip them as argument quoting). Matches "sites":<nonzero>.
    http-check expect rstring '"sites":[1-9]'
    default-server check inter 300 fall 2 rise 1 maxconn 4096 on-marked-down shutdown-sessions resolvers docker resolve-prefer ipv4 init-addr last,libc,none
    server waf1 waf1:8080
    server waf2 waf2:8080
    server waf3 waf3:8080

# ── HTTPS: TCP passthrough to the whole fleet ────────────────────────────────
#
# Why this frontend exists: :443 used to be published by waf1 DIRECTLY, so HTTPS
# had no redundancy at all. This file's own header claimed "kill any node → zero
# downtime", and that was true only for :80. Killing waf1 — or simply rolling it
# during an upgrade — took HTTPS down, which is the protocol every real client
# actually uses.
#
# On a single host only one process can bind :443, so the LB has to front it.
#
# mode tcp, NOT http: TLS must terminate at the WAF, because that is where the
# SNI cert resolver, ACME, hot-reload and the JA4 fingerprint live. Terminating
# here would move certificate management into HAProxy and throw the fingerprint
# away.
#
# The cost of tcp mode is that HAProxy cannot inject X-Forwarded-For — it is not
# parsing HTTP. Hence `send-proxy-v2` on the servers below: without it every
# HTTPS client would appear to be this container, silently defeating the IP
# blocklist, per-source rate limits, correlation and XDP auto-ban in one go.
frontend waf_in_tls
    bind *:443
    mode tcp
    option tcplog

    # Same L4 admission control as :80, minus everything that needs HTTP. The
    # request- and error-rate rules cannot exist here (the bytes are encrypted),
    # so the application rate limiter remains the only per-request bound for
    # HTTPS — worth knowing when reading a flood.
    stick-table type ip size 200k expire 30s store conn_cur,conn_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc0_conn_cur gt 100 }
    tcp-request connection reject if { sc0_conn_rate gt 200 }

    default_backend waf_fleet_tls

backend waf_fleet_tls
    mode tcp
    balance roundrobin

    # The health check stays HTTP on :8080 (`check port 8080`) while traffic goes
    # to :8443. Checking the TLS port would only prove a socket accepts, not that
    # the node has synced its config and can actually protect — the same
    # readiness distinction the :80 backend makes.
    #
    # Checks deliberately do NOT send the PROXY header: `check-send-proxy` is a
    # separate directive and is not set. The :8080 listener does not expect one,
    # so enabling it here would mark every node permanently DOWN.
    option httpchk GET /healthz
    http-check expect rstring '"sites":[1-9]'

    # Long-lived TLS connections — a WebSocket upgrade, or socket.io settling on
    # a real websocket — live in a tunnel once the handshake completes, and
    # `timeout server` does not govern that. Without an explicit tunnel timeout
    # they are torn down at the default, which for an SPA holding an open socket
    # looks like the app randomly dropping its connection every 30 seconds.
    timeout tunnel 1h

    default-server check port 8080 inter 300 fall 2 rise 1 maxconn 4096 on-marked-down shutdown-sessions resolvers docker resolve-prefer ipv4 init-addr last,libc,none
    server waf1 waf1:8443 send-proxy-v2
    server waf2 waf2:8443 send-proxy-v2
    server waf3 waf3:8443 send-proxy-v2

# Health/ops view — shows each WAF node UP/DOWN in real time.
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 2s
    # Machine-readable CSV at /stats;csv for the demo script.
