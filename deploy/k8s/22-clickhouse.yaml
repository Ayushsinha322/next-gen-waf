# ClickHouse — on-prem time-series log store that powers the dashboard's
# "Threat Search" (/events). The data plane WRITES traffic_buckets + waf_events
# (creating the schema on first connect); the control plane READS them. Internal
# only — no external Service. StatefulSet + local-path PVC for durable history.
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: sentinel
  labels: { app: clickhouse }
spec:
  clusterIP: None            # headless — stable DNS for the StatefulSet pod
  selector: { app: clickhouse }
  ports:
    - { name: http,   port: 8123, targetPort: 8123 }
    - { name: native, port: 9000, targetPort: 9000 }
---
# ClickHouse memory accounting — the same two settings as
# deploy/docker/clickhouse-memory.xml (see that file for the measurements).
# 24.10 could not correct its global memory tracker; it drifted to hundreds of
# GiB while using under 1 GiB and refused merges and queries.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-memory
  namespace: sentinel
data:
  memory.xml: |
    <clickhouse>
        <memory_worker_correct_memory_tracker>1</memory_worker_correct_memory_tracker>
        <max_server_memory_usage_to_ram_ratio>0.9</max_server_memory_usage_to_ram_ratio>
    </clickhouse>
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: sentinel
spec:
  serviceName: clickhouse
  replicas: 1
  selector: { matchLabels: { app: clickhouse } }
  template:
    metadata:
      labels: { app: clickhouse }
    spec:
      containers:
        - name: clickhouse
          # Exact version — see deploy/docker/compose.prod.yml. One-way upgrade.
          image: clickhouse/clickhouse-server:26.8.14.3-alpine
          env:
            - { name: CLICKHOUSE_DB,   valueFrom: { configMapKeyRef: { name: sentinel-env, key: CLICKHOUSE_DB } } }
            - { name: CLICKHOUSE_USER, valueFrom: { configMapKeyRef: { name: sentinel-env, key: CLICKHOUSE_USER } } }
            - { name: CLICKHOUSE_PASSWORD, valueFrom: { secretKeyRef: { name: sentinel-secrets, key: CLICKHOUSE_PASSWORD } } }
            - { name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1" }
            # The memory ratio is set in the clickhouse-memory ConfigMap. An env
            # var here ("0.6") was never read by the image's entrypoint.
          ports:
            - { name: http,   containerPort: 8123 }
            - { name: native, containerPort: 9000 }
          volumeMounts:
            - { name: chdata, mountPath: /var/lib/clickhouse }
            - { name: ch-memory-config, mountPath: /etc/clickhouse-server/config.d/memory.xml, subPath: memory.xml, readOnly: true }
          readinessProbe:
            # /ping needs no auth; busybox wget ships in the alpine image. Use the
            # IPv4 loopback explicitly — `localhost` may resolve to ::1 where
            # ClickHouse can't bind on IPv4-only nodes (false-negative probe).
            exec: { command: ["sh", "-c", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"] }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec: { command: ["sh", "-c", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"] }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          # ClickHouse wants a high open-file limit. containerd's default nofile
          # (usually 1048576) is sufficient; raise the node limit if you see
          # "Too many open files" under heavy ingest.
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { memory: "1536Mi" }
      volumes:
        - { name: ch-memory-config, configMap: { name: clickhouse-memory } }
  volumeClaimTemplates:
    - metadata:
        name: chdata
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources: { requests: { storage: 20Gi } }
