# Postgres — control-plane system of record (tenants, users, sites, rules,
# alerts, audit, notification channels). StatefulSet + local-path PVC.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sentinel
  labels: { app: postgres }
spec:
  clusterIP: None            # headless — stable DNS for the StatefulSet pod
  selector: { app: postgres }
  ports:
    - { name: pg, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: sentinel
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, valueFrom: { configMapKeyRef: { name: sentinel-env, key: POSTGRES_USER } } }
            - { name: POSTGRES_DB,   valueFrom: { configMapKeyRef: { name: sentinel-env, key: POSTGRES_DB } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: sentinel-secrets, key: POSTGRES_PASSWORD } } }
            # initdb writes here; subdir keeps the volume root clean.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: pg, containerPort: 5432 }
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { memory: "1Gi" }
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources: { requests: { storage: 10Gi } }
