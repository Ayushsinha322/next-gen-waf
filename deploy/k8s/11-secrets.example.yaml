# ============================================================================
# Sentinel WAF — SECRET TEMPLATE.  *** DO NOT COMMIT REAL VALUES ***
#
# Copy this file to `secrets.yaml` (gitignored), replace every CHANGE_ME, and
# apply it. Or create the Secret imperatively (kubectl create secret generic …),
# or manage it with sealed-secrets / external-secrets in a real cluster.
#
#   cp 11-secrets.example.yaml secrets.yaml
#   # edit secrets.yaml, then:
#   kubectl apply -f secrets.yaml
#
# Generate strong values:
#   openssl rand -hex 24      # passwords
#   openssl rand -hex 64      # JWT secret
#
# RULES:
#   • SENTINEL_DB_URL must embed POSTGRES_PASSWORD and point at host `postgres`.
#   • SENTINEL_CLICKHOUSE_PASSWORD and CLICKHOUSE_PASSWORD MUST be identical
#     (one is read by the ClickHouse server, the other by both WAF planes).
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-secrets
  namespace: sentinel
type: Opaque
stringData:
  # Postgres superuser password (also embedded in SENTINEL_DB_URL below).
  POSTGRES_PASSWORD: CHANGE_ME_postgres_password
  # Full DSN the control plane + goose migration job use. Host = the `postgres`
  # Service; password must match POSTGRES_PASSWORD above.
  SENTINEL_DB_URL: postgres://sentinel:CHANGE_ME_postgres_password@postgres:5432/sentinel?sslmode=disable
  # JWT signing secret for dashboard/API auth (openssl rand -hex 64).
  SENTINEL_JWT_SECRET: CHANGE_ME_jwt_secret
  # Shared secret gating the data plane's internal cert/management APIs and the
  # control plane's /internal/config (constant-time compared).
  SENTINEL_INTERNAL_SECRET: CHANGE_ME_internal_secret
  # ClickHouse password — these two keys MUST hold the same value.
  CLICKHOUSE_PASSWORD: CHANGE_ME_clickhouse_password
  SENTINEL_CLICKHOUSE_PASSWORD: CHANGE_ME_clickhouse_password
