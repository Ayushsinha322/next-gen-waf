# Stateful dependencies — made HA so they aren't single points of failure.
#
# ── Postgres (control-plane store) ───────────────────────────────────────────
# A single Postgres pod is a SPOF. We use the CloudNativePG operator to run a
# 3-instance cluster (1 primary + 2 hot standbys, synchronous replication, auto
# failover, spread across nodes). Install the operator first:
#   kubectl apply --server-side -f \
#     https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.24/releases/cnpg-1.24.0.yaml
#
# The operator publishes services: sentinel-postgres-rw (primary, writes) and
# sentinel-postgres-ro (standbys, reads). The control plane's db-url uses -rw.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sentinel-postgres
  namespace: sentinel
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  storage:
    size: 20Gi
  postgresql:
    parameters:
      max_connections: "200"
  # Synchronous replication → a committed write survives losing the primary.
  minSyncReplicas: 1
  maxSyncReplicas: 1
  # Spread the 3 instances across nodes/zones so one node loss ≠ DB outage.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: sentinel
      owner: sentinel
      # Uses the sentinel-postgres-app basic-auth Secret (defined in
      # 00-namespace-config.yaml). Because this field is SET, CNPG does NOT
      # auto-generate credentials — that Secret must exist and its password must
      # match sentinel-secrets/db-url, or the primary never finishes bootstrap.
      secret: { name: sentinel-postgres-app }
---
# ── Redis (shared rate-limit state) ──────────────────────────────────────────
# NOTE: Redis is NOT a hard HA requirement for protection — without it each WAF
# pod falls back to a correct per-pod (in-process) rate limiter; only the
# cross-fleet shared counter is lost. So a Redis outage degrades gracefully, it
# doesn't drop protection.
#
# For fleet-wide shared limits with HA, run a Redis with automatic failover via
# an operator (recommended) rather than a single pod, e.g. the Redis Operator:
#   helm repo add ot-helm https://ot-container-kit.github.io/helm-charts/
#   helm install redis-operator ot-helm/redis-operator -n sentinel
# then a RedisReplication (1 master + 2 replicas) + RedisSentinel for failover,
# exposing a Service named `sentinel-redis` (referenced by the data plane's
# SENTINEL_REDIS_URL). A single-pod Redis is acceptable ONLY for a pilot.
#
# Baseline below: a single-pod `sentinel-redis` so the set applies out of the box.
# Swap it for the operator (RedisReplication + Sentinel) for true Redis HA.
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-redis
  namespace: sentinel
  labels: { app: sentinel, tier: redis }
spec:
  selector: { app: sentinel, tier: redis }
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-redis
  namespace: sentinel
  labels: { app: sentinel, tier: redis }
spec:
  replicas: 1                       # single pod baseline — see operator note above for HA
  selector:
    matchLabels: { app: sentinel, tier: redis }
  template:
    metadata:
      labels: { app: sentinel, tier: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]   # ephemeral rate-limit state
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { memory: "320Mi" }
---
# ── ClickHouse (searchable event history — Threat Search) ─────────────────────
# The data plane WRITES traffic + WAF events here; the control plane READS them.
# Optional: without it, protection is unaffected but /events search is disabled.
# Single-node StatefulSet baseline; for HA use a replicated ClickHouse (Altinity
# operator / ClickHouse Keeper cluster) and a networked StorageClass.
apiVersion: v1
kind: Service
metadata:
  name: sentinel-clickhouse
  namespace: sentinel
  labels: { app: sentinel, tier: clickhouse }
spec:
  clusterIP: None                   # headless (stable pod DNS for the StatefulSet)
  selector: { app: sentinel, tier: clickhouse }
  ports:
    - { name: http,   port: 8123, targetPort: 8123 }
    - { name: native, port: 9000, targetPort: 9000 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sentinel-clickhouse
  namespace: sentinel
  labels: { app: sentinel, tier: clickhouse }
spec:
  serviceName: sentinel-clickhouse
  replicas: 1
  selector:
    matchLabels: { app: sentinel, tier: clickhouse }
  template:
    metadata:
      labels: { app: sentinel, tier: clickhouse }
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24-alpine
          ports:
            - { name: http,   containerPort: 8123 }
            - { name: native, containerPort: 9000 }
          env:
            - { name: CLICKHOUSE_DB, value: "sentinel_logs" }
            - { name: CLICKHOUSE_USER, value: "sentinel" }
            - name: CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: sentinel-secrets, key: clickhouse-password } }
            - { name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1" }
          volumeMounts:
            - { name: chdata, mountPath: /var/lib/clickhouse }
          readinessProbe:
            exec: { command: ["sh", "-c", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { memory: "1536Mi" }
  volumeClaimTemplates:
    - metadata: { name: chdata }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 20Gi } }
