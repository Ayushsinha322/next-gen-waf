# Stateful dependencies — made HA so they aren't single points of failure.
#
# ── Postgres (control-plane store) ───────────────────────────────────────────
# A single Postgres pod is a SPOF. We use the CloudNativePG operator to run a
# 3-instance cluster (1 primary + 2 hot standbys, synchronous replication, auto
# failover, spread across nodes). Install the operator first:
#   kubectl apply --server-side -f \
#     https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.24/releases/cnpg-1.24.0.yaml
#
# The operator publishes services: sentinel-postgres-rw (primary, writes) and
# sentinel-postgres-ro (standbys, reads). The control plane's db-url uses -rw.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sentinel-postgres
  namespace: sentinel
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  storage:
    size: 20Gi
  postgresql:
    parameters:
      max_connections: "200"
  # Synchronous replication → a committed write survives losing the primary.
  minSyncReplicas: 1
  maxSyncReplicas: 1
  # Spread the 3 instances across nodes/zones so one node loss ≠ DB outage.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    # CNPG manages its pods directly, so the 300s default applies here too. The
    # operator promotes a standby quickly, but the pod on the dead node would
    # otherwise linger for five minutes before being replaced, leaving the cluster
    # a replica short (and therefore unable to satisfy minSyncReplicas) far longer
    # than necessary.
    tolerations:
      - { key: node.kubernetes.io/not-ready,   operator: Exists, effect: NoExecute, tolerationSeconds: 20 }
      - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 20 }
  bootstrap:
    initdb:
      database: sentinel
      owner: sentinel
      # Uses the sentinel-postgres-app basic-auth Secret (defined in
      # 00-namespace-config.yaml). Because this field is SET, CNPG does NOT
      # auto-generate credentials — that Secret must exist and its password must
      # match sentinel-secrets/db-url, or the primary never finishes bootstrap.
      secret: { name: sentinel-postgres-app }
---
# ── Redis (shared rate-limit state) ──────────────────────────────────────────
# NOTE: Redis is NOT a hard HA requirement for protection — without it each WAF
# pod falls back to a correct per-pod (in-process) rate limiter; only the
# cross-fleet shared counter is lost. So a Redis outage degrades gracefully, it
# doesn't drop protection.
#
# DECISION: a single stateless pod is the right answer here, not Sentinel or a
# Redis operator. Redis stores only 1-second sliding-window counters with
# persistence disabled, so there is no data worth replicating and no PVC pinning it
# to a node — Kubernetes reschedules it freely and an empty cache costs nothing.
# The real exposure was never replication but the 300s default reschedule delay
# after a node dies, which is fixed by the tolerations below. Adding Sentinel would
# mean 6 pods and a Rust client rework (redis 0.24's Sentinel support hands back a
# non-reconnecting MultiplexedConnection) to shave a window that is already covered
# by the client's in-memory fallback. See the DO-NOT-RAISE note on replicas below —
# scaling this Deployment to 2 silently breaks limit accuracy.
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-redis
  namespace: sentinel
  labels: { app: sentinel, tier: redis }
spec:
  selector: { app: sentinel, tier: redis }
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-redis
  namespace: sentinel
  labels: { app: sentinel, tier: redis }
spec:
  # ── DO NOT RAISE THIS TO 2 ───────────────────────────────────────────────────
  #
  # This looks like the obvious "make Redis HA" change and it is actively harmful.
  # Redis is not multi-master: two pods behind one Service are two INDEPENDENT
  # caches, and the Service round-robins between them. Fleet-wide rate limiting
  # would then see roughly half of each client's requests in either cache, so a
  # 100 rps limit would admit ~200 rps — a silent loss of enforcement accuracy
  # that looks like a redundancy improvement.
  #
  # Redis Sentinel was considered and deliberately NOT adopted. Sentinel exists to
  # replicate DATA and promote a master; here there is no data worth replicating
  # (persistence is off and the sliding windows are 1 second long), the client
  # already degrades safely to an in-memory limiter on any Redis error
  # (crates/sentinel-modules/src/rate_limit/mod.rs), and the Rust client would need
  # reworking because redis 0.24's Sentinel support returns a non-reconnecting
  # MultiplexedConnection rather than the ConnectionManager in use. The fast
  # reschedule configured below addresses the actual exposure instead.
  #
  # Redis holds no durable state, so it needs no PVC and is not pinned to a node —
  # Kubernetes reschedules it freely, and an empty cache after a restart is
  # harmless.
  replicas: 1
  selector:
    matchLabels: { app: sentinel, tier: redis }
  template:
    metadata:
      labels: { app: sentinel, tier: redis }
    spec:
      # ── Fast reschedule after a NODE dies ────────────────────────────────────
      #
      # Kubernetes' default tolerations for node.kubernetes.io/not-ready and
      # /unreachable are 300 SECONDS. Nothing here overrode them, so when a VM
      # died every pod on it sat un-rescheduled for five minutes — regardless of
      # replicated storage, PodDisruptionBudgets, or how quickly the node was
      # detected as gone.
      #
      # For Redis that meant five minutes of rate limiting falling back to the
      # per-node in-memory limiter, so with 3 data-plane pods a 100 rps cap
      # behaved like ~300 rps for that whole window. This 20s toleration is the
      # single highest-leverage HA change in this file: it cuts the node-death
      # recovery window from ~5 minutes to ~30 seconds for every pod that carries
      # it, which is far more than Redis replication would have bought.
      #
      # Do not shorten much below 20s: a brief control-plane hiccup or a node
      # under momentary memory pressure can mark a healthy node NotReady, and an
      # over-eager value turns that into needless pod churn.
      tolerations:
        - { key: node.kubernetes.io/not-ready,   operator: Exists, effect: NoExecute, tolerationSeconds: 20 }
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 20 }
      containers:
        - name: redis
          # MUST STAY replicas: 1 — see the note above the Deployment. Redis holds
          # only 1-second sliding windows with persistence disabled, so there is no
          # data to replicate; what matters is that a Redis endpoint exists, which
          # the toleration above restores in ~30s instead of ~5min.
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]   # ephemeral rate-limit state
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { memory: "320Mi" }
---
# ── ClickHouse (searchable event history — Threat Search) ─────────────────────
# The data plane WRITES traffic + WAF events here; the control plane READS them.
# Optional: without it, protection is unaffected but /events search is disabled.
#
# DECISION: HA for ClickHouse is handled at the STORAGE layer (one replica, on the
# `sentinel-replicated` StorageClass from 05-storage.yaml), not by ClickHouse Keeper
# + ReplicatedMergeTree. Keeper-based replication was considered and rejected for
# this component: it needs 3 Keeper pods, a MergeTree -> ReplicatedMergeTree schema
# migration and a two-replica write path, all to protect a store whose loss costs
# only Threat Search queries — protection never reads from ClickHouse. Replicated
# storage gives no event loss and recovery in roughly a pod reschedule, which is the
# right trade here. It does require a replicated CSI driver; if none is installed,
# comment out storageClassName below and event history simply loses node-loss
# durability (see 05-storage.yaml).
apiVersion: v1
kind: Service
metadata:
  name: sentinel-clickhouse
  namespace: sentinel
  labels: { app: sentinel, tier: clickhouse }
spec:
  clusterIP: None                   # headless (stable pod DNS for the StatefulSet)
  selector: { app: sentinel, tier: clickhouse }
  ports:
    - { name: http,   port: 8123, targetPort: 8123 }
    - { name: native, port: 9000, targetPort: 9000 }
---
# ClickHouse memory accounting — the same two settings as
# deploy/docker/clickhouse-memory.xml (see that file for the measurements).
# 24.10 could not correct its global memory tracker; it drifted to hundreds of
# GiB while using under 1 GiB and refused merges and queries.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-clickhouse-memory
  namespace: sentinel
data:
  memory.xml: |
    <clickhouse>
        <memory_worker_correct_memory_tracker>1</memory_worker_correct_memory_tracker>
        <max_server_memory_usage_to_ram_ratio>0.9</max_server_memory_usage_to_ram_ratio>
    </clickhouse>
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sentinel-clickhouse
  namespace: sentinel
  labels: { app: sentinel, tier: clickhouse }
spec:
  serviceName: sentinel-clickhouse
  replicas: 1
  selector:
    matchLabels: { app: sentinel, tier: clickhouse }
  template:
    metadata:
      labels: { app: sentinel, tier: clickhouse }
    spec:
      # Replicated storage lets the volume follow the pod to a surviving node, but
      # only AFTER the pod is rescheduled — which the 300s default delayed by five
      # minutes, negating most of the benefit. See 30-datastores.yaml Redis note.
      # Cut the node-death recovery window from the Kubernetes default of 300s to
      # ~30s. See the full rationale in 30-datastores.yaml (Redis Deployment).
      tolerations:
        - { key: node.kubernetes.io/not-ready,   operator: Exists, effect: NoExecute, tolerationSeconds: 20 }
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 20 }
      containers:
        - name: clickhouse
          # Exact version — see deploy/docker/compose.prod.yml. One-way upgrade.
          image: clickhouse/clickhouse-server:26.3.35.3-alpine
          ports:
            - { name: http,   containerPort: 8123 }
            - { name: native, containerPort: 9000 }
          env:
            - { name: CLICKHOUSE_DB, value: "sentinel_logs" }
            - { name: CLICKHOUSE_USER, value: "sentinel" }
            - name: CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: sentinel-secrets, key: clickhouse-password } }
            - { name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1" }
          volumeMounts:
            - { name: chdata, mountPath: /var/lib/clickhouse }
            - { name: ch-memory-config, mountPath: /etc/clickhouse-server/config.d/memory.xml, subPath: memory.xml, readOnly: true }
          readinessProbe:
            exec: { command: ["sh", "-c", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { memory: "1536Mi" }
      volumes:
        - { name: ch-memory-config, configMap: { name: sentinel-clickhouse-memory } }
  volumeClaimTemplates:
    - metadata: { name: chdata }
      spec:
        accessModes: [ReadWriteOnce]
        # Replicated storage (see 05-storage.yaml): ClickHouse runs as a single
        # replica and does NOT replicate itself, so its data must survive a node
        # loss at the STORAGE layer. On local-path a node death would strand this
        # volume and take Threat Search offline until the node returned. If you
        # have not installed a replicated CSI provider yet, comment this line out
        # to fall back to the default (local-path) — the WAF still runs; only
        # event history/Threat Search loses node-loss durability.
        storageClassName: sentinel-replicated
        resources: { requests: { storage: 20Gi } }
