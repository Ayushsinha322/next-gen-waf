# Control plane — 3 replicas, management-brain HA.
#
# Write leadership is a Postgres session-scoped advisory lock, NOT a control-plane
# consensus protocol. What that changes here:
#
#  - No consensus port, no shared RPC secret, no per-pod persistent volume. The
#    Raft log lived on a PVC and was never compacted, so it grew until the disk
#    filled; there is no log any more.
#  - Losing 2 of 3 replicas no longer refuses writes. The surviving node still
#    holds (or takes) the lock and serves writes, because availability now depends
#    on Postgres — which the write needed anyway, and which is itself HA with its
#    own synchronous quorum under CloudNativePG.
#  - StatefulSet identity is only used for a stable node NAME and forwarding
#    address; there is no node numbering or self-excluding peer list to derive.
#
# Remaining HA properties:
#  - StatefulSet, replicas: 3 → spare capacity, and any node can accept writes
#    (followers transparently forward to the lock holder).
#  - headless Service → stable per-pod DNS used as the write-forwarding address.
#  - podAntiAffinity → one replica per node.
#  - PodDisruptionBudget minAvailable: 2 → drains keep spare capacity. It no longer
#    protects a quorum, because there isn't one.
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-controlplane-headless
  namespace: sentinel
spec:
  clusterIP: None                 # headless → stable per-pod DNS for write forwarding
  # Followers forward writes to the leader by its pod DNS, and a node that is not
  # yet "ready" may already hold the lock, so its address must still resolve.
  publishNotReadyAddresses: true
  selector: { app: sentinel, tier: controlplane }
  ports:
    - { name: rest, port: 9501 }
---
apiVersion: v1
kind: Service                     # stable client endpoint (REST API) the data plane syncs from
metadata:
  name: sentinel-controlplane
  namespace: sentinel
  # ServiceMonitor (70-monitoring) matches THIS client Service — ready pods only,
  # job="sentinel-controlplane". Keep these labels off the headless Service or the
  # monitor double-scrapes and the alert's job matcher breaks.
  labels: { app: sentinel, tier: controlplane }
spec:
  selector: { app: sentinel, tier: controlplane }
  ports:
    - { name: rest, port: 9501, targetPort: 9501 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sentinel-controlplane
  namespace: sentinel
spec:
  serviceName: sentinel-controlplane-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: sentinel, tier: controlplane }
  template:
    metadata:
      labels: { app: sentinel, tier: controlplane }
    spec:
      # Must comfortably exceed preStop (8s) plus graceful shutdown, or the kubelet
      # SIGKILLs mid-drain. The default 30s left no margin once the REST server's
      # own 10s shutdown timeout is accounted for.
      terminationGracePeriodSeconds: 45
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: sentinel, tier: controlplane }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: controlplane
          image: registry.example.com/sentinel/controlplane:latest
          ports:
            - { name: rest, containerPort: 9501 }
          env:
            - { name: SENTINEL_REST_ADDR, value: "0.0.0.0:9501" }
            - { name: SENTINEL_AUTOSTART_DATAPLANE, value: "0" }
            # ClickHouse reader: powers Threat Search / event history (/events/*).
            # Same DB/creds the data-plane writer uses. Omit to disable search.
            - { name: SENTINEL_CLICKHOUSE_URL, value: "http://sentinel-clickhouse:8123" }
            - { name: SENTINEL_CLICKHOUSE_DB, value: "sentinel_logs" }
            - { name: SENTINEL_CLICKHOUSE_USER, value: "sentinel" }
            - name: SENTINEL_CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: sentinel-secrets, key: clickhouse-password } }
            - name: SENTINEL_DB_URL
              valueFrom: { secretKeyRef: { name: sentinel-secrets, key: db-url } }
            - name: SENTINEL_JWT_SECRET
              valueFrom: { secretKeyRef: { name: sentinel-secrets, key: jwt-secret } }
            - name: SENTINEL_INTERNAL_SECRET
              valueFrom: { secretKeyRef: { name: sentinel-secrets, key: internal-secret } }
            # --- Node identity for write-leader election ---
            # Leadership is a Postgres advisory lock, so there is no peer list, no
            # node numbering, no consensus port, and no shared RPC secret to manage.
            # A node only needs a stable name and an address peers can forward
            # writes to. SENTINEL_RAFT_* and the raft-secret key are all gone, as is
            # the persistent volume that held the (never-compacted) Raft log.
            - name: SENTINEL_NODE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: SENTINEL_POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: SENTINEL_HEADLESS_SERVICE, value: "sentinel-controlplane-headless" }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "512Mi" }
          # Readiness gates Service endpoints, so it must reflect whether this node
          # can actually serve: /readyz checks the database and that a write leader
          # is in view. It was previously pointed at /health, which is a static
          # always-200 liveness endpoint — so a node with an unreachable database
          # kept receiving traffic, and the /readyz handler that already existed was
          # never consulted by anything.
          readinessProbe:
            httpGet: { path: /readyz, port: 9501 }
            periodSeconds: 5
            failureThreshold: 2
          # Liveness stays on the cheap static endpoint. Pointing it at /readyz
          # would restart a healthy node during a database blip, turning a
          # dependency outage into a crash loop.
          livenessProbe:
            httpGet: { path: /health, port: 9501 }
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Endpoint removal is asynchronous: without this pause the container
                # can stop while kube-proxy still routes to it, so a rollout drops
                # in-flight connections. Sleep past propagation, then let the normal
                # shutdown path resign leadership and drain.
                command: ["/bin/sh", "-c", "sleep 8"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sentinel-controlplane-pdb
  namespace: sentinel
spec:
  minAvailable: 2               # keep spare capacity during voluntary disruptions
  selector:
    matchLabels: { app: sentinel, tier: controlplane }
