# Control plane — 3-replica Raft cluster (management brain HA).
#
# HA properties:
#  - StatefulSet, replicas: 3 → Raft quorum survives 1 node failure (2/3 majority).
#  - headless Service → stable per-pod DNS (sentinel-controlplane-0.<svc> …) that
#    Raft peers use to find each other.
#  - podAntiAffinity → one replica per node.
#  - persistent volume per pod → Raft log/term/vote survive a restart.
#  - PodDisruptionBudget minAvailable: 2 → drains never break quorum.
#
# StatefulSet identity: a StatefulSet gives every pod identical env, so NODE_ID
# and the self-excluding peer list can't be hard-coded. controllerd derives them
# natively (no entrypoint/shell needed — works in the distroless image): when
# SENTINEL_NODE_ID is unset it reads SENTINEL_RAFT_POD_NAME (the pod ordinal),
# SENTINEL_RAFT_REPLICAS, and SENTINEL_RAFT_SERVICE to compute NODE_ID = ordinal+1
# and SENTINEL_RAFT_PEERS over the headless-Service DNS of the other ordinals.
# See deriveRaftTopology in control-plane/cmd/controllerd/main.go.
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-controlplane-headless
  namespace: sentinel
spec:
  clusterIP: None                 # headless → stable pod DNS for Raft peers
  publishNotReadyAddresses: true  # peers must resolve each other during election, before "ready"
  selector: { app: sentinel, tier: controlplane }
  ports:
    - { name: raft, port: 9600 }
    - { name: rest, port: 9501 }
---
apiVersion: v1
kind: Service                     # stable client endpoint (REST API) the data plane syncs from
metadata:
  name: sentinel-controlplane
  namespace: sentinel
  # ServiceMonitor (70-monitoring) matches THIS client Service — ready pods only,
  # job="sentinel-controlplane". Keep these labels off the headless Service or the
  # monitor double-scrapes and the alert's job matcher breaks.
  labels: { app: sentinel, tier: controlplane }
spec:
  selector: { app: sentinel, tier: controlplane }
  ports:
    - { name: rest, port: 9501, targetPort: 9501 }
    - { name: grpc, port: 9500, targetPort: 9500 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sentinel-controlplane
  namespace: sentinel
spec:
  serviceName: sentinel-controlplane-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: sentinel, tier: controlplane }
  template:
    metadata:
      labels: { app: sentinel, tier: controlplane }
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: sentinel, tier: controlplane }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: controlplane
          image: registry.example.com/sentinel/controlplane:latest
          ports:
            - { name: rest, containerPort: 9501 }
            - { name: grpc, containerPort: 9500 }
            - { name: raft, containerPort: 9600 }
          env:
            - { name: SENTINEL_REST_ADDR, value: "0.0.0.0:9501" }
            - { name: SENTINEL_GRPC_ADDR, value: "0.0.0.0:9500" }
            - { name: SENTINEL_AUTOSTART_DATAPLANE, value: "0" }
            # ClickHouse reader: powers Threat Search / event history (/events/*).
            # Same DB/creds the data-plane writer uses. Omit to disable search.
            - { name: SENTINEL_CLICKHOUSE_URL, value: "http://sentinel-clickhouse:8123" }
            - { name: SENTINEL_CLICKHOUSE_DB, value: "sentinel_logs" }
            - { name: SENTINEL_CLICKHOUSE_USER, value: "sentinel" }
            - name: SENTINEL_CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: sentinel-secrets, key: clickhouse-password } }
            - name: SENTINEL_DB_URL
              valueFrom: { secretKeyRef: { name: sentinel-secrets, key: db-url } }
            - name: SENTINEL_JWT_SECRET
              valueFrom: { secretKeyRef: { name: sentinel-secrets, key: jwt-secret } }
            - name: SENTINEL_INTERNAL_SECRET
              valueFrom: { secretKeyRef: { name: sentinel-secrets, key: internal-secret } }
            - name: SENTINEL_RAFT_SECRET
              valueFrom: { secretKeyRef: { name: sentinel-secrets, key: raft-secret } }
            # --- Raft identity, derived by controllerd from the pod ordinal ---
            # NODE_ID and PEERS are NOT set here on purpose: with these three
            # env vars + the pod name, controllerd computes them itself, e.g.
            #   sentinel-controlplane-0 → NODE_ID=1,
            #     PEERS=2=sentinel-controlplane-1.sentinel-controlplane-headless:9600,
            #           3=sentinel-controlplane-2.sentinel-controlplane-headless:9600
            - { name: SENTINEL_RAFT_ADDR, value: "0.0.0.0:9600" }
            - { name: SENTINEL_RAFT_DIR, value: "/var/lib/sentinel/raft" }
            - { name: SENTINEL_RAFT_REPLICAS, value: "3" }   # MUST match spec.replicas above
            - { name: SENTINEL_RAFT_SERVICE, value: "sentinel-controlplane-headless" }
            - { name: SENTINEL_RAFT_PORT, value: "9600" }
            - name: SENTINEL_RAFT_POD_NAME   # controllerd reads this to derive NODE_ID + PEERS
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          volumeMounts:
            - { name: raft-data, mountPath: /var/lib/sentinel/raft }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 9501 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 9501 }
            periodSeconds: 10
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata: { name: raft-data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sentinel-controlplane-pdb
  namespace: sentinel
spec:
  minAvailable: 2               # keep Raft quorum during voluntary disruptions
  selector:
    matchLabels: { app: sentinel, tier: controlplane }
