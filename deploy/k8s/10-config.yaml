# Non-secret configuration for the Sentinel WAF stack.
#
#   sentinel-env          → shared env (loaded by the edge pod via envFrom; the
#                           data-store containers reference individual keys)
#   sentinel-proxy-config → the data-plane proxy's sentinel.yaml
#
# Secrets (passwords, JWT/internal secrets, DB DSN) live in the separate
# Secret `sentinel-secrets` — see 11-secrets.example.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-env
  namespace: sentinel
data:
  # ── data-store identities (non-secret; passwords are in the Secret) ──────────
  POSTGRES_USER: sentinel
  POSTGRES_DB: sentinel
  CLICKHOUSE_USER: sentinel
  CLICKHOUSE_DB: sentinel_logs

  # ── control plane ────────────────────────────────────────────────────────────
  SENTINEL_REST_ADDR: 0.0.0.0:9501
  SENTINEL_AUTOSTART_DATAPLANE: "0"
  SENTINEL_LOG_DIR: /var/log/sentinel
  # controlplane → dataplane cert API; same pod, so loopback (no Service hop).
  SENTINEL_DATAPLANE_URL: http://localhost:8080

  # ── data plane ───────────────────────────────────────────────────────────────
  SENTINEL_CONFIG: /etc/sentinel/sentinel.yaml
  # RUST_LOG is deliberately just `info`, with NO per-crate directive.
  #
  # It was `info,sentinel=info`, and that `sentinel=info` SILENTLY DISABLED every
  # log line from the `sentinel-modules` crate. Proven on .71 by changing only this
  # value and restarting one node: with the directive, zero sentinel_modules lines
  # in the container's entire lifetime; without it, the GeoIP lines appear
  # immediately.
  #
  # The directive looked redundant with the global `info` and was worse than
  # redundant. `sentinel` is not a module-path prefix of `sentinel_modules`, so the
  # targeted directive does not match it, and its presence stops the bare level
  # applying as the default for that target.
  #
  # What was lost: sentinel-modules is geoip, bot_detect, dlp, jwt_auth, anti_ddos,
  # rate_limit, ip_reputation, threat_intel, smuggling, tls_fingerprint, graphql and
  # grpc — TWELVE subsystems whose warnings and errors were invisible on every
  # deployment. It is why the GeoIP "database not found" warning went unnoticed for
  # months: it was being emitted and filtered.
  #
  # If a per-crate level is ever wanted, name the crate exactly
  # (`sentinel_modules=debug`), and check the output before believing it.
  RUST_LOG: info
  # dataplane management listener (:9443) reverse-proxy upstreams. The control
  # plane shares the pod → loopback; the dashboard is its own pod → Service DNS.
  SENTINEL_MGMT_API_UPSTREAM: http://localhost:9501
  SENTINEL_MGMT_DASHBOARD_UPSTREAM: http://dashboard:3000

  # ── shared backing stores (Service DNS within the namespace) ─────────────────
  # NOTE: SENTINEL_REDIS_URL is intentionally NOT set. The control plane does not
  # use Redis, and this edge runs a single data-plane replica, so the in-process
  # token-bucket rate limiter is correct. Set SENTINEL_REDIS_URL=redis://redis:6379
  # ONLY on the dataplane container if you scale the data plane to multiple nodes
  # (and re-tune rps/burst for sliding-window semantics).
  # ClickHouse powers Threat Search: the data plane WRITES, the control plane
  # READS. Password comes from the Secret (SENTINEL_CLICKHOUSE_PASSWORD).
  SENTINEL_CLICKHOUSE_URL: http://clickhouse:8123
  SENTINEL_CLICKHOUSE_DB: sentinel_logs
  SENTINEL_CLICKHOUSE_USER: sentinel
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-proxy-config
  namespace: sentinel
data:
  # Data-plane proxy config. Sites are intentionally empty: the control plane is
  # authoritative and hot-syncs the live site list every few seconds. ClickHouse
  # / Redis come from SENTINEL_* env (overlaid on this file), so no secrets here.
  sentinel.yaml: |
    cluster:
      name: sentinel-prod
      node_id: auto
      # Control plane shares the pod → loopback (no Service round-trip).
      sync_url: "http://localhost:9501"
      sync_interval_secs: 5

    # Certificate repository on a PVC: ACME-issued + uploaded certs persist here.
    cert_dir: /var/lib/sentinel/certs

    listeners:
      - name: http
        bind: "0.0.0.0:8080"
        protocol: http1
      - name: https
        bind: "0.0.0.0:8443"
        protocol: [http1, http2]
        tls: {}
      # Management console (admin UI + API), served by Sentinel's own engine.
      - name: management
        bind: "0.0.0.0:9443"
        protocol: [http1, http2]
        tls: {}
        role: management

    sites: []

    logging:
      level: info
      format: json
      outputs:
        - type: stdout

    storage:
      cache:
        backend: memory
        size: 128MB
