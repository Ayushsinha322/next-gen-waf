# =============================================================================
# Swaraj Kavach — internal fleet inventory  (INTERNAL, not shipped to customers)
#
# The boxes WE operate. Customer installs are a different path entirely: they get
# a release bundle (deploy/package/build-bundle.sh) and run install.sh. This file
# describes the machines the engineering team updates directly.
#
# Format — four whitespace-separated fields, '#' starts a comment:
#
#     <name>  <host>  <role>  <ssh_key>
#
# ROLE decides the compose file set and the service roll order. Getting that set
# wrong is not cosmetic: on 2026-08-07 a roll with `-f compose.prod.yml` ALONE on
# a pair node dropped the active overlay, which is what publishes Postgres on the
# peer-facing address. Replication died, .89 lost its ClickHouse sink, and
# connection-layer blocking silently switched off. fleet.sh asserts the role's
# file set against what each container was actually created with, and refuses to
# roll on a mismatch. Never hand-run docker compose on these hosts.
#
# ORDER IN THIS FILE IS THE ROLL ORDER, and it is deliberate: the PASSIVE node of
# a pair is listed before the ACTIVE one. Recreating the active data plane moves
# the VIP (~3.5 s, measured), and it should move to a node that already carries
# the new build, not an old one.
#
# Roles:
#   standalone-ha   compose.prod + compose.cluster + compose.ha   (3 CP + 3 WAF behind HAProxy)
#   pair-active     compose.prod + compose.2vm-active             (VRRP master, holds the VIP)
#   pair-passive    compose.prod + compose.2vm-passive            (VRRP backup, read-only DB)
#   standalone      compose.prod                                   (single node, no overlay)
# =============================================================================

# name         host           role           ssh_key
waf-21         172.16.21.71   standalone-ha  ~/.ssh/sentinel_deploy
waf-passive    172.16.21.89   pair-passive   ~/.ssh/sentinel_deploy
waf-active     172.16.21.88   pair-active    ~/.ssh/sentinel_deploy
