# Data-plane config for CRS's own regression suite (deploy/load-test/crs-regression.py).
#
# The site is set up the way the suite requires (tests/regression/README.md of
# the CRS release): every rule at paranoia level 4, detection only — learning
# mode here — and the policy that crs-setup.conf and REQUEST-901 would provide,
# which the product does not load (the site's `crs_policy` carries it, as the
# console's does). The rule files are the request families the control plane
# loads for a site by default, plus the product's own custom rules. No control
# plane, database, ClickHouse or threat-intel feed: a scanner User-Agent reaches
# the rules instead of being answered by the feed.
#
# Run from the repository root (rule paths are relative to it), with
# SENTINEL_LOG_DIR set (waf.log) and SENTINEL_DISABLE_CORRELATION=1 (one
# client sending ~3,900 attacks would otherwise be escalated as a repeat
# offender). The origin is origin-all-methods.py on 18096.
cluster:
  name: crs-regression
  node_id: auto
listeners:
  - name: waf
    bind: "127.0.0.1:18095"
    protocol: http1
    default_site: crs
sites:
  - id: crs
    # The Host values the suite sends, other than its deliberately malformed ones.
    domains: ["localhost", "127.0.0.1", "example.com", "1.2.3.4", "deadbeef.de"]
    upstream:
      load_balancer: round_robin
      servers:
        - { host: "127.0.0.1", port: 18096, weight: 1 }
    waf:
      mode: learning
      paranoia_level: 4
      anomaly_threshold: 10
      allowed_methods: ["GET", "HEAD", "POST", "OPTIONS"]
      rules:
        - "rules/owasp-crs/rules/REQUEST-911-METHOD-ENFORCEMENT.conf"
        - "rules/owasp-crs/rules/REQUEST-913-SCANNER-DETECTION.conf"
        - "rules/owasp-crs/rules/REQUEST-920-PROTOCOL-ENFORCEMENT.conf"
        - "rules/owasp-crs/rules/REQUEST-921-PROTOCOL-ATTACK.conf"
        - "rules/owasp-crs/rules/REQUEST-922-MULTIPART-ATTACK.conf"
        - "rules/owasp-crs/rules/REQUEST-930-APPLICATION-ATTACK-LFI.conf"
        - "rules/owasp-crs/rules/REQUEST-931-APPLICATION-ATTACK-RFI.conf"
        - "rules/owasp-crs/rules/REQUEST-932-APPLICATION-ATTACK-RCE.conf"
        - "rules/owasp-crs/rules/REQUEST-933-APPLICATION-ATTACK-PHP.conf"
        - "rules/owasp-crs/rules/REQUEST-934-APPLICATION-ATTACK-GENERIC.conf"
        - "rules/owasp-crs/rules/REQUEST-941-APPLICATION-ATTACK-XSS.conf"
        - "rules/owasp-crs/rules/REQUEST-942-APPLICATION-ATTACK-SQLI.conf"
        - "rules/owasp-crs/rules/REQUEST-943-APPLICATION-ATTACK-SESSION-FIXATION.conf"
        - "rules/owasp-crs/rules/REQUEST-944-APPLICATION-ATTACK-JAVA.conf"
        - "rules/custom/placement.conf"
        - "rules/custom/coverage.conf"
      # REQUEST-901's defaults, read from the shipped file, then the suite's own
      # setup values (its README, rule 900005).
      crs_policy:
        allowed_methods: "GET HEAD POST OPTIONS"
        allowed_request_content_type: "|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/cloudevents+json| |application/cloudevents-batch+json|"
        allowed_request_content_type_charset: "|utf-8| |iso-8859-1| |iso-8859-15| |windows-1252|"
        allowed_http_versions: "HTTP/1.0 HTTP/1.1 HTTP/2 HTTP/2.0 HTTP/3 HTTP/3.0"
        restricted_extensions: ".asa/ .asax/ .ascx/ .backup/ .bak/ .bat/ .cdx/ .cer/ .cfg/ .cmd/ .com/ .config/ .conf/ .cs/ .csproj/ .csr/ .dat/ .db/ .dbf/ .dll/ .dos/ .htr/ .htw/ .ida/ .idc/ .idq/ .inc/ .ini/ .key/ .licx/ .lnk/ .log/ .mdb/ .old/ .pass/ .pdb/ .pem/ .pol/ .printer/ .pwd/ .rdb/ .resources/ .resx/ .sql/ .swp/ .sys/ .vb/ .vbs/ .vbproj/ .vsdisco/ .webinfo/ .xsd/ .xsx/"
        restricted_headers_basic: "/content-encoding/ /proxy/ /lock-token/ /content-range/ /if/ /x-http-method-override/ /x-http-method/ /x-method-override/"
        restricted_headers_extended: "/accept-charset/"
        crs_validate_utf8_encoding: "1"
        arg_name_length: "100"
        arg_length: "400"
        max_file_size: "64100"
        combined_file_sizes: "65535"
      ml:
        enable: false
        models: []
        sensitivity: 0.9
      bot_detection:
        ja4: false
        challenge: "off"
logging:
  level: info
  format: json
  outputs:
    - type: stdout
storage:
  cache: { backend: memory, size: 64MB }
