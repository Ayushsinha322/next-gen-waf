# Sentinel WAF — DETECTION-benchmark config (fair-origin harness).
# Same ruleset as waf-loadtest.yaml, but tuned per the 2026-07 detection work:
#   * anomaly_threshold 10 (was 5): require 2 correlated signals (cuts benign FP)
#   * rule 920230 disabled: "multiple URL encoding" is a weak +3 heuristic that
#     dominated benign false-positives; disabling it recovers benign traffic.
# Run with deploy/load-test/benchmark-detection.sh (uses origin-all-methods.py so
# GoTestWAF measures the WAF, not a static backend's 405s).
#
# Since 2026-10-12 this is the posture a NEW site gets, so benchmarks measure what
# ships: paranoia level 1 and the control plane's full defaultRuleExclusions (the
# four real-traffic additions: 932270 off, 930120 not on ARGS_NAMES, 942100 and
# 9900100 not on the IAB consent strings). Measured on open-appsec's real-traffic
# dataset (50k/20k sample): 92.5% of attacks caught, 6.2% of legitimate requests
# blocked; GoTestWAF 99.89%. GoTestWAF numbers before this date are at PL2.
# Sentinel WAF — load-test configuration
#
# Purpose: a controlled, reproducible target for measuring the REAL end-to-end
# throughput/latency the WAF data plane adds, in front of a fast static origin.
#
#   load generator ──▶ WAF :18091 ──▶ origin :18090 (nginx static)
#
# Deliberately isolated from a live deployment:
#   * one listener, one site (default_site so the Host header is irrelevant)
#   * full OWASP CRS 4.7 attack ruleset (13 files), blocking mode, PL2
#   * ML OFF and NO rate-limit — so we measure the rule engine + proxy path,
#     not a rate limiter throttling the generator (single source IP)
#   * logging at warn/stdout only, no control-plane sync, no ClickHouse
#
# Rule paths are relative to the Sentinel repo root (where rules/ lives); run
# the WAF with CWD = repo root, or use run-loadtest.sh which handles this.

cluster:
  name: sentinel-loadtest
  node_id: auto

listeners:
  - name: waf
    bind: "0.0.0.0:18091"
    protocol: http1
    default_site: loadtest

sites:
  - id: loadtest
    domains: ["loadtest.local", "localhost", "127.0.0.1"]
    upstream:
      load_balancer: round_robin
      servers:
        - { host: "127.0.0.1", port: 18090, weight: 1 }
    waf:
      mode: blocking
      paranoia_level: 1
      anomaly_threshold: 10
      rules:
        - "rules/owasp-crs/rules/REQUEST-911-METHOD-ENFORCEMENT.conf"
        - "rules/owasp-crs/rules/REQUEST-913-SCANNER-DETECTION.conf"
        - "rules/owasp-crs/rules/REQUEST-920-PROTOCOL-ENFORCEMENT.conf"
        - "rules/owasp-crs/rules/REQUEST-921-PROTOCOL-ATTACK.conf"
        - "rules/owasp-crs/rules/REQUEST-930-APPLICATION-ATTACK-LFI.conf"
        - "rules/owasp-crs/rules/REQUEST-931-APPLICATION-ATTACK-RFI.conf"
        - "rules/owasp-crs/rules/REQUEST-932-APPLICATION-ATTACK-RCE.conf"
        - "rules/owasp-crs/rules/REQUEST-933-APPLICATION-ATTACK-PHP.conf"
        - "rules/owasp-crs/rules/REQUEST-934-APPLICATION-ATTACK-GENERIC.conf"
        - "rules/owasp-crs/rules/REQUEST-941-APPLICATION-ATTACK-XSS.conf"
        - "rules/owasp-crs/rules/REQUEST-942-APPLICATION-ATTACK-SQLI.conf"
        - "rules/owasp-crs/rules/REQUEST-943-APPLICATION-ATTACK-SESSION-FIXATION.conf"
        - "rules/owasp-crs/rules/REQUEST-944-APPLICATION-ATTACK-JAVA.conf"
        - "rules/custom/placement.conf"
        - "rules/custom/coverage.conf"
      rule_exclusions:
        - rule_id: 932236
          exclude_targets: ["ARGS_NAMES"]
        - rule_id: 920230
          disable: true
        - rule_id: 922110
          disable: true
        - rule_id: 932270
          disable: true
        - rule_id: 930120
          exclude_targets: ["ARGS_NAMES"]
        - rule_id: 942100
          exclude_targets: ["ARGS:us_privacy", "ARGS:sst.us_privacy", "ARGS:gdpr_consent", "ARGS:gpp"]
        - rule_id: 9900100
          exclude_targets: ["ARGS:us_privacy", "ARGS:sst.us_privacy", "ARGS:gdpr_consent", "ARGS:gpp"]
      ml:
        enable: true
        models: []
        # Block threshold for the embedded char-n-gram classifier: a confident
        # detection (>= 0.9) contributes a blocking anomaly score on its own.
        sensitivity: 0.9
      bot_detection:
        ja4: false
        challenge: "off"

logging:
  level: warn
  format: json
  outputs:
    - type: stdout

storage:
  cache: { backend: memory, size: 64MB }
