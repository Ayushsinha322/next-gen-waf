# Kernel network hardening for a Sentinel WAF / load-balancer host.
#
#   sudo cp 99-sentinel-ddos.conf /etc/sysctl.d/ && sudo sysctl --system
#
# WHY THIS FILE EXISTS: none of these were set. On defaults, a WAF host falls over to a
# SYN flood or a connection flood well before the WAF itself is the bottleneck — the
# kernel drops or queues packets the application never gets to inspect, so all the
# detection quality above it is irrelevant. These are the settings that decide whether
# a flood is absorbed or the box stops answering.
#
# Every value below is a deliberate trade, noted inline. Do not bulk-copy this to
# application servers: several settings suit a front-facing proxy with many short-lived
# connections and are wrong for a database host.

# ── SYN flood ────────────────────────────────────────────────────────────────
# SYN cookies let the kernel answer a handshake without allocating state, so a spoofed
# SYN flood cannot exhaust the accept queue. The cost (lost TCP options on cookie-
# validated connections) only applies while actually under attack.
net.ipv4.tcp_syncookies = 1
# A deeper SYN backlog absorbs bursts before cookies are needed.
net.ipv4.tcp_max_syn_backlog = 8192
# Retry SYN-ACK twice instead of five times: a spoofed SYN never completes, so the
# default holds half-open state for ~180s per entry. Two retries drains the queue in
# ~7s. Legitimate clients on lossy links still connect.
net.ipv4.tcp_synack_retries = 2

# ── Accept queue / backlog ───────────────────────────────────────────────────
# HAProxy sets maxconn 8192; somaxconn must be at least that or the listen backlog is
# silently truncated to the kernel default and connections are dropped at the door.
net.core.somaxconn = 8192
# Per-NIC packet backlog before the softirq handler. Raised for 10G-class bursts.
net.core.netdev_max_backlog = 16384
# Leave at 0: with tcp_abort_on_overflow=1 an overflowing queue sends RST, turning a
# transient burst into visible client errors. Dropping lets the client retransmit.
net.ipv4.tcp_abort_on_overflow = 0

# ── Connection churn (a proxy makes a lot of it) ─────────────────────────────
# Reclaim FIN-WAIT2 faster so a flood of half-closed connections cannot pin memory.
net.ipv4.tcp_fin_timeout = 15
# Reuse TIME-WAIT sockets for new OUTBOUND connections. Safe here (timestamps on) and
# necessary because the proxy opens an upstream connection per client burst.
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_timestamps = 1
# Widen the ephemeral range: the proxy is the client toward upstreams and can exhaust
# ports long before CPU.
net.ipv4.ip_local_port_range = 10240 65535

# ── Conntrack ────────────────────────────────────────────────────────────────
# If conntrack is loaded (it is, whenever Docker is installed), its table is a much
# smaller limit than anything above — and when it fills, the kernel drops NEW
# connections and logs "nf_conntrack: table full". A flood hits this ceiling first.
#
# See also the NOTRACK rule in harden-network.sh, which keeps the public WAF ports out
# of conntrack entirely. Raising the table is the fallback; not tracking is the fix.
net.netfilter.nf_conntrack_max = 1048576
# Default 5 DAYS for established flows is absurd for a web proxy and is what actually
# fills the table.
net.netfilter.nf_conntrack_tcp_timeout_established = 3600
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 15
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 30

# ── Spoofing / redirects ─────────────────────────────────────────────────────
# Reverse-path filtering drops packets arriving on an interface that could not have
# routed them — cheap anti-spoofing. Use 1 (strict), not 2, on a single-homed host; set
# 2 instead if this box is multi-homed with asymmetric routes, or you will drop real
# traffic.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# ICMP redirects can be used to reroute traffic. Neither accept nor send them.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
# Source-routed packets have no legitimate use here.
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
# Do not participate in smurf amplification.
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
# Log martians so spoofing shows up in dmesg rather than being invisible.
net.ipv4.conf.all.log_martians = 1
