# Sentinel WAF — GitLab CI
# Mirrors .github/workflows/ci.yml so the pipeline runs on git.enlight.dev.

# The three Rust jobs are in SEPARATE STAGES so only one runs at a time.
#
# They must not run concurrently, and the reason is disk, not dependency. The
# runner's Kubernetes node evicts pods at ~29 GB of ephemeral storage, and one
# Rust job's target/ directory measures 13 GB (reported by `du -sh target` in
# rust-lint). Two in parallel is ~26 GB plus caches and helper containers, which
# crosses the threshold — so running them in parallel made the disk problem WORSE
# than the single job it replaced, even though each individual job got smaller.
#
# Splitting solved duration. Serialising solves peak disk. Both were needed, and
# doing only the first traded one failure for another.
#
# The light jobs (go, dashboard, deploy-shell, secret_detection) stay alongside
# rust-lint in `test`: they are node/go builds of a few hundred MB and do not
# meaningfully contribute to the ceiling.
stages:
  - test        # light jobs + rust-lint
  - rust-test   # rust-test alone — one 13 GB target at a time
  - build       # rust-build alone
  - security

# ── Rust data plane ──────────────────────────────────────────────────────────
# Shared Rust CI settings.
#
# THE DEBUG-INFO SETTINGS ARE LOAD-BEARING, NOT TIDINESS. Every Rust job on this
# project was failing, and the runner logs gave the reason:
#
#   The node was low on resource: ephemeral-storage.
#   Container build was using 27060609 [KiB, ~27 GB]
#
# The workspace sets `[profile.dev] debug = true`, and `cargo test` and
# `cargo clippy --all-targets` both build with that profile. Locally that produces
# a 113 GB target/ directory, 108 GB of it under target/debug. On the Kubernetes
# runner it filled the node's ephemeral storage, which then presented as three
# different-looking failures — evicted pods (runner_system_failure), jobs stalling
# into job_execution_timeout, and `etcdserver: request timed out` from a cluster
# under disk pressure. One cause, three symptoms, none of them obviously "disk".
#
# Measured on this workspace, building sentinel-rules alone:
#     with debug info     482 MB
#     without debug info  187 MB     (-61%)
#
# Set via environment rather than by editing [profile.dev], deliberately: a
# developer running cargo locally still gets debug symbols and a usable debugger.
# Only CI, which never opens a debugger, builds without them.
.rust-base: &rust-base
  image: rust:1.85
  tags:
    - k8s-docker
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    # No debug info in CI — see above.
    CARGO_PROFILE_DEV_DEBUG: "0"
    CARGO_PROFILE_TEST_DEBUG: "0"
    # Incremental artifacts are large and worthless in CI: every job starts from
    # a restored cache and never rebuilds the same crate twice in one run.
    CARGO_INCREMENTAL: "0"
  # CACHE ONLY .cargo/, NOT target/.
  #
  # The key is bumped to v2, which is how you clear a GitLab runner cache from the
  # repository — a new key means the old archive is simply never restored. (The
  # "Clear runner caches" button in the UI does the same thing by incrementing an
  # internal cache index; there is no API v4 endpoint for it.)
  #
  # Dropping target/ is the substantive change. It was 13 GB, and that is the
  # archive behind both of today's scheduling failures:
  #
  #   * restoring it consumed the node's ephemeral storage before a compiler ran
  #   * the PersistentVolume holding it is pinned to one node, producing
  #     "1 node(s) had volume node affinity conflict" — no pod could schedule at
  #     all, which is why even secret_detection failed
  #
  # .cargo/ stays: 347 MB, and it saves re-downloading every crate from the
  # registry, which is the part of a cold build that depends on the network rather
  # than the CPU.
  #
  # The cost is honest: every Rust job now compiles from scratch. rust-lint took
  # 3305s that way and finished well inside its 2h timeout. A cache that cannot be
  # restored without evicting the pod is not saving time anyway — it was costing
  # the entire pipeline.
  cache:
    key: "rust-v2-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/

# Three Rust jobs, each ONE workspace compilation, run one at a time (see the
# stages block at the top of this file for why they must not overlap).
#
# History, because the failure modes looked alike and were not:
#   1. One `rust` job did fmt + clippy + test + release — four passes. It hit the
#      runner's 3600s cap.
#   2. Split in two; `rust-check` still did clippy AND test and timed out again at
#      3602s, mid-test-run.
#   3. Split in three, running in parallel. Duration was fixed — rust-lint finished
#      in 3305s and reported `13G target` — but two concurrent 13 GB jobs exceeded
#      the node's ~29 GB disk ceiling and rust-test was evicted.
#   4. Serialised into separate stages. Peak disk is now one job: ~13 GB.
#
# The 2h timeout is margin for a cold cache, so a first build on a new branch does
# not fail merely for being honestly slow.
rust-lint:
  <<: *rust-base
  stage: test
  timeout: 2h
  before_script:
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets -- -D warnings
    # Surface the footprint so the next disk problem is diagnosable from the log
    # rather than from a Kubernetes eviction event.
    - du -sh target .cargo 2>/dev/null || true

rust-test:
  <<: *rust-base
  stage: rust-test
  timeout: 2h
  script:
    - cargo test --workspace
    - du -sh target 2>/dev/null || true

rust-build:
  <<: *rust-base
  stage: build
  timeout: 2h
  script:
    - cargo build --workspace --release
    - du -sh target 2>/dev/null || true

# ── Go control plane ─────────────────────────────────────────────────────────
go:
  stage: test
  image: golang:1.22
  tags:
    - k8s-docker
  cache:
    key: "go-$CI_COMMIT_REF_SLUG"
    paths:
      - .go/pkg/mod/
  variables:
    GOPATH: "$CI_PROJECT_DIR/.go"
  # No protobuf codegen step: the gRPC listener, api/proto/config.proto and the
  # generated pkg/proto/ tree were all removed in 71706a7 (the listener was dead
  # code and served plaintext). Running protoc here failed the job outright with
  # "Could not make proto path relative: api/proto/config.proto: No such file".
  before_script:
    - cd control-plane
  script:
    - go vet ./...
    - go test ./...
    - go build ./...

# ── Dashboard ────────────────────────────────────────────────────────────────
# GATING: type-check + unit tests + production build must all pass. (Was
# allow_failure with `|| true` on every step — i.e. it could never fail.)
dashboard:
  stage: test
  image: node:20
  tags:
    - k8s-docker
  cache:
    key: "node-$CI_COMMIT_REF_SLUG"
    paths:
      - dashboard/node_modules/
  before_script:
    - cd dashboard
    - npm ci
  script:
    - npm run typecheck        # tsc --noEmit — must be clean (0 errors)
    - npm run test             # vitest unit tests
    - npm run lint || true     # advisory only (style); does not gate
    - npm run build            # production build must succeed

# ── Deploy / operational shell ───────────────────────────────────────────────
# GATING. Until now the entire operational surface — installer, upgrade, rollback,
# backup, restore, drill, the 2VM HA installer, ~5,200 lines of shell that runs as
# root on customer machines — was never linted, never syntax-checked and never
# executed by any pipeline. An audit on 2026-08-08 found 54 defects in it, 9 fatal,
# with CI green throughout. CI was green because it was not looking.
#
# Two things run here, in increasing order of value:
#   1. syntax + shellcheck — catches the mechanical class (unquoted expansions,
#      subshell variable loss, the `cmd | tail` exit-code trap).
#   2. the BUNDLE CONTRACT check — stages the real customer tree with no Docker
#      and asserts every path the shipped scripts and compose overlays reference
#      actually exists. Every fatal packaging bug from that audit was visible in
#      the staged tree alone; this job would have caught all of them.
deploy-shell:
  stage: test
  image: alpine:3.20
  tags:
    - k8s-docker
  before_script:
    # docker-cli-compose is here for check-compose-parses-clean.sh. `docker
    # compose config` only parses and interpolates — it never contacts a daemon —
    # so this needs no docker-in-docker and no privileged runner.
    - apk add --no-cache bash shellcheck git coreutils findutils grep sed docker-cli-compose
  script:
    # 1. Every shell file must parse. Cheap, absolute, no exceptions.
    - |
      bash -c '
      set -e
      fail=0
      while read -r f; do
        bash -n "$f" || { echo "SYNTAX ERROR: $f"; fail=1; }
      done < <(find deploy -name "*.sh" -type f)
      [ $fail -eq 0 ] || exit 1
      echo "all deploy shell parses"'
    # 2. shellcheck. GATES on errors; warnings are reported but advisory, because
    #    this is a large pre-existing body of shell and a wall of style warnings
    #    on day one would just get the job disabled. Tighten to -S warning once
    #    the backlog is worked down.
    - shellcheck -S error $(find deploy -name '*.sh' -type f) || exit 1
    - shellcheck -S warning $(find deploy -name '*.sh' -type f) || true
    # 3. Every compose file must parse with the environment its own installer
    #    generates. This is not style — it caught a release blocker: a practice
    #    Ghost origin sat in compose.prod.yml behind `profiles: [ghost]`, and
    #    because compose interpolates a file BEFORE filtering by profile, its
    #    `${GHOST_DB_PASSWORD:?...}` guard failed every customer `docker compose
    #    up`. install.sh generates seven secrets, none of them GHOST_*, so a
    #    fresh install aborted at its last step — after images were loaded and
    #    /opt/sentinel written — with an error about a blog's database.
    #    Nothing caught it because CI never invoked compose at all.
    - ./deploy/ci/check-compose-parses-clean.sh
    # 4. The contract check — the one that catches shipping-breaking bugs.
    - STAGE_ONLY=1 ./deploy/package/build-bundle.sh
    - ./deploy/ci/check-bundle-contract.sh

# ── Secret scanning ──────────────────────────────────────────────────────────
# GitLab ships native secret detection; enable it instead of the gitleaks action.
include:
  - template: Security/Secret-Detection.gitlab-ci.yml

secret_detection:
  tags:
    - k8s-docker
