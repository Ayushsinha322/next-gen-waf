# Sentinel WAF — GitLab CI
# Mirrors .github/workflows/ci.yml so the pipeline runs on git.enlight.dev.

stages:
  - test
  - build
  - security

# ── Rust data plane ──────────────────────────────────────────────────────────
rust:
  stage: test
  image: rust:1.82
  tags:
    - k8s-docker
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  cache:
    key: "rust-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/
      - target/
  before_script:
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo test --workspace
    - cargo build --workspace --release

# ── Go control plane ─────────────────────────────────────────────────────────
go:
  stage: test
  image: golang:1.22
  tags:
    - k8s-docker
  cache:
    key: "go-$CI_COMMIT_REF_SLUG"
    paths:
      - .go/pkg/mod/
  variables:
    GOPATH: "$CI_PROJECT_DIR/.go"
  before_script:
    # protoc compiler + the two Go plugins (messages + gRPC service stubs)
    - apt-get update && apt-get install -y protobuf-compiler
    - go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
    - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
    - export PATH="$PATH:$(go env GOPATH)/bin"
    # generate config.pb.go + config_grpc.pb.go into pkg/proto/sentinelv1
    - cd control-plane
    - protoc --go_out=. --go_opt=module=github.com/your-org/sentinel-waf/control-plane
             --go-grpc_out=. --go-grpc_opt=module=github.com/your-org/sentinel-waf/control-plane
             api/proto/config.proto
  script:
    - go vet ./...
    - go test ./...
    - go build ./...

# ── Dashboard ────────────────────────────────────────────────────────────────
dashboard:
  stage: build
  image: node:20
  tags:
    - k8s-docker
  cache:
    key: "node-$CI_COMMIT_REF_SLUG"
    paths:
      - dashboard/node_modules/
  script:
    - cd dashboard
    - npm ci || true
    - npm run lint || true
    - npm run build || true
  allow_failure: true

# ── Secret scanning ──────────────────────────────────────────────────────────
# GitLab ships native secret detection; enable it instead of the gitleaks action.
include:
  - template: Security/Secret-Detection.gitlab-ci.yml

secret_detection:
  tags:
    - k8s-docker
