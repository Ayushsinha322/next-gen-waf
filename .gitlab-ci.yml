# Sentinel WAF — GitLab CI
# Mirrors .github/workflows/ci.yml so the pipeline runs on git.enlight.dev.

stages:
  - test
  - build
  - security

# ── Rust data plane ──────────────────────────────────────────────────────────
rust:
  stage: test
  image: rust:1.85
  tags:
    - k8s-docker
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  cache:
    key: "rust-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/
      - target/
  before_script:
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo test --workspace
    - cargo build --workspace --release

# ── Go control plane ─────────────────────────────────────────────────────────
go:
  stage: test
  image: golang:1.22
  tags:
    - k8s-docker
  cache:
    key: "go-$CI_COMMIT_REF_SLUG"
    paths:
      - .go/pkg/mod/
  variables:
    GOPATH: "$CI_PROJECT_DIR/.go"
  before_script:
    - apt-get update && apt-get install -y protobuf-compiler
    - go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.2
    - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.4.0
    - export PATH="$PATH:$(go env GOPATH)/bin"
    - cd control-plane
    - protoc --go_out=. --go_opt=module=github.com/your-org/sentinel-waf/control-plane
             --go-grpc_out=. --go-grpc_opt=module=github.com/your-org/sentinel-waf/control-plane
             api/proto/config.proto
  script:
    - go vet ./...
    - go test ./...
    - go build ./...

# ── Dashboard ────────────────────────────────────────────────────────────────
# GATING: type-check + unit tests + production build must all pass. (Was
# allow_failure with `|| true` on every step — i.e. it could never fail.)
dashboard:
  stage: test
  image: node:20
  tags:
    - k8s-docker
  cache:
    key: "node-$CI_COMMIT_REF_SLUG"
    paths:
      - dashboard/node_modules/
  before_script:
    - cd dashboard
    - npm ci
  script:
    - npm run typecheck        # tsc --noEmit — must be clean (0 errors)
    - npm run test             # vitest unit tests
    - npm run lint || true     # advisory only (style); does not gate
    - npm run build            # production build must succeed

# ── Secret scanning ──────────────────────────────────────────────────────────
# GitLab ships native secret detection; enable it instead of the gitleaks action.
include:
  - template: Security/Secret-Detection.gitlab-ci.yml

secret_detection:
  tags:
    - k8s-docker
