# Sentinel WAF — GitLab CI
# Mirrors .github/workflows/ci.yml so the pipeline runs on git.enlight.dev.

stages:
  - test
  - build
  - security

# ── Rust data plane ──────────────────────────────────────────────────────────
rust:
  stage: test
  image: rust:1.82
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  cache:
    key: "rust-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/
      - target/
  before_script:
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo test --workspace
    - cargo build --workspace --release

# ── Go control plane ─────────────────────────────────────────────────────────
go:
  stage: test
  image: golang:1.22
  cache:
    key: "go-$CI_COMMIT_REF_SLUG"
    paths:
      - .go/pkg/mod/
  variables:
    GOPATH: "$CI_PROJECT_DIR/.go"
  script:
    - cd control-plane
    - go vet ./...
    - go test ./...
    - go build ./...

# ── Dashboard ────────────────────────────────────────────────────────────────
dashboard:
  stage: build
  image: node:20
  cache:
    key: "node-$CI_COMMIT_REF_SLUG"
    paths:
      - dashboard/node_modules/
  script:
    - cd dashboard
    - npm ci || true
    - npm run lint || true
    - npm run build || true
  allow_failure: true

# ── Secret scanning ──────────────────────────────────────────────────────────
# GitLab ships native secret detection; enable it instead of the gitleaks action.
include:
  - template: Security/Secret-Detection.gitlab-ci.yml
