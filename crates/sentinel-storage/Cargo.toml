[package]
name = "sentinel-storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sentinel-core = { path = "../sentinel-core" }

tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

redis = { workspace = true }
# Pin url to 2.4.x to prevent url 2.5.x from pulling icu_* crates that
# require Rust 1.86. Redis only needs url ^2.1 so 2.4.1 satisfies it.
url = ">=2.4.0, <2.5.0"

# ClickHouse HTTP client — use hyper (already in workspace) to avoid reqwest
# pulling icu_* crates that require Rust ≥ 1.86.
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
