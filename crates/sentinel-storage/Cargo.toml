[package]
name = "sentinel-storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sentinel-core = { path = "../sentinel-core" }

tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

redis = { workspace = true }
# Pin url to 2.4.x to prevent url 2.5.x from pulling icu_* crates that
# require Rust 1.86. Redis only needs url ^2.1 so 2.4.1 satisfies it.
url = ">=2.4.0, <2.5.0"

# ClickHouse HTTP client — use hyper (already in workspace) to avoid reqwest
# pulling icu_* crates that require Rust ≥ 1.86.
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }

# TLS for the ClickHouse connection. Same feature set as sentinel-proxy /
# sentinel-ml / sentinel-plugins already use, deliberately: `ring` must match the
# process-default rustls CryptoProvider installed in sentinel-bin, or building a
# ClientConfig panics at runtime. default-features = false keeps aws-lc-rs and
# the ring/aws-lc double-backend problem out of the tree.
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-roots"] }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-pki-types = "1"
# Declared directly (it is already in the tree via hyper-rustls) so the public-root
# path can be built with the SAME explicit ring provider as the private-CA path.
# hyper-rustls's own `with_webpki_roots()` calls `ClientConfig::builder()`, which
# panics when no process-default CryptoProvider has been installed — true in unit
# tests and any binary that is not sentinel-bin.
webpki-roots = "1"

[dev-dependencies]
tokio-test = { workspace = true }
