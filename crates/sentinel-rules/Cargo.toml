[package]
name = "sentinel-rules"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `test_hooks`: lets another crate's tests run an inspection time budget out
# without a slow request. Enabled only from dev-dependencies, so a release
# build never has it.
test-hooks = []

[dependencies]
sentinel-core = { path = "../sentinel-core" }
# Counts requests refused for an inspection limit, by reason.
sentinel-telemetry = { path = "../sentinel-telemetry" }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
nom = { workspace = true }
regex = { workspace = true }
aho-corasick = { workspace = true }
bytes = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
percent-encoding = { workspace = true }
ipnet = { workspace = true }
libinjectionrs = "0.1"
# Already in the tree through regex/aho-corasick; used for the multipart
# boundary search.
memchr = "2"

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
sentinel-modules = { path = "../sentinel-modules" }

[[bench]]
name = "vm_bench"
harness = false
