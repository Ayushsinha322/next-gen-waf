[package]
name = "sentinel-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Enable real kernel XDP (aya-based) in sentinel-ebpf. Off by default; the
# data plane falls back to the userspace software fast-fail without it.
kernel = ["sentinel-ebpf/kernel"]

[dependencies]
# Used only for errno constants when classifying accept(2) failures, so the
# listener can tell "this one connection died" from "we are out of file
# descriptors" from "the listening socket is broken". See classify_accept_error.
libc = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
# `FutureExt::catch_unwind`: a panic in one request or background loop is
# contained to it instead of ending the process. See src/panic_guard.rs.
futures = { workspace = true }
# Support ID for a request that panicked before it had a context.
uuid = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
# Public trust anchors for the SIEM feed when no private CA is configured.
webpki-roots = "1"
# HTTP/3 (QUIC transport + h3 protocol layer)
quinn = { workspace = true }
h3 = { workspace = true }
h3-quinn = { workspace = true }
# Named directly, NOT reached through `quinn::proto`: quinn renames its own
# dependency (`[dependencies.proto] package = "quinn-proto"`), so that path does
# not exist. Needed only to name `TransportParameters` in the `crypto::Session`
# decorator's `start_session` signature — see src/ja4_quic.rs.
#
# Pinned to the exact version already in Cargo.lock: resolving a second
# quinn-proto would make `impl quinn::crypto::ServerConfig` reference a
# DIFFERENT trait, and the error message for that is deeply unhelpful.
# `default-features = false` is load-bearing — quinn-proto's defaults include
# `bloom = ["dep:fastbloom"]`, and fastbloom is absent from our lock.
quinn-proto = { version = "0.11.15", default-features = false, features = ["rustls-ring"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-roots"] }
arc-swap = { workspace = true }
dashmap = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
chrono    = { version = "0.4", default-features = false, features = ["clock", "std"] }
rcgen = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
ring = { workspace = true }
jsonwebtoken = { workspace = true }
sentinel-core = { path = "../sentinel-core" }
sentinel-rules = { path = "../sentinel-rules" }
sentinel-modules = { path = "../sentinel-modules" }
sentinel-storage = { path = "../sentinel-storage" }
sentinel-plugins = { path = "../sentinel-plugins" }
sentinel-ml = { path = "../sentinel-ml" }
sentinel-telemetry = { path = "../sentinel-telemetry" }
sentinel-ebpf = { path = "../sentinel-ebpf" }

[dev-dependencies]
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full"] }
hyper = { workspace = true, features = ["client", "http1", "server"] }
hyper-util = { workspace = true, features = ["client-legacy", "server-auto", "tokio"] }
http = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
arc-swap = { workspace = true }
rustls = { workspace = true }
# Local stub servers (a ClickHouse that records what it committed) for the
# history writer's spool-replay tests.
sentinel-storage = { path = "../sentinel-storage", features = ["test-support"] }
