[package]
name = "sentinel-ml"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sentinel-core = { path = "../sentinel-core" }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
arc-swap = { workspace = true }
once_cell = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-roots"] }
http-body-util = { workspace = true }
rustls = { workspace = true }
percent-encoding = { workspace = true }

# Optional: ONNX Runtime inference (enable with --features ort-inference)
# Requires ONNX Runtime shared library or build-time download.
[features]
default = []
ort-inference = []
