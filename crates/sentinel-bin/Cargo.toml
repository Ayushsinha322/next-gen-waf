[package]
name = "sentinel-bin"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sentinel-bin"
path = "src/main.rs"

[features]
# Propagates kernel XDP support down to sentinel-ebpf (built with
# `cargo build --features kernel`). Requires CAP_BPF/CAP_NET_ADMIN at runtime.
kernel = ["sentinel-proxy/kernel"]

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
rustls = { workspace = true }
sentinel-core = { path = "../sentinel-core" }
sentinel-proxy = { path = "../sentinel-proxy" }
