# cargo-audit exceptions. Each one is an advisory our code cannot reach, with the
# reason. Anything not listed here fails CI.
#
# 2026-10-23: the Rust 1.88 toolchain move retired every entry that waited on it —
# wasmtime 24 -> 36.0.19 (RUSTSEC-2026-0316, -0086, -0088, -0089, -0094, -0095,
# -0096, -0363, -0379 and -0380, the Cranelift sandbox escape that was reachable
# through an uploaded plugin), time 0.3.36 -> 0.3.55 (RUSTSEC-2026-0009) and
# url 2.5.2 -> 2.5.8 with idna 1.x (RUSTSEC-2024-0421).
[advisories]
ignore = [
  # maxminddb: `Reader::open_mmap` is unsound. We open the database with
  # `open_readfile` (sentinel-modules/src/geoip). 0.27 is an API break.
  "RUSTSEC-2025-0132",
  # wasmtime, both published 2026-11-16 with fixes only in 48.0.9+, none in the
  # 36 LTS line we are on (36.0.21 fixes the other three of that batch).
  # GHSA-wvgq-g5hf-6gm6: an abort needs a NON-moving GC heap or memory
  # (`gc_heap_may_move(false)` / `memory_may_move(false)`) AND a reservation
  # that is not a page multiple. The plugin engine is `Config::default()` plus
  # fuel and epoch interruption (sentinel-plugins/src/runtime.rs); the advisory
  # itself says the default configuration is not affected.
  "RUSTSEC-2026-0573",
  # GHSA-2674-w29h-wqvj: affects builds WITHOUT the `threads` cargo feature
  # (39.0.0 onwards). Cargo.toml enables `threads`.
  "RUSTSEC-2026-0567",
]
