# Sentinel WAF — dev configuration
#
# Three listeners:
#   :9080  — shared WAF proxy (routes by Host header, for curl/CLI testing)
#   :9095  — transparent DVWA port  (WAF takes over DVWA's port, default_site: dvwa)
#   :3000  — transparent Juice Shop port (WAF takes over Juice's port, default_site: juiceshop)
#
# Upstreams must be on different ports since WAF owns the originals:
#   DVWA        → docker run -p 9096:80   (was 9095)
#   Juice Shop  → docker run -p 3001:3000 (was 3000)
#
# /etc/hosts entries for browser testing via Host-header listener:
#   127.0.0.1  dvwa.local
#   127.0.0.1  juice.local

cluster:
  name: sentinel-dev
  node_id: auto

listeners:
  - name: http
    bind: "0.0.0.0:9080"
    protocol: http1

  - name: dvwa-port
    bind: "0.0.0.0:9095"
    protocol: http1
    default_site: dvwa

  - name: juice-port
    bind: "0.0.0.0:3000"
    protocol: http1
    default_site: juiceshop

sites:
  - id: dvwa
    domains: ["dvwa.local", "dvwa"]
    upstream:
      load_balancer: round_robin
      servers:
        - { host: "127.0.0.1", port: 9096, weight: 1 }
      health_check:
        path: /
        interval: 10s
        timeout: 3s
    waf:
      mode: blocking
      paranoia_level: 2
      anomaly_threshold: 5
      rules: []
      ml:
        enable: false
        models: []
        sensitivity: 0.85
      rate_limit:
        global:  { rps: 5000,  burst: 10000 }
        per_ip:  { rps: 200,   burst: 500 }
      bot_detection:
        ja4: false
        challenge: "off"

  - id: juiceshop
    domains: ["juice.local", "juice"]
    upstream:
      load_balancer: round_robin
      servers:
        - { host: "127.0.0.1", port: 3001, weight: 1 }
      health_check:
        path: /
        interval: 10s
        timeout: 3s
    waf:
      mode: blocking
      paranoia_level: 2
      anomaly_threshold: 5
      rules: []
      ml:
        enable: false
        models: []
        sensitivity: 0.85
      rate_limit:
        global:  { rps: 5000,  burst: 10000 }
        per_ip:  { rps: 200,   burst: 500 }
      bot_detection:
        ja4: false
        challenge: "off"

logging:
  level: info
  format: json
  outputs:
    - type: stdout

storage:
  cache: { backend: memory, size: 64MB }
