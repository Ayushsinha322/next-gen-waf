# Sentinel WAF — Default configuration
# Hot-reloaded on SIGHUP or via control-plane gRPC push.

cluster:
  name: sentinel-prod
  node_id: auto                    # auto = derive from hostname+mac
  # REST poll of the control plane: the data plane GETs
  # {sync_url}/api/v1/internal/config AND /api/v1/internal/threat-intel every
  # sync_interval_secs. REQUIRED for live site hot-sync and for the dynamic
  # threat-intelligence feed to reach the data plane — omit it and neither
  # poller starts. Point at your control plane's REST address.
  sync_url: "http://localhost:9501"
  sync_interval_secs: 5
  control_plane:
    endpoints: ["https://cp-1.internal:7443", "https://cp-2.internal:7443"]
    tls:
      ca: /etc/sentinel/pki/ca.crt
      cert: /etc/sentinel/pki/node.crt
      key: /etc/sentinel/pki/node.key

listeners:
  - name: http
    bind: "0.0.0.0:80"
    protocol: http1
  - name: https
    bind: "0.0.0.0:443"
    protocol: [http1, http2]
    tls:
      cert: /etc/sentinel/pki/server.crt
      key: /etc/sentinel/pki/server.key
      min_version: tls1.2
      post_quantum: hybrid          # disabled | hybrid | required
  - name: h3
    bind: "0.0.0.0:443"
    protocol: http3                 # QUIC

sites:
  - id: example
    domains: ["example.com", "*.example.com"]
    upstream:
      load_balancer: round_robin    # round_robin | least_conn | ip_hash | adaptive
      servers:
        - { host: "10.0.0.10", port: 8080, weight: 1 }
        - { host: "10.0.0.11", port: 8080, weight: 1 }
      health_check:
        path: /healthz
        interval: 5s
        timeout: 2s
      # How long the origin may take to return response HEADERS. Omit for the
      # node default (SENTINEL_UPSTREAM_TIMEOUT_SECS). Capped at 600s by the API.
      timeout_secs: 60
      # TCP + TLS setup only — fails fast on an unreachable origin without
      # shortening the budget of one that is merely slow. Omit for the node
      # default (10s, SENTINEL_UPSTREAM_CONNECT_TIMEOUT_SECS); clamped to 1..60.
      # A node honours at most 8 DISTINCT values, since each needs its own
      # connection pool; a site past the cap falls back to the node default and
      # logs that it did.
      connect_timeout_secs: 5
      # WebSocket upgrades, off unless asked for. With this false the proxy strips
      # Upgrade/Connection/Sec-WebSocket-* before the request leaves it, so the
      # origin never switches protocols. Silence means false: this gate replaced
      # an ungated relay, so inheriting "allowed" would keep that fail-open alive.
      websocket: false
      # Pool and reuse upstream connections. Defaults to TRUE when absent — the
      # opposite of websocket, deliberately: false sends `Connection: close` and
      # costs a fresh TCP (plus TLS) handshake per request.
      keepalive: true
      # Replace `Host` on the UPSTREAM request only; site matching, WAF evaluation
      # and logging still see the host the client sent. Omit to pass it through.
      # host_header: "internal.example.com"
      # SNI presented to an HTTPS origin when it differs from the address dialled
      # — required when the origin is addressed by IP, since TLS forbids an IP
      # literal as a server name. This is also what the origin's certificate is
      # verified against. Two sites sharing one origin host:port cannot hold
      # different names; the clash is warned and the last site loaded wins. On a
      # plaintext server (tls: false) it is ignored — there is no handshake.
      # sni_name: "app.internal"
    waf:
      mode: blocking                # off | learning | blocking
      paranoia_level: 2             # 1..4 (CRS-style)
      anomaly_threshold: 5
      rules:
        - owasp-crs/v4
        - custom/api-rules
      ml:
        enable: true
        models: [anomaly_v1, payload_classifier_v1]
        sensitivity: 0.85
      rate_limit:
        global: { rps: 1000, burst: 2000 }
        per_ip: { rps: 50, burst: 100 }
      bot_detection:
        ja4: true
        challenge: turnstile        # off | native_pow | hcaptcha | turnstile
      dlp:
        enable: true
        patterns: [credit_card, ssn, api_key, jwt]
      api_discovery: true
      graphql:
        enable: true
        max_depth: 10
        max_complexity: 1000
    plugins:
      - name: jwt-validator
        config: { issuer: "https://auth.example.com", audience: "api" }

logging:
  level: info
  format: json
  outputs:
    - type: stdout
    - type: otlp
      endpoint: "http://otel-collector:4317"
    - type: file
      path: /var/log/sentinel/access.log
      rotate: { size: 100MB, keep: 10 }

storage:
  cache: { backend: memory, size: 512MB }
  kv:    { backend: rocksdb, path: /var/lib/sentinel/kv }

ebpf:
  enable: true
  programs:
    - xdp_ddos_filter
    - tc_ja4_capture
